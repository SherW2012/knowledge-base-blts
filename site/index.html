<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="BLTS 个人知识库">
  <meta name="color-scheme" content="light dark">
  <title>BLTS 知识库</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./vendor/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
  <script src="./knowledge-map.js" defer></script>
  <script src="./knowledge-graph.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <button class="brand-row brand-button" data-route="#/" aria-label="返回知识库首页">
        <span class="brand-mark"><span>K</span></span>
        <span class="brand-copy">
          <span class="brand-title">BLTS 知识库</span>
          <span class="brand-subtitle">持续积累，建立知识之间的联系</span>
        </span>
      </button>

      <label class="search-box">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg>
        <input id="searchInput" type="search" placeholder="搜索全部知识" autocomplete="off">
        <kbd>Ctrl K</kbd>
      </label>

      <div class="nav-caption"><span id="navCaption">知识目录</span><span id="docCount">—</span></div>
      <nav class="tree" id="tree" aria-label="知识库目录">
        <div class="tree-loading">正在生成知识目录…</div>
      </nav>

      <div class="sidebar-footer">
        <span class="sync-dot" id="syncDot"></span>
        <span id="syncText">内容来自 GitHub</span>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-button mobile-only" id="menuButton" aria-label="打开目录">☰</button>
          <div>
            <div class="breadcrumbs" id="breadcrumbs">知识库</div>
            <div class="document-meta" id="documentMeta">Markdown · 自动生成目录</div>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="text-button" id="homeButton">总入口</button>
          <button class="icon-button theme-button" id="themeButton" aria-label="切换深浅主题">◐</button>
        </div>
        <div class="reading-progress" id="readingProgress"></div>
      </header>

      <div class="reading-scroll" id="readingScroll">
        <div class="reading-layout" id="readingLayout">
          <article class="article" id="article">
            <div class="welcome"><div class="welcome-kicker">KNOWLEDGE BASE</div><h1>正在读取知识库</h1></div>
          </article>
          <aside class="page-toc" id="pageToc" aria-label="本文目录"></aside>
        </div>
        <footer class="page-footer">目录由真实 Markdown 文件自动生成</footer>
      </div>
    </main>
  </div>
  <div class="overlay" id="overlay"></div>
  <script src="./app.js"></script>
</body>
</html>
