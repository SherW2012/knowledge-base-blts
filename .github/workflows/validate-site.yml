name: Validate knowledge base

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate and build
        run: npm run check

      - name: Upload private preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-base-site
          path: dist
          retention-days: 7
