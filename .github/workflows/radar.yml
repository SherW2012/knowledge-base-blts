name: Update AI intelligence radar

on:
  push:
    branches: [main]
    paths:
      - "radar/**"
      - "scripts/radar.mjs"
      - ".github/workflows/radar.yml"
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      weekly:
        description: "Force weekly report"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ai-intelligence-radar
  cancel-in-progress: true

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run daily radar
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.weekly != true }}
        run: npm run radar
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}

      - name: Run radar and force weekly report
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.weekly == true }}
        run: npm run radar:weekly
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}

      - name: Commit generated intelligence
        run: |
          git config user.name "BLTS AI Radar"
          git config user.email "actions@users.noreply.github.com"
          git add radar-data "前沿部/AI情报雷达"
          if git diff --cached --quiet; then
            echo "No radar changes to commit."
            exit 0
          fi
          git commit -m "前沿部：更新 AI 情报雷达"
          git push
