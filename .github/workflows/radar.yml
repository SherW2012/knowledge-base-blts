name: Update AI intelligence radar

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/radar.yml"
  workflow_dispatch:
    inputs:
      weekly:
        description: "Force weekly report"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ai-intelligence-radar
  cancel-in-progress: true

jobs:
  radar:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run daily radar in rule mode
        if: ${{ inputs.weekly != true }}
        run: npm run radar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run radar and force weekly report in rule mode
        if: ${{ inputs.weekly == true }}
        run: npm run radar:weekly
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated intelligence
        run: |
          git config user.name "BLTS AI Radar"
          git config user.email "actions@users.noreply.github.com"
          git add radar-data scripts/radar.mjs
          if git diff --cached --quiet; then
            echo "No radar changes to commit."
            exit 0
          fi
          git commit -m "前沿部：更新 AI 情报雷达"
          git pull --rebase origin main
          git push
