<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780" role="img" aria-labelledby="t d"><title id="t">嵌入式交叉开发流程</title><desc id="d">主机上编辑并交叉编译目标代码，烧录到目标板，再通过调试接口在真实硬件上验证。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 22px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:17px 'Microsoft YaHei',sans-serif;fill:#665e57}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1500" height="780" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">开发机和目标设备通常不是同一套处理器环境</text><text x="65" y="110" class="sub">所以代码在主机上编写和构建，最终机器码却必须面向目标板CPU生成并在真实硬件验证</text><rect x="85" y="240" width="430" height="310" rx="30" fill="#eef0e7" stroke="#aab397"/><text x="300" y="300" text-anchor="middle" class="th">开发主机</text><text x="300" y="355" text-anchor="middle" class="tx">编辑器 / IDE</text><text x="300" y="395" text-anchor="middle" class="tx">交叉编译器</text><text x="300" y="435" text-anchor="middle" class="tx">链接器 / 调试器</text><rect x="985" y="240" width="430" height="310" rx="30" fill="#eee7e2" stroke="#baa495"/><text x="1200" y="300" text-anchor="middle" class="th">目标板</text><text x="1200" y="355" text-anchor="middle" class="tx">目标CPU / MCU</text><text x="1200" y="395" text-anchor="middle" class="tx">Flash / RAM / 外设</text><text x="1200" y="435" text-anchor="middle" class="tx">真实实时环境</text><rect x="605" y="300" width="290" height="190" rx="26" fill="#e8efed" stroke="#9bb3ad"/><text x="750" y="350" text-anchor="middle" class="th">下载与调试通道</text><text x="750" y="395" text-anchor="middle" class="tx">JTAG / SWD</text><text x="750" y="430" text-anchor="middle" class="tx">串口 / 网络 / 烧录器</text><path d="M515 395H595" class="ln"/><path d="M895 395H975" class="ln"/><text x="750" y="650" text-anchor="middle" class="tx">最终验证必须覆盖真实外设、真实内存约束和真实时序，而不能只依赖PC上的模拟结果</text></svg>