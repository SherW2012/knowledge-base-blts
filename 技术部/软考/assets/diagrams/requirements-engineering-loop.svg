<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800" role="img" aria-labelledby="t d"><title id="t">需求工程闭环</title><desc id="d">需求从获取、分析、规格说明、验证进入基线，并在变更管理中持续反馈。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 22px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:17px 'Microsoft YaHei',sans-serif;fill:#665e57}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1500" height="800" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">需求工程不是一次性文档，而是一条持续反馈链</text><text x="65" y="110" class="sub">每一步都可能暴露遗漏和冲突，项目变化又会重新触发分析与验证</text><g><rect x="70" y="250" width="225" height="150" rx="24" fill="#eef0e7" stroke="#aab397"/><rect x="355" y="250" width="225" height="150" rx="24" fill="#e8efed" stroke="#9bb3ad"/><rect x="640" y="250" width="225" height="150" rx="24" fill="#eee7e2" stroke="#baa495"/><rect x="925" y="250" width="225" height="150" rx="24" fill="#e9e5ef" stroke="#aaa1b8"/><rect x="1210" y="250" width="225" height="150" rx="24" fill="#f0e7e3" stroke="#c1a196"/></g><text x="182" y="300" text-anchor="middle" class="th">获取</text><text x="182" y="340" text-anchor="middle" class="tx">访谈、观察、原型</text><text x="182" y="370" text-anchor="middle" class="tx">发现真实诉求</text><text x="467" y="300" text-anchor="middle" class="th">分析</text><text x="467" y="340" text-anchor="middle" class="tx">边界、冲突、模型</text><text x="467" y="370" text-anchor="middle" class="tx">形成一致理解</text><text x="752" y="300" text-anchor="middle" class="th">规格说明</text><text x="752" y="340" text-anchor="middle" class="tx">SRS、用例、约束</text><text x="752" y="370" text-anchor="middle" class="tx">把需求稳定表达</text><text x="1037" y="300" text-anchor="middle" class="th">验证与确认</text><text x="1037" y="340" text-anchor="middle" class="tx">完整、一致、可测</text><text x="1037" y="370" text-anchor="middle" class="tx">是否真正满足需要</text><text x="1322" y="300" text-anchor="middle" class="th">基线与管理</text><text x="1322" y="340" text-anchor="middle" class="tx">版本、变更、追踪</text><text x="1322" y="370" text-anchor="middle" class="tx">控制后续变化</text><path d="M295 325H345" class="ln"/><path d="M580 325H630" class="ln"/><path d="M865 325H915" class="ln"/><path d="M1150 325H1200" class="ln"/><path d="M1322 410C1322 610 190 610 190 410" class="ln"/><text x="750" y="665" text-anchor="middle" class="tx">业务变化、设计发现和用户反馈都可能让需求重新回到获取和分析阶段</text></svg>