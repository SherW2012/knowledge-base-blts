<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="t d"><title id="t">私网地址为什么不能直接跨公网</title><desc id="d">多个独立网络可以重复使用同一个RFC1918私网地址，公网因此不能仅凭私网目标地址定位唯一网络</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 22px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:18px 'Microsoft YaHei',sans-serif;fill:#665e57}.em{font:700 17px 'Microsoft YaHei',sans-serif;fill:#6d6256}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1500" height="820" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">私网地址不能直接跨公网 · 问题是“不唯一”</text><text x="65" y="110" class="sub">公网路由表必须能把目标前缀定位到唯一可达方向，而私网地址可以在无数独立网络中重复使用</text><g filter="url(#s)"><rect x="80" y="210" width="330" height="250" rx="28" fill="#e7edec" stroke="#9cadaa"/><rect x="585" y="210" width="330" height="250" rx="28" fill="#eee9e2" stroke="#b9a38f"/><rect x="1090" y="210" width="330" height="250" rx="28" fill="#eef0e8" stroke="#aeb79b"/></g><text x="245" y="270" text-anchor="middle" class="th">公司 A 私网</text><text x="245" y="320" text-anchor="middle" class="tx">192.168.20.30</text><text x="245" y="365" text-anchor="middle" class="em">合法使用</text><text x="750" y="270" text-anchor="middle" class="th">Internet</text><text x="750" y="320" text-anchor="middle" class="tx">收到目标：</text><text x="750" y="360" text-anchor="middle" class="em">192.168.20.30</text><text x="750" y="407" text-anchor="middle" class="tx">“到底是哪一个？”</text><text x="1255" y="270" text-anchor="middle" class="th">公司 B 私网</text><text x="1255" y="320" text-anchor="middle" class="tx">192.168.20.30</text><text x="1255" y="365" text-anchor="middle" class="em">也合法使用</text><path d="M410 335H575" class="ln"/><path d="M1090 335H925" style="fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)"/><g filter="url(#s)"><rect x="185" y="570" width="1130" height="145" rx="28" fill="#ebe8ef" stroke="#a89fb0"/></g><text x="750" y="617" text-anchor="middle" class="th">因此</text><text x="750" y="658" text-anchor="middle" class="tx">企业内部可以给 192.168.20.0/24 配置明确路由；公网却不能把所有人的 192.168.20.0/24 当成同一个全球网络</text><text x="750" y="694" text-anchor="middle" class="em">不是“公网规则变了”，而是公网没有到这个私网前缀的唯一全局路由</text></svg>