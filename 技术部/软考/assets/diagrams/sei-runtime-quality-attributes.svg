<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="t d"><title id="t">运行时架构质量属性及评判标准</title><desc id="d">性能、可用性、安全性和互操作性的关注问题与常用响应度量。</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 25px 'Microsoft YaHei',sans-serif;fill:#48413b}.cap{font:700 17px 'Microsoft YaHei',sans-serif;fill:#514a44}.tx{font:16px 'Microsoft YaHei',sans-serif;fill:#665e57}</style></defs><rect width="1500" height="850" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">运行时质量通过系统对事件的响应来评价</text><text x="65" y="110" class="sub">同一个运行事件可能同时影响多项质量，必须分别写出相应的响应和度量</text>
<g filter="url(#s)"><rect x="55" y="165" width="330" height="590" rx="30" fill="#eef0e7" stroke="#abb399"/><rect x="415" y="165" width="330" height="590" rx="30" fill="#e6efed" stroke="#94afa9"/><rect x="775" y="165" width="330" height="590" rx="30" fill="#ece5df" stroke="#b49d8c"/><rect x="1135" y="165" width="310" height="590" rx="30" fill="#e9e5ef" stroke="#aaa0b8"/></g>
<text x="220" y="220" text-anchor="middle" class="th">性能</text><text x="220" y="260" text-anchor="middle" class="cap">处理事件是否足够及时</text><text x="95" y="320" class="cap">常见刺激</text><text x="95" y="354" class="tx">请求、消息、定时事件</text><text x="95" y="388" class="tx">并发量或数据量增加</text><text x="95" y="445" class="cap">响应度量</text><text x="95" y="479" class="tx">延迟、吞吐量、截止时间</text><text x="95" y="513" class="tx">并发数、资源利用率、抖动</text><text x="95" y="580" class="cap">不能只看平均值</text><text x="95" y="614" class="tx">还需说明峰值和百分位</text>
<text x="580" y="220" text-anchor="middle" class="th">可用性</text><text x="580" y="260" text-anchor="middle" class="cap">需要服务时能否工作</text><text x="455" y="320" class="cap">常见刺激</text><text x="455" y="354" class="tx">节点失效、网络中断</text><text x="455" y="388" class="tx">数据损坏、资源耗尽</text><text x="455" y="445" class="cap">响应度量</text><text x="455" y="479" class="tx">可用度、检测和恢复时间</text><text x="455" y="513" class="tx">数据损失、降级服务范围</text><text x="455" y="580" class="cap">冗余只是手段</text><text x="455" y="614" class="tx">还需检测、切换和恢复</text>
<text x="940" y="220" text-anchor="middle" class="th">安全性</text><text x="940" y="260" text-anchor="middle" class="cap">抵抗未授权行为</text><text x="815" y="320" class="cap">常见刺激</text><text x="815" y="354" class="tx">冒充、越权、篡改</text><text x="815" y="388" class="tx">窃取信息、耗尽资源</text><text x="815" y="445" class="cap">响应度量</text><text x="815" y="479" class="tx">阻断比例、检测时间</text><text x="815" y="513" class="tx">暴露数据量和影响范围</text><text x="815" y="580" class="cap">“用了加密”不是结论</text><text x="815" y="614" class="tx">还需限定威胁和保护对象</text>
<text x="1290" y="220" text-anchor="middle" class="th">互操作性</text><text x="1290" y="260" text-anchor="middle" class="cap">正确交换并理解信息</text><text x="1170" y="320" class="cap">常见刺激</text><text x="1170" y="354" class="tx">外部调用、消息或数据交换</text><text x="1170" y="388" class="tx">协议和格式版本变化</text><text x="1170" y="445" class="cap">响应度量</text><text x="1170" y="479" class="tx">成功率、延迟、转换错误</text><text x="1170" y="513" class="tx">新系统接入工作量</text><text x="1170" y="580" class="cap">传输成功不等于语义一致</text><text x="1170" y="614" class="tx">还需字段和交互约定</text></svg>
