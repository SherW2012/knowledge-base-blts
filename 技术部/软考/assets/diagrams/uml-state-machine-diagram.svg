<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="t d"><title id="t">UML状态机图示例</title><desc id="d">状态机图展示对象状态、事件、守卫条件、动作和状态迁移。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#756d65"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 22px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:17px 'Microsoft YaHei',sans-serif;fill:#5f5851}.ln{stroke:#756d65;stroke-width:2.5;fill:none;marker-end:url(#arr)}</style></defs><rect width="1500" height="820" rx="34" fill="#fbfaf7"/><text x="65" y="70" class="h">状态机图：盯住“同一个对象”的生命周期</text><text x="65" y="108" class="sub">状态机回答：对象当前是什么状态，收到什么事件，在什么条件下，执行什么动作后进入什么状态</text><circle cx="120" cy="355" r="18" fill="#5f5851"/><rect x="210" y="300" width="250" height="110" rx="28" fill="#eef0e7" stroke="#9ea78d"/><text x="335" y="350" text-anchor="middle" class="th">待支付</text><text x="335" y="382" text-anchor="middle" class="tx">do / 等待支付</text><rect x="610" y="300" width="250" height="110" rx="28" fill="#e8efed" stroke="#9bb3ad"/><text x="735" y="350" text-anchor="middle" class="th">已支付</text><text x="735" y="382" text-anchor="middle" class="tx">entry / 记录付款</text><rect x="1010" y="300" width="250" height="110" rx="28" fill="#f0e7e3" stroke="#c1a196"/><text x="1135" y="350" text-anchor="middle" class="th">已发货</text><text x="1135" y="382" text-anchor="middle" class="tx">entry / 写物流号</text><rect x="610" y="550" width="250" height="110" rx="28" fill="#eeeade" stroke="#b7aa83"/><text x="735" y="600" text-anchor="middle" class="th">已取消</text><text x="735" y="632" text-anchor="middle" class="tx">终止正常流转</text><path d="M138 355H210" class="ln"/><path d="M460 355H610" class="ln"/><text x="535" y="325" text-anchor="middle" class="tx">paymentReceived [amount&gt;0] / issueReceipt</text><path d="M860 355H1010" class="ln"/><text x="935" y="325" text-anchor="middle" class="tx">ship</text><path d="M335 410C360 555 470 605 610 605" class="ln"/><text x="420" y="565" class="tx">timeout / releaseStock</text><circle cx="1345" cy="355" r="22" fill="none" stroke="#5f5851" stroke-width="3"/><circle cx="1345" cy="355" r="13" fill="#5f5851"/><path d="M1260 355H1323" class="ln"/><text x="1290" y="330" text-anchor="middle" class="tx">complete</text><rect x="230" y="700" width="1040" height="70" rx="20" fill="#f4f1eb" stroke="#bab1a6"/><text x="750" y="742" text-anchor="middle" class="tx">迁移标注常写为：事件 [守卫条件] / effect；状态内部还可写 entry、do、exit。状态图不是业务步骤流程图。</text></svg>