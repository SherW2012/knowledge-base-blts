<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780" role="img" aria-labelledby="t d"><title id="t">MTTF MTTR MTBF与可用性</title><desc id="d">展示正常运行阶段和修复阶段的时间轴，以及可用性公式。</desc><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 23px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:18px 'Microsoft YaHei',sans-serif;fill:#665e57}.eq{font:700 24px 'Consolas','Microsoft YaHei',sans-serif;fill:#514b46}</style><rect width="1500" height="780" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">可用性由“多久才坏”和“坏了多久能恢复”共同决定</text><text x="65" y="110" class="sub">减少故障频率提高MTTF，缩短恢复时间降低MTTR，两条路线都能提高长期可用时间比例</text><rect x="120" y="260" width="900" height="120" rx="22" fill="#eef0e7" stroke="#aab397"/><rect x="1020" y="260" width="300" height="120" rx="22" fill="#f0e7e3" stroke="#c1a196"/><text x="570" y="315" text-anchor="middle" class="th">正常运行：MTTF</text><text x="570" y="350" text-anchor="middle" class="tx">从恢复到下一次失效的平均运行时间</text><text x="1170" y="315" text-anchor="middle" class="th">修复：MTTR</text><text x="1170" y="350" text-anchor="middle" class="tx">诊断、修复、恢复</text><line x1="120" y1="420" x2="1320" y2="420" stroke="#766f68" stroke-width="4"/><text x="720" y="470" text-anchor="middle" class="th">一个完整故障周期：MTBF = MTTF + MTTR</text><rect x="390" y="555" width="720" height="110" rx="26" fill="#e8efed" stroke="#9bb3ad"/><text x="750" y="605" text-anchor="middle" class="eq">Availability = MTTF / (MTTF + MTTR)</text><text x="750" y="640" text-anchor="middle" class="tx">可用时间 ÷（可用时间 + 不可用恢复时间）</text></svg>