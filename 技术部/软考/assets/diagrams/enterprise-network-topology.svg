<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="t d"><title id="t">企业内部网络搭建</title><desc id="d">展示终端、接入交换机、VLAN、三层核心、防火墙和公网出口之间的典型企业网络结构</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 22px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:18px 'Microsoft YaHei',sans-serif;fill:#665e57}.em{font:700 17px 'Microsoft YaHei',sans-serif;fill:#6d6256}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1500" height="900" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">企业内部组网 · 二层接入、VLAN、三层路由、统一出口</text><text x="65" y="110" class="sub">不同部门先在二层被划入不同VLAN，跨VLAN流量交给三层设备，出公网再经过防火墙/出口网关</text><g filter="url(#s)"><rect x="70" y="200" width="300" height="155" rx="26" fill="#e7edec" stroke="#9cadaa"/><rect x="70" y="475" width="300" height="155" rx="26" fill="#eef0e8" stroke="#aeb79b"/><rect x="470" y="200" width="300" height="155" rx="26" fill="#eee9e2" stroke="#b9a38f"/><rect x="470" y="475" width="300" height="155" rx="26" fill="#ebe8ef" stroke="#a89fb0"/><rect x="865" y="305" width="300" height="220" rx="28" fill="#eee9e2" stroke="#b9a38f"/><rect x="1240" y="305" width="200" height="220" rx="28" fill="#e7edec" stroke="#9cadaa"/></g><text x="220" y="248" text-anchor="middle" class="th">研发终端</text><text x="220" y="290" text-anchor="middle" class="tx">VLAN 10</text><text x="220" y="323" text-anchor="middle" class="tx">192.168.10.0/24</text><text x="220" y="523" text-anchor="middle" class="th">办公终端</text><text x="220" y="565" text-anchor="middle" class="tx">VLAN 20</text><text x="220" y="598" text-anchor="middle" class="tx">192.168.20.0/24</text><text x="620" y="248" text-anchor="middle" class="th">接入交换机</text><text x="620" y="290" text-anchor="middle" class="tx">二层转发 · 看 MAC</text><text x="620" y="323" text-anchor="middle" class="tx">承载 VLAN 10</text><text x="620" y="523" text-anchor="middle" class="th">接入交换机</text><text x="620" y="565" text-anchor="middle" class="tx">二层转发 · 看 MAC</text><text x="620" y="598" text-anchor="middle" class="tx">承载 VLAN 20</text><text x="1015" y="360" text-anchor="middle" class="th">三层交换机 / 核心路由器</text><text x="1015" y="405" text-anchor="middle" class="tx">192.168.10.1</text><text x="1015" y="438" text-anchor="middle" class="tx">192.168.20.1</text><text x="1015" y="480" text-anchor="middle" class="em">负责 VLAN 间路由</text><text x="1340" y="360" text-anchor="middle" class="th">出口防火墙</text><text x="1340" y="405" text-anchor="middle" class="tx">访问控制</text><text x="1340" y="438" text-anchor="middle" class="tx">NAT / 出口策略</text><text x="1340" y="480" text-anchor="middle" class="em">连接 ISP / 公网</text><path d="M370 275H460" class="ln"/><path d="M370 550H460" class="ln"/><path d="M770 275C820 275 820 355 855 355" class="ln"/><path d="M770 550C820 550 820 475 855 475" class="ln"/><path d="M1165 415H1230" class="ln"/><g filter="url(#s)"><rect x="270" y="735" width="960" height="105" rx="26" fill="#fbfaf7" stroke="#b9a38f"/></g><text x="750" y="778" text-anchor="middle" class="th">典型路径</text><text x="750" y="816" text-anchor="middle" class="tx">同VLAN：交换机直接转发　｜　跨VLAN：三层设备路由　｜　访问公网：再经过出口防火墙/NAT</text></svg>