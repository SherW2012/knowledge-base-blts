<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="t d"><title id="t">UML交互概览图示例</title><desc id="d">交互概览图用活动图式控制流组织多个交互片段。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#756d65"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 21px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:17px 'Microsoft YaHei',sans-serif;fill:#5f5851}.ln{stroke:#756d65;stroke-width:2.5;fill:none;marker-end:url(#arr)}</style></defs><rect width="1500" height="820" rx="34" fill="#fbfaf7"/><text x="65" y="70" class="h">交互概览图：用“流程骨架”串起多段复杂交互</text><text x="65" y="108" class="sub">它像活动图，但动作节点可以不是普通动作，而是一个完整的 interaction 或 ref 引用</text><circle cx="180" cy="365" r="18" fill="#5f5851"/><rect x="280" y="300" width="300" height="130" rx="18" fill="#eef0e7" stroke="#9ea78d"/><text x="430" y="342" text-anchor="middle" class="tx">ref</text><text x="430" y="382" text-anchor="middle" class="th">验证用户</text><text x="430" y="415" text-anchor="middle" class="tx">一段独立顺序交互</text><polygon points="720,315 770,365 720,415 670,365" fill="#f0e7e3" stroke="#c1a196"/><text x="720" y="372" text-anchor="middle" class="tx">通过?</text><rect x="900" y="210" width="300" height="130" rx="18" fill="#e8efed" stroke="#9bb3ad"/><text x="1050" y="252" text-anchor="middle" class="tx">ref</text><text x="1050" y="292" text-anchor="middle" class="th">创建订单交互</text><rect x="900" y="490" width="300" height="130" rx="18" fill="#eeeade" stroke="#b7aa83"/><text x="1050" y="532" text-anchor="middle" class="tx">ref</text><text x="1050" y="572" text-anchor="middle" class="th">拒绝请求交互</text><circle cx="1330" cy="365" r="22" fill="none" stroke="#5f5851" stroke-width="3"/><circle cx="1330" cy="365" r="13" fill="#5f5851"/><path d="M198 365H280" class="ln"/><path d="M580 365H670" class="ln"/><path d="M770 350C820 300 850 275 900 275" class="ln"/><text x="825" y="285" class="tx">[是]</text><path d="M770 380C820 445 850 555 900 555" class="ln"/><text x="825" y="485" class="tx">[否]</text><path d="M1200 275C1260 275 1280 330 1310 355" class="ln"/><path d="M1200 555C1260 555 1280 420 1310 375" class="ln"/><rect x="230" y="690" width="1040" height="70" rx="20" fill="#f4f1eb" stroke="#bab1a6"/><text x="750" y="732" text-anchor="middle" class="tx">它适合“交互很多、单张顺序图太长”的场景：上层只编排交互片段，具体消息细节下钻到各自顺序图。</text></svg>