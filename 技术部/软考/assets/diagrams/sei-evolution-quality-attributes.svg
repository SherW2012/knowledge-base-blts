<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="t d"><title id="t">开发与演化质量属性及评判标准</title><desc id="d">可修改性、可测试性和可部署性在开发与演化活动中的评判标准。</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 27px 'Microsoft YaHei',sans-serif;fill:#48413b}.cap{font:700 18px 'Microsoft YaHei',sans-serif;fill:#514a44}.tx{font:17px 'Microsoft YaHei',sans-serif;fill:#665e57}</style></defs><rect width="1500" height="820" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">有些质量在改变、测试和发布系统时才能观察</text><text x="65" y="110" class="sub">它们仍然可以在系统实现前通过具体变化场景评价候选架构</text><g filter="url(#s)"><rect x="65" y="175" width="420" height="540" rx="30" fill="#eef0e7" stroke="#abb399"/><rect x="540" y="175" width="420" height="540" rx="30" fill="#e6efed" stroke="#94afa9"/><rect x="1015" y="175" width="420" height="540" rx="30" fill="#e9e5ef" stroke="#aaa0b8"/></g>
<text x="275" y="235" text-anchor="middle" class="th">可修改性</text><text x="275" y="278" text-anchor="middle" class="cap">完成变化需要多少代价</text><text x="110" y="345" class="cap">刺激</text><text x="110" y="380" class="tx">增加功能、更换技术、调整接口</text><text x="110" y="438" class="cap">响应</text><text x="110" y="473" class="tx">定位并改变相关构件，测试和发布</text><text x="110" y="531" class="cap">度量</text><text x="110" y="566" class="tx">工作量、时间、受影响构件数</text><text x="110" y="601" class="tx">引入缺陷数量</text><text x="110" y="658" class="tx">不是只评价“代码是否整洁”</text>
<text x="750" y="235" text-anchor="middle" class="th">可测试性</text><text x="750" y="278" text-anchor="middle" class="cap">能否控制、观察并定位问题</text><text x="585" y="345" class="cap">刺激</text><text x="585" y="380" class="tx">执行测试、注入故障、替换依赖</text><text x="585" y="438" class="cap">响应</text><text x="585" y="473" class="tx">建立状态、运行、观察并定位</text><text x="585" y="531" class="cap">度量</text><text x="585" y="566" class="tx">准备时间、自动化比例</text><text x="585" y="601" class="tx">发现率和定位时间</text><text x="585" y="658" class="tx">覆盖率不是充分结论</text>
<text x="1225" y="235" text-anchor="middle" class="th">可部署性</text><text x="1225" y="278" text-anchor="middle" class="cap">发布、升级和回退是否可靠</text><text x="1060" y="345" class="cap">刺激</text><text x="1060" y="380" class="tx">发布新版本、扩容、配置或回滚</text><text x="1060" y="438" class="cap">响应</text><text x="1060" y="473" class="tx">验证、部署、切流、检查和回退</text><text x="1060" y="531" class="cap">度量</text><text x="1060" y="566" class="tx">部署时间、停机时间、失败率</text><text x="1060" y="601" class="tx">回退时间和人工步骤数</text><text x="1060" y="658" class="tx">自动化不等于状态可回退</text></svg>
