<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="t d"><title id="t">需求跟踪矩阵</title><desc id="d">需求从来源一路追踪到设计实现和测试，并支持反向追溯</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 21px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:18px 'Microsoft YaHei',sans-serif;fill:#665e57}.em{font:700 18px 'Microsoft YaHei',sans-serif;fill:#6d6256}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1500" height="820" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">RTM · 一条需求后来到底去了哪里</text><text x="65" y="110" class="sub">需求跟踪矩阵把来源、设计、实现和测试连成显式关系，变更时可以直接定位影响范围</text><g filter="url(#s)"><rect x="65" y="185" width="1370" height="390" rx="28" fill="#f4f1eb" stroke="#c5bcaf"/></g><rect x="95" y="220" width="1310" height="70" rx="18" fill="#e7edec" stroke="#9cadaa"/><g class="th" text-anchor="middle"><text x="195" y="263">需求 ID</text><text x="405" y="263">来源</text><text x="655" y="263">设计</text><text x="930" y="263">实现模块</text><text x="1225" y="263">测试用例</text></g><g stroke="#d2cbc1"><rect x="95" y="305" width="1310" height="72" rx="12" fill="#fbfaf7"/><rect x="95" y="392" width="1310" height="72" rx="12" fill="#fbfaf7"/><rect x="95" y="479" width="1310" height="72" rx="12" fill="#fbfaf7"/></g><g class="tx" text-anchor="middle"><text x="195" y="349">R-01</text><text x="405" y="349">用户访谈</text><text x="655" y="349">D-03 登录设计</text><text x="930" y="349">LoginService</text><text x="1225" y="349">TC-01 / 02</text><text x="195" y="436">R-02</text><text x="405" y="436">法规要求</text><text x="655" y="436">D-07 审计设计</text><text x="930" y="436">AuditModule</text><text x="1225" y="436">TC-10 / 11</text><text x="195" y="523">R-03</text><text x="405" y="523">业务部门</text><text x="655" y="523">D-09 订单设计</text><text x="930" y="523">OrderService</text><text x="1225" y="523">TC-18</text></g><g filter="url(#s)"><rect x="115" y="645" width="540" height="100" rx="24" fill="#eef0e8" stroke="#aeb79b"/><rect x="845" y="645" width="540" height="100" rx="24" fill="#ebe8ef" stroke="#a89fb0"/></g><text x="385" y="684" text-anchor="middle" class="th">正向追踪</text><text x="385" y="718" text-anchor="middle" class="tx">需求 → 设计 → 代码 → 测试，确认“每条需求都有落实”</text><text x="1115" y="684" text-anchor="middle" class="th">反向追踪</text><text x="1115" y="718" text-anchor="middle" class="tx">实现 / 测试 → 上游需求，确认“每个实现都有依据”</text><path d="M655 695H835" class="ln"/></svg>