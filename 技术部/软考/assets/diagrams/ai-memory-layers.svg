<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" role="img" aria-labelledby="title desc">
  <title id="title">记忆的两个层次</title><desc id="desc">短期记忆在上下文窗口内、会话结束即消失；长期记忆在外部存储、跨会话保留，二者通过检索与写回相连</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4f493f" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c7a74"/></marker>
    <style>
      .title{font:700 24px Inter,'Microsoft YaHei',sans-serif;fill:#292724}.subtitle{font:400 13px Inter,'Microsoft YaHei',sans-serif;fill:#7c766d}
      .nt{font:700 16px Inter,'Microsoft YaHei',sans-serif}.ns{font:400 12px Inter,'Microsoft YaHei',sans-serif;fill:#6f6a62}
      .tag{font:600 11px Inter,'Microsoft YaHei',sans-serif;fill:#8b8479}.el{font:600 11.5px Inter,'Microsoft YaHei',sans-serif;fill:#716b63}
    </style>
  </defs>
  <rect width="820" height="380" rx="24" fill="#fbfaf7"/>
  <text x="48" y="50" class="title">记忆的两个层次</text><text x="48" y="76" class="subtitle">短期是模型真正的工作记忆，长期需先检索进短期才能被用到</text>

  <rect x="60" y="120" width="300" height="200" rx="18" fill="#e4ebe5" stroke="#5b695f" filter="url(#shadow)"/>
  <text x="84" y="154" class="nt" fill="#4c5a4c">短期记忆</text><text x="84" y="176" class="tag">上下文窗口内</text>
  <rect x="84" y="192" width="252" height="30" rx="8" fill="#eef2ee" stroke="#8fa08f"/><text x="100" y="212" class="ns">本轮对话与工具结果</text>
  <rect x="84" y="230" width="252" height="30" rx="8" fill="#eef2ee" stroke="#8fa08f"/><text x="100" y="250" class="ns">模型唯一能直接使用的记忆</text>
  <rect x="84" y="268" width="252" height="30" rx="8" fill="#eef2ee" stroke="#8fa08f"/><text x="100" y="288" class="ns">会话结束即消失 · 受窗口上限约束</text>

  <rect x="460" y="120" width="300" height="200" rx="18" fill="#e7ebeb" stroke="#536363" filter="url(#shadow)"/>
  <text x="484" y="154" class="nt" fill="#4a5757">长期记忆</text><text x="484" y="176" class="tag">模型之外的存储</text>
  <rect x="484" y="192" width="252" height="30" rx="8" fill="#eef1f1" stroke="#93a3a3"/><text x="500" y="212" class="ns">文件 / 数据库 / 向量库</text>
  <rect x="484" y="230" width="252" height="30" rx="8" fill="#eef1f1" stroke="#93a3a3"/><text x="500" y="250" class="ns">跨会话、跨任务保留 · 容量近乎无限</text>
  <rect x="484" y="268" width="252" height="30" rx="8" fill="#eef1f1" stroke="#93a3a3"/><text x="500" y="288" class="ns">需检索进短期才能被用到</text>

  <path class="edge" d="M460 180 C 410 180, 410 180, 362 180" fill="none" stroke="#7c7a74" stroke-width="1.7" marker-end="url(#arrow)"/><text x="411" y="168" class="el" text-anchor="middle">按需检索注入</text>
  <path class="edge" d="M360 262 C 410 262, 410 262, 458 262" fill="none" stroke="#7c7a74" stroke-width="1.7" marker-end="url(#arrow)"/><text x="411" y="252" class="el" text-anchor="middle">挑选值得留存的写回</text>
</svg>
