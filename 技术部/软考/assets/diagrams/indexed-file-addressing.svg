<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="t d"><title id="t">直接索引与多级间接索引</title><desc id="d">展示直接地址、一级间接地址和二级间接地址的寻址层次与容量增长。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 22px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:17px 'Microsoft YaHei',sans-serif;fill:#665e57}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1500" height="820" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">多级索引用一层地址换来指数级寻址范围</text><text x="65" y="110" class="sub">设每个索引块能保存 N 个块地址：一级间接管理 N 个数据块，二级间接管理 N² 个</text><rect x="80" y="185" width="255" height="500" rx="28" fill="#eef0e7" stroke="#aab397"/><text x="207" y="235" text-anchor="middle" class="th">文件控制结构</text><rect x="125" y="285" width="165" height="70" rx="14" fill="#d7ddd0"/><rect x="125" y="385" width="165" height="70" rx="14" fill="#d7ddd0"/><rect x="125" y="485" width="165" height="70" rx="14" fill="#d7ddd0"/><text x="207" y="328" text-anchor="middle" class="tx">直接地址</text><text x="207" y="428" text-anchor="middle" class="tx">一级间接</text><text x="207" y="528" text-anchor="middle" class="tx">二级间接</text><rect x="520" y="245" width="180" height="90" rx="18" fill="#eee7e2" stroke="#baa495"/><text x="610" y="298" text-anchor="middle" class="tx">数据块</text><path d="M290 320H510" class="ln"/><rect x="470" y="390" width="240" height="105" rx="18" fill="#e8efed" stroke="#9bb3ad"/><text x="590" y="432" text-anchor="middle" class="th">索引块</text><text x="590" y="467" text-anchor="middle" class="tx">N 个数据块地址</text><path d="M290 420H460" class="ln"/><g fill="#e6ddd7" stroke="#b49c8d"><rect x="860" y="365" width="135" height="70" rx="14"/><rect x="1035" y="405" width="135" height="70" rx="14"/><rect x="1210" y="365" width="135" height="70" rx="14"/></g><path d="M710 440C765 405 800 400 850 400" class="ln"/><text x="1100" y="525" text-anchor="middle" class="tx">一级间接：最多 N 个数据块</text><rect x="460" y="555" width="240" height="105" rx="18" fill="#e9e5ef" stroke="#aaa1b8"/><text x="580" y="597" text-anchor="middle" class="th">一级索引块</text><text x="580" y="632" text-anchor="middle" class="tx">N 个二级索引块地址</text><path d="M290 520C365 520 380 600 450 607" class="ln"/><rect x="860" y="575" width="215" height="90" rx="18" fill="#e8efed" stroke="#9bb3ad"/><text x="967" y="610" text-anchor="middle" class="th">二级索引块</text><text x="967" y="643" text-anchor="middle" class="tx">每个再含 N 个数据地址</text><path d="M700 607H850" class="ln"/><text x="1175" y="620" class="th">→ N² 个数据块</text></svg>