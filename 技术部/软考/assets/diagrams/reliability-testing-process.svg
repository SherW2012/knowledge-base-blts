<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#5b554d" flood-opacity=".11"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#8f887d"/></marker>
    <style>.t{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#2f2d2a}.h{font-size:38px;font-weight:700}.s{font-size:20px;fill:#777168}.ch{font-size:23px;font-weight:700}.body{font-size:18px;fill:#625d56}.tag{font-size:18px;font-weight:700;fill:#9b6e5e}</style>
  </defs>
  <rect width="1500" height="900" rx="34" fill="#fbfaf7"/>
  <text class="t h" x="64" y="74">广义可靠性测试包含狭义可靠性试验</text>
  <text class="t s" x="66" y="111">完整工程过程负责定义、执行、分析和评价；狭义试验负责实际运行并产生数据</text>
  <rect x="65" y="175" width="1370" height="590" rx="34" fill="#f1eee7" stroke="#cfc3b4" stroke-width="2"/>
  <text class="t tag" x="105" y="220">广义可靠性测试</text>
  <g filter="url(#shadow)">
    <rect x="105" y="300" width="205" height="160" rx="24" fill="#eef0e8" stroke="#aeb99b"/>
    <rect x="350" y="300" width="205" height="160" rx="24" fill="#e7f0ef" stroke="#95b7b3"/>
    <rect x="595" y="270" width="310" height="220" rx="28" fill="#eeeaf3" stroke="#a999c4" stroke-width="2"/>
    <rect x="945" y="300" width="205" height="160" rx="24" fill="#f2e9e5" stroke="#cba796"/>
    <rect x="1190" y="300" width="205" height="160" rx="24" fill="#eef0e8" stroke="#aeb99b"/>
  </g>
  <text class="t ch" x="207" y="350" text-anchor="middle">确定目标</text><text class="t body" x="207" y="392" text-anchor="middle">指标 · 环境</text><text class="t body" x="207" y="424" text-anchor="middle">失效判据</text>
  <text class="t ch" x="452" y="350" text-anchor="middle">运行剖面</text><text class="t body" x="452" y="392" text-anchor="middle">操作及其</text><text class="t body" x="452" y="424" text-anchor="middle">真实概率</text>
  <text class="t tag" x="625" y="309">狭义可靠性试验</text><text class="t ch" x="750" y="360" text-anchor="middle">在预期环境中运行软件</text><text class="t body" x="750" y="405" text-anchor="middle">按预定用例执行用户操作</text><text class="t body" x="750" y="438" text-anchor="middle">记录运行量、失效和恢复数据</text>
  <text class="t ch" x="1047" y="350" text-anchor="middle">统计建模</text><text class="t body" x="1047" y="392" text-anchor="middle">失效强度</text><text class="t body" x="1047" y="424" text-anchor="middle">趋势与预测</text>
  <text class="t ch" x="1292" y="350" text-anchor="middle">评价改进</text><text class="t body" x="1292" y="392" text-anchor="middle">比较目标</text><text class="t body" x="1292" y="424" text-anchor="middle">形成结论</text>
  <path d="M310 380H334M555 380H579M905 380H929M1150 380H1174" stroke="#8f887d" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1292 475V625H207V476" fill="none" stroke="#a58b7b" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow)"/>
  <text class="t body" x="750" y="665" text-anchor="middle">评价和失效分析会反向修订目标、剖面、用例与软件版本</text>
  <rect x="300" y="790" width="900" height="62" rx="20" fill="#eeeaf3" stroke="#b8a9cd"/>
  <text class="t ch" x="750" y="830" text-anchor="middle">“实际执行软件”只是完整可靠性测试过程中的一个核心环节</text>
</svg>

