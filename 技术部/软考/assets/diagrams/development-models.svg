<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">软件开发模型关注什么差异</title><desc id="desc">关键不是名称，而是阶段如何排列、反馈何时发生、风险何时处理</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#4f493f" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c7a74"/></marker>
    <style>
      .title{font:700 25px Inter,'Microsoft YaHei',sans-serif;fill:#292724}.subtitle{font:400 13px Inter,'Microsoft YaHei',sans-serif;fill:#7c766d}
      .group{font:700 12px Inter,'Microsoft YaHei',sans-serif;fill:#8b8479;letter-spacing:.08em}.node-title{font:700 15px Inter,'Microsoft YaHei',sans-serif}.node-sub{font:400 12px Inter,'Microsoft YaHei',sans-serif;fill:#6f6a62}
      .edge{fill:none;stroke:#7c7a74;stroke-width:1.55;marker-end:url(#arrow)}.edge-label{font:600 11px Inter,'Microsoft YaHei',sans-serif;fill:#716b63}
      .note-title{font:700 12px Inter,'Microsoft YaHei',sans-serif;fill:#667166}.note{font:500 13px Inter,'Microsoft YaHei',sans-serif;fill:#514c45}
    </style>
  </defs>
  <rect width="960" height="560" rx="24" fill="#fbfaf7"/>
  <text x="48" y="50" class="title">软件开发模型关注什么差异</text><text x="48" y="76" class="subtitle">关键不是名称，而是阶段如何排列、反馈何时发生、风险何时处理</text>
  
  <rect x="48" y="112" width="268" height="150" rx="18" fill="#e7ebeb" stroke="#9aa7a6"/><text x="182" y="145" class="node-title" text-anchor="middle" fill="#536363">顺序推进</text><text x="182" y="176" class="node-sub" text-anchor="middle">瀑布 · V模型</text><path class="edge" d="M83 212 L281 212"/><text x="182" y="238" class="node-sub" text-anchor="middle">阶段边界清楚，反馈较晚</text>
  <rect x="346" y="112" width="268" height="150" rx="18" fill="#e7ece6" stroke="#95a192"/><text x="480" y="145" class="node-title" text-anchor="middle" fill="#596657">循环改进</text><text x="480" y="176" class="node-sub" text-anchor="middle">迭代 · 原型 · 喷泉</text><path d="M420 220 C420 180 540 180 540 220 C540 252 440 252 420 220" class="edge"/><text x="480" y="238" class="node-sub" text-anchor="middle">反复验证并修正同一成果</text>
  <rect x="644" y="112" width="268" height="150" rx="18" fill="#eee6e3" stroke="#b39b95"/><text x="778" y="145" class="node-title" text-anchor="middle" fill="#6f5c54">分批交付</text><text x="778" y="176" class="node-sub" text-anchor="middle">增量开发</text><rect x="687" y="205" width="45" height="28" rx="6" fill="#d7c4bc"/><rect x="738" y="190" width="45" height="43" rx="6" fill="#c8aea4"/><rect x="789" y="175" width="45" height="58" rx="6" fill="#b99b90"/><text x="778" y="249" class="node-sub" text-anchor="middle">每批增加可用功能</text>
  <rect x="197" y="322" width="566" height="132" rx="20" fill="#ece8ee" stroke="#a097a5"/><text x="480" y="356" class="node-title" text-anchor="middle" fill="#685f6d">风险驱动 · 螺旋模型</text><text x="480" y="387" class="node-sub" text-anchor="middle">每一圈：确定目标 → 识别风险 → 开发验证 → 计划下一圈</text><path d="M380 421 C430 372 550 380 570 421 C580 450 420 466 380 421" class="edge"/>

  </svg>
