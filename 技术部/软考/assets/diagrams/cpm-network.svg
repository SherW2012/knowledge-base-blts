<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="t d"><title id="t">关键路径网络示例</title><desc id="d">活动A后分为B和C两路，最终汇合到D，展示最长路径决定总工期。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 22px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:18px 'Microsoft YaHei',sans-serif;fill:#665e57}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}.crit{fill:none;stroke:#b47f68;stroke-width:6;marker-end:url(#a)}</style></defs><rect width="1500" height="820" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">关键路径是网络中决定项目最短工期的最长时间路径</text><text x="65" y="110" class="sub">活动有多个前驱时必须等最晚完成者，因此网络依赖关系与持续时间共同决定结果</text><g><rect x="100" y="340" width="180" height="110" rx="22" fill="#eef0e7" stroke="#aab397"/><rect x="390" y="220" width="190" height="110" rx="22" fill="#eee7e2" stroke="#baa495"/><rect x="390" y="480" width="190" height="110" rx="22" fill="#e8efed" stroke="#9bb3ad"/><rect x="730" y="220" width="190" height="110" rx="22" fill="#eee7e2" stroke="#baa495"/><rect x="730" y="480" width="190" height="110" rx="22" fill="#e8efed" stroke="#9bb3ad"/><rect x="1080" y="340" width="190" height="110" rx="22" fill="#f0e7e3" stroke="#c1a196"/></g><text x="190" y="382" text-anchor="middle" class="th">A</text><text x="190" y="418" text-anchor="middle" class="tx">3天</text><text x="485" y="262" text-anchor="middle" class="th">B</text><text x="485" y="298" text-anchor="middle" class="tx">5天</text><text x="485" y="522" text-anchor="middle" class="th">C</text><text x="485" y="558" text-anchor="middle" class="tx">2天</text><text x="825" y="262" text-anchor="middle" class="th">D</text><text x="825" y="298" text-anchor="middle" class="tx">4天</text><text x="825" y="522" text-anchor="middle" class="th">E</text><text x="825" y="558" text-anchor="middle" class="tx">3天</text><text x="1175" y="382" text-anchor="middle" class="th">F</text><text x="1175" y="418" text-anchor="middle" class="tx">2天</text><path d="M280 380C330 330 345 290 380 275" class="crit"/><path d="M280 410C330 460 345 520 380 535" class="ln"/><path d="M580 275H720" class="crit"/><path d="M580 535H720" class="ln"/><path d="M920 275C980 290 1015 345 1070 380" class="crit"/><path d="M920 535C980 510 1015 445 1070 410" class="ln"/><text x="750" y="700" text-anchor="middle" class="th">上支路：3+5+4+2 = 14天　下支路：3+2+3+2 = 10天</text><text x="750" y="742" text-anchor="middle" class="tx">因此上支路活动没有总时差，构成当前关键路径</text></svg>