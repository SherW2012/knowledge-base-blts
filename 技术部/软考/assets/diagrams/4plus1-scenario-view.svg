<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="t d"><title id="t">提交订单场景贯穿验证四个主体视图</title><desc id="d">展示用户提交订单的交互步骤，并说明这些步骤如何验证逻辑、开发、进程和物理视图。</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#40372f" flood-opacity=".1"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#92897f"/></marker><style>.T{font:700 39px 'Microsoft YaHei';fill:#22201d}.S{font:20px 'Microsoft YaHei';fill:#786f66}.H{font:700 23px 'Microsoft YaHei';fill:#5d554d}.P{font:18px 'Microsoft YaHei';fill:#6d645c}.L{fill:none;stroke:#92897f;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1400" height="820" rx="38" fill="#fbfaf7"/><text x="65" y="75" class="T">场景视图 · 用关键用例贯穿并验证四个视图</text><text x="65" y="112" class="S">场景不是第五套结构，而是一条真实行为路径：提交订单能否在每个视图中找到依据</text><g filter="url(#s)"><rect x="80" y="180" width="220" height="110" rx="55" fill="#eee9df" stroke="#b7a98e"/><rect x="370" y="180" width="230" height="110" rx="25" fill="#e7edec" stroke="#9cadaa"/><rect x="670" y="180" width="230" height="110" rx="25" fill="#ebe8ef" stroke="#a89fb0"/><rect x="970" y="180" width="230" height="110" rx="25" fill="#f0e8e4" stroke="#b89e94"/><rect x="1240" y="180" width="110" height="110" rx="55" fill="#eee9df" stroke="#b7a98e"/></g><text x="190" y="228" text-anchor="middle" class="H">用户</text><text x="190" y="263" text-anchor="middle" class="P">提交订单</text><text x="485" y="228" text-anchor="middle" class="H">订单校验</text><text x="485" y="263" text-anchor="middle" class="P">创建订单</text><text x="785" y="228" text-anchor="middle" class="H">预留库存</text><text x="785" y="263" text-anchor="middle" class="P">返回结果</text><text x="1085" y="228" text-anchor="middle" class="H">发布事件</text><text x="1085" y="263" text-anchor="middle" class="P">异步通知</text><text x="1295" y="245" text-anchor="middle" class="H">完成</text><path d="M300 235H370" class="L"/><path d="M600 235H670" class="L"/><path d="M900 235H970" class="L"/><path d="M1200 235H1240" class="L"/>
<text x="65" y="380" class="H">场景对四个主体视图的验证</text><g filter="url(#s)"><rect x="70" y="425" width="290" height="245" rx="28" fill="#e7edec" stroke="#9cadaa"/><rect x="390" y="425" width="290" height="245" rx="28" fill="#f0e8e4" stroke="#b89e94"/><rect x="710" y="425" width="290" height="245" rx="28" fill="#ebe8ef" stroke="#a89fb0"/><rect x="1030" y="425" width="300" height="245" rx="28" fill="#eee9df" stroke="#b7a98e"/></g><text x="215" y="475" text-anchor="middle" class="H">逻辑视图</text><text x="105" y="520" class="P">订单、库存、通知等</text><text x="105" y="557" class="P">职责是否完整，协作</text><text x="105" y="594" class="P">关系是否支持该场景</text><text x="535" y="475" text-anchor="middle" class="H">开发视图</text><text x="425" y="520" class="P">对应代码组件是否存在</text><text x="425" y="557" class="P">依赖方向和接口是否</text><text x="425" y="594" class="P">能够实现这些步骤</text><text x="855" y="475" text-anchor="middle" class="H">进程视图</text><text x="745" y="520" class="P">同步调用、异步消息</text><text x="745" y="557" class="P">并发与故障处理是否</text><text x="745" y="594" class="P">满足运行要求</text><text x="1180" y="475" text-anchor="middle" class="H">物理视图</text><text x="1065" y="520" class="P">相关进程部署在哪些节点</text><text x="1065" y="557" class="P">网络、容量与冗余是否</text><text x="1065" y="594" class="P">支持端到端执行</text><rect x="265" y="720" width="870" height="60" rx="24" fill="#f3efe8" stroke="#cabfaf"/><text x="700" y="758" text-anchor="middle" class="H">任何一步在某个视图中没有对应结构，都说明架构描述可能不完整</text></svg>

