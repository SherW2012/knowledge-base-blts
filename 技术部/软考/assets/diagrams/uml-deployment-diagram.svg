<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800" role="img" aria-labelledby="t d"><title id="t">UML部署图示例</title><desc id="d">部署图展示节点、执行环境、制品以及节点之间的通信路径。</desc><defs><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 22px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:17px 'Microsoft YaHei',sans-serif;fill:#5f5851}.ln{stroke:#756d65;stroke-width:2.5;fill:none}</style></defs><rect width="1500" height="800" rx="34" fill="#fbfaf7"/><text x="65" y="70" class="h">部署图：看“软件制品最后运行在哪些节点上”</text><text x="65" y="108" class="sub">节点可以是物理设备，也可以是具有执行能力的软件执行环境；制品则是被部署的可交付实体</text><g><rect x="100" y="235" width="360" height="300" rx="20" fill="#eef0e7" stroke="#9ea78d"/><path d="M100 235l30-28h360l-30 28z" fill="#f6f7f1" stroke="#9ea78d"/><text x="280" y="285" text-anchor="middle" class="th">«device» Web Server</text><rect x="160" y="335" width="240" height="120" rx="14" fill="#fbfaf7" stroke="#bab1a6"/><text x="280" y="380" text-anchor="middle" class="tx">«executionEnvironment»</text><text x="280" y="415" text-anchor="middle" class="th">Nginx</text></g><g><rect x="570" y="205" width="390" height="360" rx="20" fill="#e8efed" stroke="#9bb3ad"/><path d="M570 205l30-28h390l-30 28z" fill="#f3f8f7" stroke="#9bb3ad"/><text x="765" y="255" text-anchor="middle" class="th">«device» App Server</text><rect x="635" y="315" width="260" height="150" rx="14" fill="#fbfaf7" stroke="#bab1a6"/><text x="765" y="355" text-anchor="middle" class="tx">«artifact»</text><text x="765" y="393" text-anchor="middle" class="th">order-service.jar</text><text x="765" y="430" text-anchor="middle" class="tx">deployed on JVM</text></g><g><rect x="1080" y="235" width="320" height="300" rx="20" fill="#f0e7e3" stroke="#c1a196"/><path d="M1080 235l30-28h320l-30 28z" fill="#faf4f1" stroke="#c1a196"/><text x="1240" y="285" text-anchor="middle" class="th">«device» DB Server</text><rect x="1135" y="350" width="210" height="100" rx="14" fill="#fbfaf7" stroke="#bab1a6"/><text x="1240" y="390" text-anchor="middle" class="tx">«executionEnvironment»</text><text x="1240" y="425" text-anchor="middle" class="th">PostgreSQL</text></g><line x1="460" y1="385" x2="570" y2="385" class="ln"/><text x="515" y="365" text-anchor="middle" class="tx">HTTPS</text><line x1="960" y1="385" x2="1080" y2="385" class="ln"/><text x="1020" y="365" text-anchor="middle" class="tx">TCP</text><rect x="245" y="620" width="1010" height="90" rx="22" fill="#f4f1eb" stroke="#bab1a6"/><text x="750" y="658" text-anchor="middle" class="th">构件图看“软件模块怎么组成”，部署图看“运行时这些制品放到哪里”</text><text x="750" y="692" text-anchor="middle" class="tx">节点之间的连线是通信路径，不是类之间的关联，也不是顺序图里的消息。</text></svg>