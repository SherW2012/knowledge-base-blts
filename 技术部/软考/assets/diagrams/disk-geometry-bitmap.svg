<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#5b554d" flood-opacity=".11"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#8f887d"/></marker>
    <style>.t{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#2f2d2a}.h{font-size:38px;font-weight:700}.s{font-size:20px;fill:#777168}.ch{font-size:25px;font-weight:700}.body{font-size:18px;fill:#625d56}.tag{font-size:18px;font-weight:700;fill:#9b6e5e}.wire{stroke:#8f887d;stroke-width:4;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1500" height="900" rx="34" fill="#fbfaf7"/>
  <text class="t h" x="64" y="74">从磁盘物理结构到空闲空间位示图</text>
  <text class="t s" x="66" y="111">先确定分配单位总数，再为每个单位设置一个状态位</text>
  <g filter="url(#shadow)">
    <rect x="65" y="180" width="415" height="520" rx="30" fill="#eef0e8" stroke="#aeb99b"/>
    <rect x="545" y="180" width="410" height="520" rx="30" fill="#e7f0ef" stroke="#95b7b3"/>
    <rect x="1020" y="180" width="415" height="520" rx="30" fill="#eeeaf3" stroke="#b8a9cd"/>
  </g>
  <text class="t ch" x="272" y="230" text-anchor="middle">物理几何结构</text>
  <ellipse cx="270" cy="410" rx="145" ry="145" fill="#fbfaf7" stroke="#879f99" stroke-width="4"/>
  <ellipse cx="270" cy="410" rx="105" ry="105" fill="none" stroke="#9eb1a5" stroke-width="3"/>
  <ellipse cx="270" cy="410" rx="65" ry="65" fill="none" stroke="#9eb1a5" stroke-width="3"/>
  <circle cx="270" cy="410" r="24" fill="#d8d1c5"/>
  <path d="M270 265V386M168 308L253 393M125 410H246M168 512L253 427M270 555V434M372 512L287 427M415 410H294M372 308L287 393" stroke="#c3b7a8" stroke-width="2"/>
  <path d="M270 410L270 265A145 145 0 0 1 372 308Z" fill="#c99d8b" opacity=".5"/>
  <path d="M430 300L350 350" stroke="#8f887d" stroke-width="5"/><circle cx="350" cy="350" r="9" fill="#8f887d"/>
  <text class="t body" x="118" y="610">同心圆：磁道</text><text class="t body" x="285" y="610">扇形区域：扇区</text><text class="t body" x="118" y="648">每个有效盘面通常对应一个磁头</text>
  <text class="t ch" x="750" y="230" text-anchor="middle">分配单位数量</text>
  <rect x="600" y="285" width="300" height="105" rx="22" fill="#fbfaf7" stroke="#95b7b3"/>
  <text class="t body" x="750" y="325" text-anchor="middle">盘面数 H × 每面磁道数 T</text><text class="t body" x="750" y="360" text-anchor="middle">× 每磁道扇区数 S</text>
  <text class="t tag" x="750" y="430" text-anchor="middle">得到扇区总数</text>
  <path d="M750 458V500" stroke="#8f887d" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="600" y="515" width="300" height="115" rx="22" fill="#f1eee7" stroke="#d3c8b9"/>
  <text class="t body" x="750" y="555" text-anchor="middle">若多个扇区组成一个磁盘块</text><text class="t body" x="750" y="590" text-anchor="middle">应改用磁盘块总数</text>
  <text class="t body" x="750" y="665" text-anchor="middle">一个位代表什么，必须先由分配单位确定</text>
  <text class="t ch" x="1227" y="230" text-anchor="middle">位示图</text>
  <g transform="translate(1080 285)">
    <rect x="0" y="0" width="294" height="224" rx="18" fill="#fbfaf7" stroke="#b8a9cd"/>
    <g font-family="Consolas,monospace" font-size="22" text-anchor="middle">
      <g fill="#6f938f"><rect x="18" y="22" width="40" height="36" rx="8"/><rect x="62" y="22" width="40" height="36" rx="8"/><rect x="150" y="22" width="40" height="36" rx="8"/><rect x="238" y="22" width="40" height="36" rx="8"/></g>
      <g fill="#c6b7d7"><rect x="106" y="22" width="40" height="36" rx="8"/><rect x="194" y="22" width="40" height="36" rx="8"/></g>
      <g fill="#6f938f"><rect x="18" y="66" width="40" height="36" rx="8"/><rect x="106" y="66" width="40" height="36" rx="8"/><rect x="150" y="66" width="40" height="36" rx="8"/><rect x="194" y="66" width="40" height="36" rx="8"/></g>
      <g fill="#c6b7d7"><rect x="62" y="66" width="40" height="36" rx="8"/><rect x="238" y="66" width="40" height="36" rx="8"/></g>
      <text x="38" y="49" fill="#fff">1</text><text x="82" y="49" fill="#fff">1</text><text x="126" y="49" fill="#fff">0</text><text x="170" y="49" fill="#fff">1</text><text x="214" y="49" fill="#fff">0</text><text x="258" y="49" fill="#fff">1</text>
      <text x="38" y="93" fill="#fff">1</text><text x="82" y="93" fill="#fff">0</text><text x="126" y="93" fill="#fff">1</text><text x="170" y="93" fill="#fff">1</text><text x="214" y="93" fill="#fff">1</text><text x="258" y="93" fill="#fff">0</text>
    </g>
    <text class="t body" x="147" y="154" text-anchor="middle">每个分配单位对应一个状态位</text>
    <text class="t body" x="147" y="191" text-anchor="middle">0空闲 / 1已分配（也可反向约定）</text>
  </g>
  <text class="t tag" x="1227" y="555" text-anchor="middle">N个分配单位 → N bit</text>
  <text class="t body" x="1227" y="600" text-anchor="middle">普通换算：向上取整(N ÷ 8) Byte</text>
  <text class="t body" x="1227" y="637" text-anchor="middle">按w位字存放：向上取整(N ÷ w)个字</text>
  <path class="wire" d="M480 440H529"/><path class="wire" d="M955 440H1004"/>
  <rect x="175" y="770" width="1150" height="80" rx="24" fill="#f2e9e5" stroke="#cba796"/>
  <text class="t ch" x="750" y="818" text-anchor="middle">检查顺序：盘面与磁道 → 扇区或磁盘块 → 一单位一位 → 字节换算与字对齐</text>
</svg>
