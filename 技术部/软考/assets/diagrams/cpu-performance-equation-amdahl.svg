<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="t d"><title id="t">CPU执行时间公式与Amdahl局部加速</title><desc id="d">左侧展示CPU执行时间分解，右侧展示局部加速后不可优化部分限制整体性能。</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 23px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:18px 'Microsoft YaHei',sans-serif;fill:#665e57}.eq{font:700 25px 'Consolas','Microsoft YaHei',sans-serif;fill:#514b46}</style></defs><rect width="1500" height="820" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">性能优化要同时看公式和优化范围</text><text x="65" y="110" class="sub">单个参数变快并不等于整个系统按同样倍数变快</text><g filter="url(#s)"><rect x="70" y="190" width="635" height="500" rx="30" fill="#eef0e7" stroke="#aab397"/><rect x="795" y="190" width="635" height="500" rx="30" fill="#eee7e2" stroke="#baa495"/></g><text x="388" y="245" text-anchor="middle" class="th">CPU执行时间的三项来源</text><text x="388" y="315" text-anchor="middle" class="eq">T = I × CPI ÷ f</text><text x="155" y="390" class="th">I：指令条数</text><text x="155" y="430" class="tx">算法、编译器、指令集都会改变</text><text x="155" y="500" class="th">CPI：每条指令平均周期</text><text x="155" y="540" class="tx">流水线、缓存、分支等都会改变</text><text x="155" y="610" class="th">f：主频</text><text x="155" y="650" class="tx">主频提高只作用于公式中的一个因素</text><text x="1112" y="245" text-anchor="middle" class="th">Amdahl：局部加速的整体上限</text><rect x="870" y="320" width="430" height="72" rx="18" fill="#d7ddd0"/><rect x="1300" y="320" width="70" height="72" rx="18" fill="#c79f8e"/><text x="1085" y="365" text-anchor="middle" class="tx">不可优化部分 60%</text><text x="1335" y="365" text-anchor="middle" class="tx">40%</text><text x="1112" y="450" text-anchor="middle" class="eq">Speedup = 1 / [(1-P) + P/S]</text><text x="1112" y="515" text-anchor="middle" class="tx">P=40%，局部加速 S=4</text><text x="1112" y="555" text-anchor="middle" class="eq">1 / (0.6 + 0.4/4) ≈ 1.43</text><text x="1112" y="625" text-anchor="middle" class="tx">即使局部无限快，60%的原有时间仍然存在</text></svg>