<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780" role="img" aria-labelledby="t d"><title id="t">UML构件图示例</title><desc id="d">构件图展示软件构件、提供接口、需要接口和依赖关系。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#756d65"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 22px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:17px 'Microsoft YaHei',sans-serif;fill:#5f5851}.ln{stroke:#756d65;stroke-width:2.5;fill:none}.dash{stroke:#756d65;stroke-width:2.5;fill:none;stroke-dasharray:10 8}</style></defs><rect width="1500" height="780" rx="34" fill="#fbfaf7"/><text x="65" y="70" class="h">构件图：看“可替换的软件单元怎样通过接口拼起来”</text><text x="65" y="108" class="sub">关注实现层的大块软件单元，不展开类内部细节，也不负责说明物理机器</text><g><rect x="90" y="220" width="340" height="190" rx="18" fill="#eef0e7" stroke="#9ea78d"/><rect x="365" y="245" width="38" height="25" fill="#fbfaf7" stroke="#756d65"/><rect x="365" y="290" width="38" height="25" fill="#fbfaf7" stroke="#756d65"/><text x="260" y="300" text-anchor="middle" class="th">Web Frontend</text><text x="260" y="340" text-anchor="middle" class="tx">«component»</text></g><g><rect x="580" y="220" width="340" height="190" rx="18" fill="#e8efed" stroke="#9bb3ad"/><rect x="855" y="245" width="38" height="25" fill="#fbfaf7" stroke="#756d65"/><rect x="855" y="290" width="38" height="25" fill="#fbfaf7" stroke="#756d65"/><text x="750" y="300" text-anchor="middle" class="th">Order Service</text><text x="750" y="340" text-anchor="middle" class="tx">«component»</text></g><g><rect x="1070" y="220" width="340" height="190" rx="18" fill="#f0e7e3" stroke="#c1a196"/><rect x="1345" y="245" width="38" height="25" fill="#fbfaf7" stroke="#756d65"/><rect x="1345" y="290" width="38" height="25" fill="#fbfaf7" stroke="#756d65"/><text x="1240" y="300" text-anchor="middle" class="th">Payment Adapter</text><text x="1240" y="340" text-anchor="middle" class="tx">«component»</text></g><line x1="430" y1="315" x2="555" y2="315" class="ln"/><circle cx="555" cy="315" r="16" fill="#fbfaf7" stroke="#756d65" stroke-width="2.5"/><text x="495" y="285" text-anchor="middle" class="tx">需要/提供接口连接</text><line x1="920" y1="315" x2="1040" y2="315" class="ln"/><path d="M1040 299A16 16 0 0 0 1040 331" class="ln"/><circle cx="920" cy="315" r="16" fill="#fbfaf7" stroke="#756d65" stroke-width="2.5"/><text x="980" y="285" text-anchor="middle" class="tx">接口契约</text><path d="M750 410V515H1240V420" class="dash" marker-end="url(#arr)"/><text x="995" y="495" text-anchor="middle" class="tx">依赖关系也可显式表达</text><rect x="190" y="590" width="1120" height="105" rx="24" fill="#f4f1eb" stroke="#bab1a6"/><text x="750" y="632" text-anchor="middle" class="th">构件图回答的是“软件由哪些可部署、可替换单元组成，它们通过什么接口协作”</text><text x="750" y="670" text-anchor="middle" class="tx">常见构件：服务、模块、库、插件、适配器；部署到哪台机器则交给部署图。</text></svg>