<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="t d"><title id="t">数据库设计过程</title><desc id="d">从需求分析、概念结构、逻辑结构、物理结构到实施维护的数据库设计流程</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 22px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:17px 'Microsoft YaHei',sans-serif;fill:#665e57}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}.back{fill:none;stroke:#b09282;stroke-width:2.5;stroke-dasharray:9 8;marker-end:url(#a)}</style></defs><rect width="1500" height="850" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">数据库设计逐步把业务语义落实为可运行结构</text><text x="65" y="110" class="sub">每一阶段都有自己的问题和产物，后续验证可以推动前序修正</text>
<g filter="url(#s)"><rect x="55" y="220" width="250" height="240" rx="26" fill="#eef0e8" stroke="#aeb79b"/><rect x="340" y="220" width="250" height="240" rx="26" fill="#e6efed" stroke="#94afa9"/><rect x="625" y="220" width="250" height="240" rx="26" fill="#eee9e2" stroke="#b9a38f"/><rect x="910" y="220" width="250" height="240" rx="26" fill="#ebe7f0" stroke="#aaa0bf"/><rect x="1195" y="220" width="250" height="240" rx="26" fill="#f1e7e3" stroke="#c1a095"/></g>
<text x="180" y="270" text-anchor="middle" class="th">需求分析</text><text x="180" y="315" text-anchor="middle" class="tx">数据范围 · 业务规则</text><text x="180" y="350" text-anchor="middle" class="tx">操作 · 性能 · 安全</text><text x="180" y="410" text-anchor="middle" class="th">数据字典与需求说明</text><text x="465" y="270" text-anchor="middle" class="th">概念结构设计</text><text x="465" y="315" text-anchor="middle" class="tx">实体 · 属性 · 联系</text><text x="465" y="350" text-anchor="middle" class="tx">基数与参与约束</text><text x="465" y="410" text-anchor="middle" class="th">ER模型</text><text x="750" y="270" text-anchor="middle" class="th">逻辑结构设计</text><text x="750" y="315" text-anchor="middle" class="tx">关系模式 · 键 · 外键</text><text x="750" y="350" text-anchor="middle" class="tx">规范化与完整性</text><text x="750" y="410" text-anchor="middle" class="th">逻辑模式</text><text x="1035" y="270" text-anchor="middle" class="th">物理结构设计</text><text x="1035" y="315" text-anchor="middle" class="tx">索引 · 分区 · 存储</text><text x="1035" y="350" text-anchor="middle" class="tx">访问路径与容量</text><text x="1035" y="410" text-anchor="middle" class="th">物理设计方案</text><text x="1320" y="270" text-anchor="middle" class="th">实施与维护</text><text x="1320" y="315" text-anchor="middle" class="tx">建库 · 装载 · 测试</text><text x="1320" y="350" text-anchor="middle" class="tx">监控 · 备份 · 调整</text><text x="1320" y="410" text-anchor="middle" class="th">运行数据库</text><path d="M305 340H330" class="ln"/><path d="M590 340H615" class="ln"/><path d="M875 340H900" class="ln"/><path d="M1160 340H1185" class="ln"/><path d="M1320 475C1320 655 465 655 465 475" class="back"/><text x="890" y="625" text-anchor="middle" class="sub">运行验证发现语义或性能问题时，返回相应阶段修正</text>
<rect x="310" y="700" width="880" height="75" rx="20" fill="#f4f1eb" stroke="#c5bcaf"/><text x="750" y="747" text-anchor="middle" class="th">逻辑设计决定“数据表示什么”，物理设计决定“怎样更高效地访问”</text></svg>
