<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">计算机存储层次</title><desc id="desc">越靠近CPU通常越快、越小、越昂贵；越向下容量越大、持久性越强</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#4f493f" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c7a74"/></marker>
    <style>
      .title{font:700 25px Inter,'Microsoft YaHei',sans-serif;fill:#292724}.subtitle{font:400 13px Inter,'Microsoft YaHei',sans-serif;fill:#7c766d}
      .group{font:700 12px Inter,'Microsoft YaHei',sans-serif;fill:#8b8479;letter-spacing:.08em}.node-title{font:700 15px Inter,'Microsoft YaHei',sans-serif}.node-sub{font:400 12px Inter,'Microsoft YaHei',sans-serif;fill:#6f6a62}
      .edge{fill:none;stroke:#7c7a74;stroke-width:1.55;marker-end:url(#arrow)}.edge-label{font:600 11px Inter,'Microsoft YaHei',sans-serif;fill:#716b63}
      .note-title{font:700 12px Inter,'Microsoft YaHei',sans-serif;fill:#667166}.note{font:500 13px Inter,'Microsoft YaHei',sans-serif;fill:#514c45}
    </style>
  </defs>
  <rect width="960" height="560" rx="24" fill="#fbfaf7"/>
  <text x="48" y="50" class="title">计算机存储层次</text><text x="48" y="76" class="subtitle">越靠近CPU通常越快、越小、越昂贵；越向下容量越大、持久性越强</text>
  
  <path d="M480 116 L770 455 L190 455 Z" fill="#f3f1ec" stroke="#b9b3a9"/>
  <path d="M480 116 L550 198 L410 198 Z" fill="#e7ebeb" stroke="#9aa7a6"/><text x="480" y="166" class="node-title" text-anchor="middle" fill="#536363">寄存器</text>
  <path d="M410 204 L550 204 L620 286 L340 286 Z" fill="#e4ebe5" stroke="#96a498"/><text x="480" y="244" class="node-title" text-anchor="middle" fill="#5b695f">Cache · L1/L2/L3</text>
  <path d="M335 292 L625 292 L696 374 L264 374 Z" fill="#ebe8ed" stroke="#a29aa8"/><text x="480" y="340" class="node-title" text-anchor="middle" fill="#655e6b">主存 RAM</text>
  <path d="M258 380 L702 380 L758 446 L202 446 Z" fill="#eee6e3" stroke="#b39b95"/><text x="480" y="420" class="node-title" text-anchor="middle" fill="#6f5c54">SSD / 硬盘 / 其他辅存</text>
  <text x="92" y="174" class="group">更快</text><path class="edge" d="M115 430 L115 140"/><text x="70" y="446" class="group">更慢</text>
  <text x="805" y="174" class="group">更小</text><path class="edge" d="M845 140 L845 430"/><text x="805" y="446" class="group">更大</text>
  <rect x="220" y="478" width="520" height="52" rx="14" fill="#eee6e1" stroke="#c6b7ae"/><text x="480" y="509" class="note" text-anchor="middle">CPU访问上层；未命中时数据从下层逐级调入</text>

  </svg>