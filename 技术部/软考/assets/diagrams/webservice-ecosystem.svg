<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">传统Web Service体系怎样协作</title><desc id="desc">WSDL描述合同，SOAP承载消息，UDDI/注册表帮助发现，ESB负责路由与集成</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#4f493f" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c7a74"/></marker>
    <style>
      .title{font:700 25px Inter,'Microsoft YaHei',sans-serif;fill:#292724}.subtitle{font:400 13px Inter,'Microsoft YaHei',sans-serif;fill:#7c766d}
      .group{font:700 12px Inter,'Microsoft YaHei',sans-serif;fill:#8b8479;letter-spacing:.08em}.node-title{font:700 15px Inter,'Microsoft YaHei',sans-serif}.node-sub{font:400 12px Inter,'Microsoft YaHei',sans-serif;fill:#6f6a62}
      .edge{fill:none;stroke:#7c7a74;stroke-width:1.55;marker-end:url(#arrow)}.edge-label{font:600 11px Inter,'Microsoft YaHei',sans-serif;fill:#716b63}
      .note-title{font:700 12px Inter,'Microsoft YaHei',sans-serif;fill:#667166}.note{font:500 13px Inter,'Microsoft YaHei',sans-serif;fill:#514c45}
    </style>
  </defs>
  <rect width="960" height="560" rx="24" fill="#fbfaf7"/>
  <text x="48" y="50" class="title">传统Web Service体系怎样协作</text><text x="48" y="76" class="subtitle">WSDL描述合同，SOAP承载消息，UDDI/注册表帮助发现，ESB负责路由与集成</text>
  
  <rect x="56" y="132" width="210" height="94" rx="17" fill="#e7ebeb" stroke="#9aa7a6"/><text x="161" y="170" class="node-title" text-anchor="middle" fill="#536363">服务请求者</text><text x="161" y="197" class="node-sub" text-anchor="middle">根据合同构造调用</text>
  <rect x="375" y="105" width="210" height="94" rx="17" fill="#eee9df" stroke="#b3a386"/><text x="480" y="143" class="node-title" text-anchor="middle" fill="#6d6250">服务注册表</text><text x="480" y="170" class="node-sub" text-anchor="middle">UDDI · 发现与元数据</text>
  <rect x="694" y="132" width="210" height="94" rx="17" fill="#e7ece6" stroke="#95a192"/><text x="799" y="170" class="node-title" text-anchor="middle" fill="#596657">服务提供者</text><text x="799" y="197" class="node-sub" text-anchor="middle">发布并实现服务</text>
  <rect x="160" y="302" width="640" height="144" rx="22" fill="#f4f2ed" stroke="#aaa79f"/><text x="480" y="334" class="group" text-anchor="middle">企业服务总线 ESB</text><rect x="190" y="354" width="168" height="58" rx="12" fill="#eee6e3" stroke="#b39b95"/><text x="274" y="389" class="node-title" text-anchor="middle" fill="#6f5c54">路由</text><rect x="396" y="354" width="168" height="58" rx="12" fill="#ece8ee" stroke="#a097a5"/><text x="480" y="389" class="node-title" text-anchor="middle" fill="#685f6d">协议/格式转换</text><rect x="602" y="354" width="168" height="58" rx="12" fill="#e4ebe5" stroke="#95a192"/><text x="686" y="389" class="node-title" text-anchor="middle" fill="#596657">治理与监控</text>
  <path class="edge" d="M266 165 C320 135 330 135 375 145"/><text x="320" y="126" class="edge-label">查找</text><path class="edge" d="M694 145 C650 125 630 125 585 145"/><text x="640" y="115" class="edge-label">发布WSDL</text><path class="edge" d="M266 195 C380 260 580 260 694 195"/><text x="480" y="256" class="edge-label">SOAP/XML消息 · 通常经HTTP传输</text><path class="edge" d="M480 270 L480 302"/>

  </svg>