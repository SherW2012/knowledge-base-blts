<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" role="img" aria-labelledby="t d"><title id="t">知识产权保护对象地图</title><desc id="d">区分著作权、商标、商业秘密和专利保护的不同对象。</desc><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 23px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:18px 'Microsoft YaHei',sans-serif;fill:#665e57}</style><rect width="1500" height="860" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">同一个软件产品可以同时存在多种知识产权</text><text x="65" y="110" class="sub">先判断保护对象，再判断权利产生方式和期限，不能把所有无形资产都当成“版权”</text><rect x="90" y="200" width="620" height="250" rx="30" fill="#eef0e7" stroke="#aab397"/><text x="145" y="255" class="th">著作权</text><text x="145" y="305" class="tx">代码、文档、界面美术等具体表达</text><text x="145" y="350" class="tx">核心边界：保护表达，不直接垄断抽象思想</text><rect x="790" y="200" width="620" height="250" rx="30" fill="#e8efed" stroke="#9bb3ad"/><text x="845" y="255" class="th">商标</text><text x="845" y="305" class="tx">产品名、品牌标志等来源识别符号</text><text x="845" y="350" class="tx">核心功能：让市场区分商品或服务来源</text><rect x="90" y="500" width="620" height="250" rx="30" fill="#eee7e2" stroke="#baa495"/><text x="145" y="555" class="th">商业秘密</text><text x="145" y="605" class="tx">未公开源码、配方、客户与经营信息</text><text x="145" y="650" class="tx">秘密性 + 商业价值 + 相应保密措施</text><rect x="790" y="500" width="620" height="250" rx="30" fill="#f0e7e3" stroke="#c1a196"/><text x="845" y="555" class="th">专利</text><text x="845" y="605" class="tx">满足法定条件的技术方案或设计</text><text x="845" y="650" class="tx">以申请和公开换取法定期限排他权</text></svg>