<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800" role="img" aria-labelledby="t d"><title id="t">软件配置变更控制</title><desc id="d">从配置基线提出变更，经过影响分析、审批、实施验证后形成新基线。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 21px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:17px 'Microsoft YaHei',sans-serif;fill:#665e57}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1500" height="800" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">基线不是禁止修改，而是让修改经过可追踪的控制</text><text x="65" y="110" class="sub">正式成果发生变化时，需要知道原因、影响、批准状态和最终进入哪个版本</text><g><rect x="70" y="270" width="205" height="140" rx="24" fill="#eef0e7" stroke="#aab397"/><rect x="320" y="270" width="205" height="140" rx="24" fill="#e8efed" stroke="#9bb3ad"/><rect x="570" y="270" width="205" height="140" rx="24" fill="#eee7e2" stroke="#baa495"/><rect x="820" y="270" width="205" height="140" rx="24" fill="#e9e5ef" stroke="#aaa1b8"/><rect x="1070" y="270" width="205" height="140" rx="24" fill="#f0e7e3" stroke="#c1a196"/><rect x="1320" y="270" width="120" height="140" rx="24" fill="#eef0e7" stroke="#aab397"/></g><text x="172" y="325" text-anchor="middle" class="th">当前基线</text><text x="172" y="365" text-anchor="middle" class="tx">需求/代码/配置</text><text x="422" y="325" text-anchor="middle" class="th">提出变更</text><text x="422" y="365" text-anchor="middle" class="tx">说明原因和目标</text><text x="672" y="325" text-anchor="middle" class="th">影响分析</text><text x="672" y="365" text-anchor="middle" class="tx">范围、成本、测试</text><text x="922" y="325" text-anchor="middle" class="th">审批</text><text x="922" y="365" text-anchor="middle" class="tx">接受 / 拒绝</text><text x="1172" y="325" text-anchor="middle" class="th">实施与验证</text><text x="1172" y="365" text-anchor="middle" class="tx">修改并回归</text><text x="1380" y="325" text-anchor="middle" class="th">新基线</text><text x="1380" y="365" text-anchor="middle" class="tx">正式版本</text><path d="M275 340H310" class="ln"/><path d="M525 340H560" class="ln"/><path d="M775 340H810" class="ln"/><path d="M1025 340H1060" class="ln"/><path d="M1275 340H1310" class="ln"/><text x="750" y="590" text-anchor="middle" class="tx">版本控制保存“变成什么样”；变更控制还要保存“为什么变、谁批准、影响了什么”</text></svg>