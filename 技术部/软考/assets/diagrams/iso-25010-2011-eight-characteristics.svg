<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="t d"><title id="t">ISO IEC 25010 2011八项产品质量特性</title><desc id="d">将八项特性按完成任务、外部关系、持续可信和面对变化四组展示。</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.gh{font:700 25px 'Microsoft YaHei',sans-serif;fill:#48413b}.th{font:700 21px 'Microsoft YaHei',sans-serif;fill:#514a44}.tx{font:16px 'Microsoft YaHei',sans-serif;fill:#6b635c}</style></defs><rect width="1500" height="850" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">ISO/IEC 25010:2011：八项产品质量特性</text><text x="65" y="110" class="sub">四组只用于建立记忆结构，正式标准仍由八项并列的一级特性组成</text>
<g filter="url(#s)"><rect x="55" y="165" width="330" height="600" rx="30" fill="#eef0e7" stroke="#abb399"/><rect x="415" y="165" width="330" height="600" rx="30" fill="#e6efed" stroke="#94afa9"/><rect x="775" y="165" width="330" height="600" rx="30" fill="#ece5df" stroke="#b49d8c"/><rect x="1135" y="165" width="310" height="600" rx="30" fill="#e9e5ef" stroke="#aaa0b8"/></g>
<text x="220" y="220" text-anchor="middle" class="gh">完成任务</text><text x="580" y="220" text-anchor="middle" class="gh">外部关系</text><text x="940" y="220" text-anchor="middle" class="gh">持续可信</text><text x="1290" y="220" text-anchor="middle" class="gh">面对变化</text>
<rect x="90" y="270" width="260" height="180" rx="23" fill="#fbfaf7" stroke="#abb399"/><text x="220" y="310" text-anchor="middle" class="th">功能适合性</text><text x="220" y="350" text-anchor="middle" class="tx">完整性 · 正确性 · 适当性</text><text x="220" y="397" text-anchor="middle" class="tx">功能能否正确完成任务</text><rect x="90" y="500" width="260" height="180" rx="23" fill="#fbfaf7" stroke="#abb399"/><text x="220" y="540" text-anchor="middle" class="th">性能效率</text><text x="220" y="580" text-anchor="middle" class="tx">时间 · 资源利用 · 容量</text><text x="220" y="627" text-anchor="middle" class="tx">以什么代价完成任务</text>
<rect x="450" y="270" width="260" height="180" rx="23" fill="#fbfaf7" stroke="#94afa9"/><text x="580" y="310" text-anchor="middle" class="th">兼容性</text><text x="580" y="350" text-anchor="middle" class="tx">共存性 · 互操作性</text><text x="580" y="397" text-anchor="middle" class="tx">与其他产品怎样协作</text><rect x="450" y="500" width="260" height="180" rx="23" fill="#fbfaf7" stroke="#94afa9"/><text x="580" y="540" text-anchor="middle" class="th">易用性</text><text x="580" y="580" text-anchor="middle" class="tx">认识 · 学习 · 操作 · 防错</text><text x="580" y="627" text-anchor="middle" class="tx">用户怎样使用产品</text>
<rect x="810" y="270" width="260" height="180" rx="23" fill="#fbfaf7" stroke="#b49d8c"/><text x="940" y="310" text-anchor="middle" class="th">可靠性</text><text x="940" y="350" text-anchor="middle" class="tx">成熟 · 可用 · 容错 · 恢复</text><text x="940" y="397" text-anchor="middle" class="tx">能否持续提供规定功能</text><rect x="810" y="500" width="260" height="180" rx="23" fill="#fbfaf7" stroke="#b49d8c"/><text x="940" y="540" text-anchor="middle" class="th">信息安全性</text><text x="940" y="580" text-anchor="middle" class="tx">保密 · 完整 · 真实 · 可查</text><text x="940" y="627" text-anchor="middle" class="tx">信息和行为是否受控可信</text>
