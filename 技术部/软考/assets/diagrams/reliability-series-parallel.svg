<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="t d"><title id="t">串联系统与并联系统可靠度</title><desc id="d">串联系统任一构件失败即失败，并联系统至少一个构件正常即可成功。</desc><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 23px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:18px 'Microsoft YaHei',sans-serif;fill:#665e57}.eq{font:700 23px 'Consolas','Microsoft YaHei',sans-serif;fill:#514b46}.ln{stroke:#8c847a;stroke-width:4;fill:none}</style><rect width="1500" height="850" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">串联要求全部成功，并联只要求至少一路成功</text><text x="65" y="110" class="sub">可靠度公式来自系统“在什么条件下才算失败”的逻辑</text><rect x="70" y="190" width="650" height="530" rx="30" fill="#eef0e7" stroke="#aab397"/><rect x="780" y="190" width="650" height="530" rx="30" fill="#e8efed" stroke="#9bb3ad"/><text x="395" y="245" text-anchor="middle" class="th">串联系统</text><text x="395" y="285" text-anchor="middle" class="tx">所有必要构件都正常，系统才成功</text><line x1="145" y1="390" x2="645" y2="390" class="ln"/><rect x="190" y="340" width="130" height="100" rx="18" fill="#f8f6f1" stroke="#9da994"/><rect x="470" y="340" width="130" height="100" rx="18" fill="#f8f6f1" stroke="#9da994"/><text x="255" y="398" text-anchor="middle" class="tx">R₁</text><text x="535" y="398" text-anchor="middle" class="tx">R₂</text><text x="395" y="535" text-anchor="middle" class="eq">R = R₁ × R₂ × ... × Rₙ</text><text x="1105" y="245" text-anchor="middle" class="th">并联系统</text><text x="1105" y="285" text-anchor="middle" class="tx">至少一个可替代构件正常，系统就成功</text><line x1="850" y1="390" x2="950" y2="390" class="ln"/><line x1="950" y1="330" x2="950" y2="450" class="ln"/><line x1="1260" y1="330" x2="1260" y2="450" class="ln"/><line x1="1260" y1="390" x2="1360" y2="390" class="ln"/><rect x="1000" y="285" width="200" height="90" rx="18" fill="#f8f6f1" stroke="#8ca8a2"/><rect x="1000" y="405" width="200" height="90" rx="18" fill="#f8f6f1" stroke="#8ca8a2"/><text x="1100" y="340" text-anchor="middle" class="tx">R₁</text><text x="1100" y="460" text-anchor="middle" class="tx">R₂</text><line x1="950" y1="330" x2="1000" y2="330" class="ln"/><line x1="1200" y1="330" x2="1260" y2="330" class="ln"/><line x1="950" y1="450" x2="1000" y2="450" class="ln"/><line x1="1200" y1="450" x2="1260" y2="450" class="ln"/><text x="1105" y="575" text-anchor="middle" class="eq">R = 1 - Π(1-Rᵢ)</text><text x="1105" y="620" text-anchor="middle" class="tx">前提：各路能够真正替代，且失效近似独立</text></svg>