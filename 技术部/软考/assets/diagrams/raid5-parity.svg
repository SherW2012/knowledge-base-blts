<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" role="img" aria-labelledby="t d"><title id="t">RAID 5分布式校验</title><desc id="d">四块磁盘中的数据条带与校验块轮换分布，并说明单盘故障的恢复逻辑</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 22px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:18px 'Microsoft YaHei',sans-serif;fill:#665e57}.p{font:700 18px 'Microsoft YaHei',sans-serif;fill:#8d6558}</style></defs><rect width="1500" height="860" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">RAID 5 · 数据和校验怎样分布</text><text x="65" y="110" class="sub">每个条带有数据块和一份校验块，校验位置在各磁盘之间轮换，不存在固定的“校验盘”</text><g filter="url(#s)"><rect x="90" y="190" width="300" height="470" rx="28" fill="#f4f1eb" stroke="#c5bcaf"/><rect x="430" y="190" width="300" height="470" rx="28" fill="#f4f1eb" stroke="#c5bcaf"/><rect x="770" y="190" width="300" height="470" rx="28" fill="#f4f1eb" stroke="#c5bcaf"/><rect x="1110" y="190" width="300" height="470" rx="28" fill="#f4f1eb" stroke="#c5bcaf"/></g><g class="th" text-anchor="middle"><text x="240" y="235">Disk 1</text><text x="580" y="235">Disk 2</text><text x="920" y="235">Disk 3</text><text x="1260" y="235">Disk 4</text></g><g stroke="#b7b0a7"><rect x="135" y="275" width="210" height="62" rx="14" fill="#e7edec"/><rect x="475" y="275" width="210" height="62" rx="14" fill="#e7edec"/><rect x="815" y="275" width="210" height="62" rx="14" fill="#e7edec"/><rect x="1155" y="275" width="210" height="62" rx="14" fill="#eee6e3"/><rect x="135" y="360" width="210" height="62" rx="14" fill="#e7edec"/><rect x="475" y="360" width="210" height="62" rx="14" fill="#e7edec"/><rect x="815" y="360" width="210" height="62" rx="14" fill="#eee6e3"/><rect x="1155" y="360" width="210" height="62" rx="14" fill="#e7edec"/><rect x="135" y="445" width="210" height="62" rx="14" fill="#e7edec"/><rect x="475" y="445" width="210" height="62" rx="14" fill="#eee6e3"/><rect x="815" y="445" width="210" height="62" rx="14" fill="#e7edec"/><rect x="1155" y="445" width="210" height="62" rx="14" fill="#e7edec"/><rect x="135" y="530" width="210" height="62" rx="14" fill="#eee6e3"/><rect x="475" y="530" width="210" height="62" rx="14" fill="#e7edec"/><rect x="815" y="530" width="210" height="62" rx="14" fill="#e7edec"/><rect x="1155" y="530" width="210" height="62" rx="14" fill="#e7edec"/></g><g class="tx" text-anchor="middle"><text x="240" y="314">A1</text><text x="580" y="314">A2</text><text x="920" y="314">A3</text><text x="1260" y="314" class="p">P(A)</text><text x="240" y="399">B1</text><text x="580" y="399">B2</text><text x="920" y="399" class="p">P(B)</text><text x="1260" y="399">B3</text><text x="240" y="484">C1</text><text x="580" y="484" class="p">P(C)</text><text x="920" y="484">C2</text><text x="1260" y="484">C3</text><text x="240" y="569" class="p">P(D)</text><text x="580" y="569">D1</text><text x="920" y="569">D2</text><text x="1260" y="569">D3</text></g><rect x="240" y="715" width="1020" height="90" rx="22" fill="#eef0e8" stroke="#aeb79b"/><text x="750" y="750" text-anchor="middle" class="th">为什么只能容忍 1 块盘故障</text><text x="750" y="783" text-anchor="middle" class="tx">一套校验关系可以恢复一个未知块；两块同时丢失时，未知量多于独立校验关系，通常无法唯一恢复</text></svg>