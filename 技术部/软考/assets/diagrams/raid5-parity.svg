<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" font-size="30" font-family="sans-serif" fill="#0f172a">RAID 5：条带化 + 分布式单校验</text>
  <text x="600" y="88" text-anchor="middle" font-size="19" font-family="sans-serif" fill="#475569">校验块轮流分布，不存在固定“专用校验盘”</text>
  <g font-family="sans-serif" font-size="20" text-anchor="middle"><text x="210" y="145">Disk 1</text><text x="470" y="145">Disk 2</text><text x="730" y="145">Disk 3</text><text x="990" y="145">Disk 4</text></g>
  <g stroke="#94a3b8" stroke-width="2"><rect x="90" y="170" width="240" height="70" rx="12" fill="#dbeafe"/><rect x="350" y="170" width="240" height="70" rx="12" fill="#dbeafe"/><rect x="610" y="170" width="240" height="70" rx="12" fill="#dbeafe"/><rect x="870" y="170" width="240" height="70" rx="12" fill="#fef3c7"/><rect x="90" y="260" width="240" height="70" rx="12" fill="#dbeafe"/><rect x="350" y="260" width="240" height="70" rx="12" fill="#dbeafe"/><rect x="610" y="260" width="240" height="70" rx="12" fill="#fef3c7"/><rect x="870" y="260" width="240" height="70" rx="12" fill="#dbeafe"/><rect x="90" y="350" width="240" height="70" rx="12" fill="#dbeafe"/><rect x="350" y="350" width="240" height="70" rx="12" fill="#fef3c7"/><rect x="610" y="350" width="240" height="70" rx="12" fill="#dbeafe"/><rect x="870" y="350" width="240" height="70" rx="12" fill="#dbeafe"/><rect x="90" y="440" width="240" height="70" rx="12" fill="#fef3c7"/><rect x="350" y="440" width="240" height="70" rx="12" fill="#dbeafe"/><rect x="610" y="440" width="240" height="70" rx="12" fill="#dbeafe"/><rect x="870" y="440" width="240" height="70" rx="12" fill="#dbeafe"/></g>
  <g font-family="sans-serif" font-size="22" text-anchor="middle" fill="#1e3a8a"><text x="210" y="214">A1</text><text x="470" y="214">A2</text><text x="730" y="214">A3</text><text x="990" y="214" fill="#92400e">P(A)</text><text x="210" y="304">B1</text><text x="470" y="304">B2</text><text x="730" y="304" fill="#92400e">P(B)</text><text x="990" y="304">B3</text><text x="210" y="394">C1</text><text x="470" y="394" fill="#92400e">P(C)</text><text x="730" y="394">C2</text><text x="990" y="394">C3</text><text x="210" y="484" fill="#92400e">P(D)</text><text x="470" y="484">D1</text><text x="730" y="484">D2</text><text x="990" y="484">D3</text></g>
  <rect x="115" y="560" width="970" height="90" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="598" text-anchor="middle" font-size="21" font-family="sans-serif" fill="#166534">一块盘故障：A / B / C / P 中只缺一个未知量，可由其余块重建</text>
  <text x="600" y="632" text-anchor="middle" font-size="19" font-family="sans-serif" fill="#166534">RAID 5 有效容量 ≈ (N-1) × 单盘容量；任意两块同时坏时，一套校验通常不足以唯一恢复</text>
</svg>
