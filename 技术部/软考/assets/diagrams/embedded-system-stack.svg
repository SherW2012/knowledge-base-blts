<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="t d"><title id="t">嵌入式系统软硬件层次</title><desc id="d">从硬件、BSP设备驱动、RTOS服务到应用任务展示嵌入式系统层次。</desc><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 23px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:18px 'Microsoft YaHei',sans-serif;fill:#665e57}</style><rect width="1500" height="850" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">嵌入式系统从物理设备一直延伸到实时任务</text><text x="65" y="110" class="sub">每一层都在隐藏下一层细节，同时把可预测的能力交给上一层</text><rect x="150" y="180" width="1200" height="135" rx="26" fill="#eef0e7" stroke="#aab397"/><text x="215" y="235" class="th">应用任务与控制逻辑</text><text x="215" y="277" class="tx">传感器处理　电机控制　通信协议　界面与业务逻辑</text><rect x="150" y="340" width="1200" height="135" rx="26" fill="#e8efed" stroke="#9bb3ad"/><text x="215" y="395" class="th">RTOS / 运行时服务</text><text x="215" y="437" class="tx">任务调度　信号量　互斥锁　消息队列　定时器</text><rect x="150" y="500" width="1200" height="135" rx="26" fill="#eee7e2" stroke="#baa495"/><text x="215" y="555" class="th">BSP 与设备驱动</text><text x="215" y="597" class="tx">启动、时钟、寄存器、中断、DMA、外设接口</text><rect x="150" y="660" width="1200" height="135" rx="26" fill="#f0e7e3" stroke="#c1a196"/><text x="215" y="715" class="th">硬件平台</text><text x="215" y="757" class="tx">CPU / MCU / SoC　Flash / RAM　GPIO / ADC / PWM　UART / SPI / I²C / CAN</text></svg>