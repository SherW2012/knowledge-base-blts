<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780" role="img" aria-labelledby="t d"><title id="t">UML轮廓图示例</title><desc id="d">轮廓图使用 stereotype、tagged value 和 constraint 扩展 UML 元模型。</desc><defs><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 22px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:17px 'Microsoft YaHei',sans-serif;fill:#5f5851}.ln{stroke:#756d65;stroke-width:2.5;fill:none;stroke-dasharray:10 8}</style></defs><rect width="1500" height="780" rx="34" fill="#fbfaf7"/><text x="65" y="70" class="h">轮廓图：不改 UML 语言本体，而是给它“加行业标签”</text><text x="65" y="108" class="sub">Profile 用 stereotype、tagged value、constraint 对 UML 元素做领域化扩展</text><g><rect x="120" y="220" width="340" height="180" rx="18" fill="#eef0e7" stroke="#9ea78d"/><text x="290" y="270" text-anchor="middle" class="tx">UML 元模型元素</text><text x="290" y="315" text-anchor="middle" class="th">Component</text><text x="290" y="355" text-anchor="middle" class="tx">原生语义保持不变</text></g><g><rect x="580" y="190" width="360" height="240" rx="18" fill="#e8efed" stroke="#9bb3ad"/><text x="760" y="235" text-anchor="middle" class="tx">«stereotype»</text><text x="760" y="275" text-anchor="middle" class="th">Microservice</text><text x="620" y="325" class="tx">tag: team</text><text x="620" y="360" class="tx">tag: version</text><text x="620" y="395" class="tx">constraint: stateless=true</text></g><path d="M580 310H470" class="ln"/><text x="525" y="290" text-anchor="middle" class="tx">extends</text><g><rect x="1070" y="220" width="320" height="180" rx="18" fill="#f0e7e3" stroke="#c1a196"/><text x="1230" y="265" text-anchor="middle" class="tx">模型中的具体元素</text><text x="1230" y="310" text-anchor="middle" class="th">«Microservice»</text><text x="1230" y="350" text-anchor="middle" class="tx">OrderService</text></g><line x1="940" y1="310" x2="1070" y2="310" class="ln"/><rect x="210" y="535" width="1080" height="120" rx="24" fill="#f4f1eb" stroke="#bab1a6"/><text x="750" y="578" text-anchor="middle" class="th">轮廓图不是业务画像图，也不是用户画像</text><text x="750" y="615" text-anchor="middle" class="tx">它用于领域建模扩展：例如 SysML、MARTE 或团队自定义的 «Entity»、«Service»、«Controller» 等标记体系。</text></svg>