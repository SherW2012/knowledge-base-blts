<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="t d"><title id="t">SEI架构质量分析链</title><desc id="d">从业务目标识别质量驱动因素，形成场景、战术、架构决策与评价结果。</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 21px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:16px 'Microsoft YaHei',sans-serif;fill:#665e57}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1500" height="720" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">架构质量不是从属性名称直接跳到结论</text><text x="65" y="110" class="sub">每一步都把上一层的目标转化为更具体、可分析和可验证的对象</text>
<g filter="url(#s)"><rect x="50" y="235" width="205" height="175" rx="26" fill="#eef0e7" stroke="#abb399"/><rect x="290" y="205" width="205" height="235" rx="26" fill="#e6efed" stroke="#94afa9"/><rect x="530" y="205" width="205" height="235" rx="26" fill="#ece5df" stroke="#b49d8c"/><rect x="770" y="205" width="205" height="235" rx="26" fill="#e9e5ef" stroke="#aaa0b8"/><rect x="1010" y="205" width="205" height="235" rx="26" fill="#f1e7e3" stroke="#c1a095"/><rect x="1250" y="235" width="205" height="175" rx="26" fill="#eeeade" stroke="#b7aa83"/></g>
<text x="152" y="283" text-anchor="middle" class="th">业务目标</text><text x="152" y="325" text-anchor="middle" class="tx">系统为什么成功</text><text x="152" y="358" text-anchor="middle" class="tx">哪些约束不能破坏</text>
<text x="392" y="255" text-anchor="middle" class="th">架构驱动因素</text><text x="392" y="300" text-anchor="middle" class="tx">最重要的功能</text><text x="392" y="333" text-anchor="middle" class="tx">质量属性与约束</text><text x="392" y="383" text-anchor="middle" class="tx">决定架构方向</text>
<text x="632" y="255" text-anchor="middle" class="th">质量属性场景</text><text x="632" y="300" text-anchor="middle" class="tx">刺激、环境</text><text x="632" y="333" text-anchor="middle" class="tx">响应与度量</text><text x="632" y="383" text-anchor="middle" class="tx">形成可判断要求</text>
<text x="872" y="255" text-anchor="middle" class="th">架构战术</text><text x="872" y="300" text-anchor="middle" class="tx">控制影响质量的因素</text><text x="872" y="333" text-anchor="middle" class="tx">形成设计动作</text><text x="872" y="383" text-anchor="middle" class="tx">不是最终架构</text>
<text x="1112" y="255" text-anchor="middle" class="th">架构决策</text><text x="1112" y="300" text-anchor="middle" class="tx">构件、接口</text><text x="1112" y="333" text-anchor="middle" class="tx">部署、资源和参数</text><text x="1112" y="383" text-anchor="middle" class="tx">落实多个战术</text>
<text x="1352" y="283" text-anchor="middle" class="th">架构评价</text><text x="1352" y="325" text-anchor="middle" class="tx">风险、敏感点</text><text x="1352" y="358" text-anchor="middle" class="tx">权衡与后续验证</text>
<path d="M255 322H280" class="ln"/><path d="M495 322H520" class="ln"/><path d="M735 322H760" class="ln"/><path d="M975 322H1000" class="ln"/><path d="M1215 322H1240" class="ln"/><rect x="260" y="550" width="980" height="90" rx="25" fill="#f4f1eb" stroke="#bab1a6"/><text x="750" y="590" text-anchor="middle" class="th">没有全行业统一的“高性能数字”</text><text x="750" y="622" text-anchor="middle" class="tx">评判标准由当前系统的业务目标和质量属性场景共同确定</text></svg>
