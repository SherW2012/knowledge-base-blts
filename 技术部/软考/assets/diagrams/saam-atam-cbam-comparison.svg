<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780" role="img" aria-labelledby="t d"><title id="t">SAAM、ATAM与CBAM的关注层次</title><desc id="d">SAAM观察场景影响，ATAM扩展到多属性技术权衡，CBAM加入经济决策。</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 29px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:18px 'Microsoft YaHei',sans-serif;fill:#665e57}.cap{font:700 19px 'Microsoft YaHei',sans-serif;fill:#514a44}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1500" height="780" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">三种方法逐步扩展架构评价的问题范围</text><text x="65" y="110" class="sub">它们不是同一方法的三个名称：分别强调场景影响、技术权衡和经济选择</text>
<g filter="url(#s)"><rect x="70" y="185" width="390" height="440" rx="30" fill="#e8efed" stroke="#94afa9"/><rect x="555" y="155" width="390" height="500" rx="30" fill="#ece5df" stroke="#b49d8c"/><rect x="1040" y="185" width="390" height="440" rx="30" fill="#e9e5ef" stroke="#aaa0b8"/></g>
<text x="265" y="245" text-anchor="middle" class="th">SAAM</text><text x="265" y="287" text-anchor="middle" class="cap">场景影响</text><text x="265" y="345" text-anchor="middle" class="tx">描述体系结构</text><text x="265" y="383" text-anchor="middle" class="tx">提出并排序场景</text><text x="265" y="421" text-anchor="middle" class="tx">区分直接与间接场景</text><text x="265" y="459" text-anchor="middle" class="tx">分析修改范围和场景交互</text><text x="265" y="535" text-anchor="middle" class="cap">重点：可修改性和候选架构比较</text>
<text x="750" y="220" text-anchor="middle" class="th">ATAM</text><text x="750" y="262" text-anchor="middle" class="cap">技术风险与多属性权衡</text><text x="750" y="325" text-anchor="middle" class="tx">业务目标与质量效用树</text><text x="750" y="363" text-anchor="middle" class="tx">架构方法和高优先级场景</text><text x="750" y="401" text-anchor="middle" class="tx">多种质量属性共同分析</text><text x="750" y="439" text-anchor="middle" class="tx">风险、敏感点和权衡点</text><text x="750" y="525" text-anchor="middle" class="cap">重点：技术上能否满足重要质量目标</text><text x="750" y="566" text-anchor="middle" class="tx">不直接决定投资是否划算</text>
<text x="1235" y="245" text-anchor="middle" class="th">CBAM</text><text x="1235" y="287" text-anchor="middle" class="cap">经济选择</text><text x="1235" y="345" text-anchor="middle" class="tx">候选架构策略</text><text x="1235" y="383" text-anchor="middle" class="tx">质量效用收益</text><text x="1235" y="421" text-anchor="middle" class="tx">成本、进度和不确定性</text><text x="1235" y="459" text-anchor="middle" class="tx">预算内选择策略组合</text><text x="1235" y="535" text-anchor="middle" class="cap">重点：有限资源怎样获得更高收益</text>
<path d="M460 405H545" class="ln"/><path d="M945 405H1030" class="ln"/><text x="750" y="720" text-anchor="middle" class="sub">场景影响 → 多质量属性的技术权衡 → 成本收益约束下的架构投资</text></svg>
