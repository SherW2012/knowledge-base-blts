<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="t d"><title id="t">常见架构决策的质量属性权衡</title><desc id="d">缓存、冗余、加密和分层分别产生主要质量收益与其他属性代价。</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 22px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:17px 'Microsoft YaHei',sans-serif;fill:#665e57}.good{font:700 18px 'Microsoft YaHei',sans-serif;fill:#57776c}.cost{font:700 18px 'Microsoft YaHei',sans-serif;fill:#9b6558}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1500" height="850" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">架构决策通常同时改变多项质量</text><text x="65" y="110" class="sub">权衡不是宣布某项质量必然失败，而是明确收益、代价、优先级和验证方式</text>
<g filter="url(#s)"><rect x="60" y="180" width="270" height="130" rx="25" fill="#f3f0e9" stroke="#b8afa3"/><rect x="60" y="360" width="270" height="130" rx="25" fill="#f3f0e9" stroke="#b8afa3"/><rect x="60" y="540" width="270" height="130" rx="25" fill="#f3f0e9" stroke="#b8afa3"/>
<rect x="500" y="150" width="380" height="175" rx="27" fill="#e6efed" stroke="#94afa9"/><rect x="1010" y="150" width="410" height="175" rx="27" fill="#f1e7e3" stroke="#c1a095"/><rect x="500" y="337" width="380" height="175" rx="27" fill="#e6efed" stroke="#94afa9"/><rect x="1010" y="337" width="410" height="175" rx="27" fill="#f1e7e3" stroke="#c1a095"/><rect x="500" y="525" width="380" height="175" rx="27" fill="#e6efed" stroke="#94afa9"/><rect x="1010" y="525" width="410" height="175" rx="27" fill="#f1e7e3" stroke="#c1a095"/></g>
<text x="195" y="230" text-anchor="middle" class="th">缓存</text><text x="195" y="270" text-anchor="middle" class="tx">保存重复访问结果</text><text x="195" y="410" text-anchor="middle" class="th">冗余副本</text><text x="195" y="450" text-anchor="middle" class="tx">提供替代处理能力</text><text x="195" y="590" text-anchor="middle" class="th">加密与校验</text><text x="195" y="630" text-anchor="middle" class="tx">保护数据与行为</text>
<text x="690" y="200" text-anchor="middle" class="good">主要收益</text><text x="690" y="240" text-anchor="middle" class="tx">降低延迟、减少后端负载</text><text x="690" y="280" text-anchor="middle" class="tx">支持部分降级读取</text><text x="1215" y="200" text-anchor="middle" class="cost">可能代价</text><text x="1215" y="240" text-anchor="middle" class="tx">一致性、失效和恢复复杂度</text><text x="1215" y="280" text-anchor="middle" class="tx">内存与运维成本</text>
<text x="690" y="387" text-anchor="middle" class="good">主要收益</text><text x="690" y="427" text-anchor="middle" class="tx">提高可用性和读取吞吐量</text><text x="690" y="467" text-anchor="middle" class="tx">减少单点故障</text><text x="1215" y="387" text-anchor="middle" class="cost">可能代价</text><text x="1215" y="427" text-anchor="middle" class="tx">状态同步、故障判断和部署成本</text><text x="1215" y="467" text-anchor="middle" class="tx">更多节点不自动等于高可用</text>
<text x="690" y="575" text-anchor="middle" class="good">主要收益</text><text x="690" y="615" text-anchor="middle" class="tx">改善机密性、完整性和真实性</text><text x="690" y="655" text-anchor="middle" class="tx">形成可信交换边界</text><text x="1215" y="575" text-anchor="middle" class="cost">可能代价</text><text x="1215" y="615" text-anchor="middle" class="tx">计算延迟、密钥管理和排障难度</text><text x="1215" y="655" text-anchor="middle" class="tx">交互步骤和运维复杂度增加</text>
<path d="M330 235H490" class="ln"/><path d="M880 235H1000" class="ln"/><path d="M330 425H490" class="ln"/><path d="M880 425H1000" class="ln"/><path d="M330 612H490" class="ln"/><path d="M880 612H1000" class="ln"/>
<text x="750" y="785" text-anchor="middle" class="sub">同一决策 → 多个质量结果；同一质量目标 → 也可能需要多个战术共同实现</text></svg>
