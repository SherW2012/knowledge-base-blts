<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" role="img" aria-labelledby="t d"><title id="t">UML活动图示例</title><desc id="d">活动图展示动作、判断、分叉、汇合和泳道。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#756d65"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 22px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:17px 'Microsoft YaHei',sans-serif;fill:#5f5851}.ln{stroke:#756d65;stroke-width:2.5;fill:none;marker-end:url(#arr)}</style></defs><rect width="1500" height="860" rx="34" fill="#fbfaf7"/><text x="65" y="70" class="h">活动图：看“工作怎样流动、在哪里分支、哪里并行”</text><text x="65" y="108" class="sub">它适合业务流程、算法控制流和跨角色协作；关注动作流转，不关注某个对象的长期状态</text><rect x="90" y="170" width="640" height="570" fill="#f4f1eb" stroke="#bab1a6"/><rect x="730" y="170" width="680" height="570" fill="#fbfaf7" stroke="#bab1a6"/><text x="410" y="210" text-anchor="middle" class="th">Customer</text><text x="1070" y="210" text-anchor="middle" class="th">System</text><circle cx="250" cy="275" r="18" fill="#5f5851"/><rect x="175" y="330" width="150" height="65" rx="26" fill="#eef0e7" stroke="#9ea78d"/><text x="250" y="370" text-anchor="middle" class="tx">提交订单</text><path d="M250 293V330" class="ln"/><rect x="880" y="330" width="180" height="65" rx="26" fill="#e8efed" stroke="#9bb3ad"/><text x="970" y="370" text-anchor="middle" class="tx">校验库存</text><path d="M325 362H880" class="ln"/><polygon points="970,450 1020,500 970,550 920,500" fill="#f0e7e3" stroke="#c1a196"/><text x="970" y="507" text-anchor="middle" class="tx">充足?</text><path d="M970 395V450" class="ln"/><rect x="1110" y="468" width="180" height="65" rx="26" fill="#eeeade" stroke="#b7aa83"/><text x="1200" y="508" text-anchor="middle" class="tx">通知缺货</text><path d="M1020 500H1110" class="ln"/><text x="1060" y="485" class="tx">[否]</text><path d="M970 550V585" class="ln"/><text x="990" y="575" class="tx">[是]</text><rect x="870" y="585" width="200" height="16" fill="#5f5851"/><path d="M920 601V645" class="ln"/><path d="M1020 601V645" class="ln"/><rect x="835" y="645" width="170" height="60" rx="24" fill="#eef0e7" stroke="#9ea78d"/><text x="920" y="681" text-anchor="middle" class="tx">锁定库存</text><rect x="1015" y="645" width="170" height="60" rx="24" fill="#e8efed" stroke="#9bb3ad"/><text x="1100" y="681" text-anchor="middle" class="tx">创建支付</text><text x="750" y="790" text-anchor="middle" class="tx">菱形可表示 decision/merge；粗横线表示 fork/join；泳道表示职责归属。并行不是“二选一”，这是高频易混点。</text></svg>