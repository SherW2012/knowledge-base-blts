<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800" role="img" aria-labelledby="t d"><title id="t">VPN通信中各方能看到什么</title><desc id="d">展示本地网络、VPN服务器和目标网站在VPN访问公网时分别能看到的地址与内容边界</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 22px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:18px 'Microsoft YaHei',sans-serif;fill:#665e57}.em{font:700 17px 'Microsoft YaHei',sans-serif;fill:#6d6256}</style></defs><rect width="1500" height="800" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">VPN 可见性 · 不同位置看到的是不同“外层/内层”</text><text x="65" y="110" class="sub">这里默认VPN隧道本身正常加密，终端本机没有额外采集软件</text><g filter="url(#s)"><rect x="80" y="205" width="390" height="405" rx="30" fill="#e7edec" stroke="#9cadaa"/><rect x="555" y="205" width="390" height="405" rx="30" fill="#eee9e2" stroke="#b9a38f"/><rect x="1030" y="205" width="390" height="405" rx="30" fill="#eef0e8" stroke="#aeb79b"/></g><text x="275" y="260" text-anchor="middle" class="th">本地出口 / 中间公网</text><text x="275" y="315" text-anchor="middle" class="em">能明确看到</text><text x="275" y="355" text-anchor="middle" class="tx">你正在连接 3.3.3.3</text><text x="275" y="390" text-anchor="middle" class="tx">连接时间、流量大小、协议特征</text><text x="275" y="450" text-anchor="middle" class="em">通常看不到</text><text x="275" y="490" text-anchor="middle" class="tx">隧道内真实目标 8.8.8.8</text><text x="275" y="525" text-anchor="middle" class="tx">被VPN加密的业务内容</text><text x="750" y="260" text-anchor="middle" class="th">VPN 服务器</text><text x="750" y="315" text-anchor="middle" class="em">知道</text><text x="750" y="355" text-anchor="middle" class="tx">哪个VPN用户建立了隧道</text><text x="750" y="390" text-anchor="middle" class="tx">解封装后的真实目标</text><text x="750" y="450" text-anchor="middle" class="em">继续向外访问</text><text x="750" y="490" text-anchor="middle" class="tx">目标网站看到的出口</text><text x="750" y="525" text-anchor="middle" class="tx">通常就是VPN服务器公网IP</text><text x="1225" y="260" text-anchor="middle" class="th">最终网站</text><text x="1225" y="315" text-anchor="middle" class="em">看到</text><text x="1225" y="355" text-anchor="middle" class="tx">来自VPN出口的连接</text><text x="1225" y="390" text-anchor="middle" class="tx">例如源IP 3.3.3.3</text><text x="1225" y="450" text-anchor="middle" class="em">通常看不到</text><text x="1225" y="490" text-anchor="middle" class="tx">你原本的公网出口 1.1.1.1</text><g filter="url(#s)"><rect x="250" y="665" width="1000" height="80" rx="24" fill="#ebe8ef" stroke="#a89fb0"/></g><text x="750" y="715" text-anchor="middle" class="em">VPN主要改变“中间网络看到的目标”和“最终网站看到的来源”，并不意味着任何位置都绝对不可见</text></svg>