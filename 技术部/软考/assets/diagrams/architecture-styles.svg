<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">五类经典软件体系结构风格</title><desc id="desc">不同风格规定系统级构件如何组织、共享数据和传递控制</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#4f493f" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c7a74"/></marker>
    <style>
      .title{font:700 25px Inter,'Microsoft YaHei',sans-serif;fill:#292724}.subtitle{font:400 13px Inter,'Microsoft YaHei',sans-serif;fill:#7c766d}
      .group{font:700 12px Inter,'Microsoft YaHei',sans-serif;fill:#8b8479;letter-spacing:.08em}.node-title{font:700 15px Inter,'Microsoft YaHei',sans-serif}.node-sub{font:400 12px Inter,'Microsoft YaHei',sans-serif;fill:#6f6a62}
      .edge{fill:none;stroke:#7c7a74;stroke-width:1.55;marker-end:url(#arrow)}.edge-label{font:600 11px Inter,'Microsoft YaHei',sans-serif;fill:#716b63}
      .note-title{font:700 12px Inter,'Microsoft YaHei',sans-serif;fill:#667166}.note{font:500 13px Inter,'Microsoft YaHei',sans-serif;fill:#514c45}
    </style>
  </defs>
  <rect width="960" height="560" rx="24" fill="#fbfaf7"/>
  <text x="48" y="50" class="title">五类经典软件体系结构风格</text><text x="48" y="76" class="subtitle">不同风格规定系统级构件如何组织、共享数据和传递控制</text>
  
  <rect x="52" y="118" width="260" height="138" rx="18" fill="#e7ebeb" stroke="#536363"/><text x="182" y="154" class="node-title" text-anchor="middle" fill="#536363">数据流</text><text x="182" y="186" class="node-sub" text-anchor="middle">数据依次经过转换步骤</text><rect x="78" y="205" width="208" height="32" rx="9" fill="#fbfaf7" fill-opacity=".72"/><text x="182" y="226" class="edge-label" text-anchor="middle">管道—过滤器</text><rect x="352" y="118" width="260" height="138" rx="18" fill="#e7ece6" stroke="#596657"/><text x="482" y="154" class="node-title" text-anchor="middle" fill="#596657">调用—返回</text><text x="482" y="186" class="node-sub" text-anchor="middle">上层调用下层或远程过程</text><rect x="378" y="205" width="208" height="32" rx="9" fill="#fbfaf7" fill-opacity=".72"/><text x="482" y="226" class="edge-label" text-anchor="middle">主程序/子程序 · 分层</text><rect x="652" y="118" width="260" height="138" rx="18" fill="#eee6e3" stroke="#6f5c54"/><text x="782" y="154" class="node-title" text-anchor="middle" fill="#6f5c54">独立构件</text><text x="782" y="186" class="node-sub" text-anchor="middle">构件通过事件或消息协作</text><rect x="678" y="205" width="208" height="32" rx="9" fill="#fbfaf7" fill-opacity=".72"/><text x="782" y="226" class="edge-label" text-anchor="middle">事件系统 · 进程通信</text><rect x="52" y="288" width="260" height="138" rx="18" fill="#ece8ee" stroke="#685f6d"/><text x="182" y="324" class="node-title" text-anchor="middle" fill="#685f6d">虚拟机</text><text x="182" y="356" class="node-sub" text-anchor="middle">解释规则、指令或语言</text><rect x="78" y="375" width="208" height="32" rx="9" fill="#fbfaf7" fill-opacity=".72"/><text x="182" y="396" class="edge-label" text-anchor="middle">解释器 · 规则系统</text><rect x="352" y="288" width="260" height="138" rx="18" fill="#eee9df" stroke="#6d6250"/><text x="482" y="324" class="node-title" text-anchor="middle" fill="#6d6250">仓库</text><text x="482" y="356" class="node-sub" text-anchor="middle">多个构件共享中心数据</text><rect x="378" y="375" width="208" height="32" rx="9" fill="#fbfaf7" fill-opacity=".72"/><text x="482" y="396" class="edge-label" text-anchor="middle">数据库 · 黑板架构</text>
  <rect x="652" y="288" width="260" height="138" rx="18" fill="#ece9e3" stroke="#aaa39a"/><text x="782" y="326" class="node-title" text-anchor="middle" fill="#625e58">实际系统</text><text x="782" y="358" class="node-sub" text-anchor="middle">可以组合多种风格</text><text x="782" y="389" class="node-sub" text-anchor="middle">按主要组织关系判断</text>

  </svg>