<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="t d"><title id="t">四类软件维护</title><desc id="d">根据触发变化来源区分改正性、适应性、完善性和预防性维护。</desc><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 23px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:18px 'Microsoft YaHei',sans-serif;fill:#665e57}</style><rect width="1500" height="820" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">四类维护的区别来自“为什么要改”</text><text x="65" y="110" class="sub">同样都是修改软件，触发原因不同，维护类型也不同</text><rect x="90" y="210" width="620" height="220" rx="30" fill="#f0e7e3" stroke="#c1a196"/><text x="145" y="265" class="th">改正性维护</text><text x="145" y="310" class="tx">原系统存在缺陷或错误</text><text x="145" y="350" class="tx">例：金额计算错误 → 修复既有实现</text><rect x="790" y="210" width="620" height="220" rx="30" fill="#e8efed" stroke="#9bb3ad"/><text x="845" y="265" class="th">适应性维护</text><text x="845" y="310" class="tx">外部平台、接口或环境发生变化</text><text x="845" y="350" class="tx">例：数据库升级 → 修改兼容代码</text><rect x="90" y="490" width="620" height="220" rx="30" fill="#eef0e7" stroke="#aab397"/><text x="145" y="545" class="th">完善性维护</text><text x="145" y="590" class="tx">希望已有系统增加能力或提升质量</text><text x="145" y="630" class="tx">例：增加报表、优化响应时间</text><rect x="790" y="490" width="620" height="220" rx="30" fill="#e9e5ef" stroke="#aaa1b8"/><text x="845" y="545" class="th">预防性维护</text><text x="845" y="590" class="tx">当前尚未失败，但未来维护风险已显现</text><text x="845" y="630" class="tx">例：重构高风险模块、补自动化测试</text></svg>