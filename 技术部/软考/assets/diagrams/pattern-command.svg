<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">命令</title><desc id="desc">把一次请求变成可保存、排队和撤销的对象</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#4f493f" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c7a74"/></marker>
    <style>
      .title{font:700 25px Inter,'Microsoft YaHei',sans-serif;fill:#292724}.subtitle{font:400 13px Inter,'Microsoft YaHei',sans-serif;fill:#7c766d}
      .group{font:700 12px Inter,'Microsoft YaHei',sans-serif;fill:#8b8479;letter-spacing:.08em}.node-title{font:700 15px Inter,'Microsoft YaHei',sans-serif}.node-sub{font:400 12px Inter,'Microsoft YaHei',sans-serif;fill:#6f6a62}
      .edge{fill:none;stroke:#7c7a74;stroke-width:1.55;marker-end:url(#arrow)}.edge-label{font:600 11px Inter,'Microsoft YaHei',sans-serif;fill:#716b63}
      .note-title{font:700 12px Inter,'Microsoft YaHei',sans-serif;fill:#667166}.note{font:500 13px Inter,'Microsoft YaHei',sans-serif;fill:#514c45}
    </style>
  </defs>
  <rect width="960" height="560" rx="24" fill="#fbfaf7"/>
  <text x="48" y="50" class="title">命令</text><text x="48" y="76" class="subtitle">把一次请求变成可保存、排队和撤销的对象</text>
  <rect x="48" y="105" width="273.3333333333333" height="350" rx="18" fill="#f4f2ed" stroke="#e2ded5"/><text x="66" y="132" class="group">触发者</text><rect x="343.3333333333333" y="105" width="273.3333333333333" height="350" rx="18" fill="#f4f2ed" stroke="#e2ded5"/><text x="361.3333333333333" y="132" class="group">请求对象</text><rect x="638.6666666666666" y="105" width="273.3333333333333" height="350" rx="18" fill="#f4f2ed" stroke="#e2ded5"/><text x="656.6666666666666" y="132" class="group">执行者</text><path class="edge" d="M 307.3333333333333 204 C 332.3333333333333 204, 332.3333333333333 204, 357.3333333333333 204"/><rect x="290.3333333333333" y="192" width="84" height="20" rx="10" fill="#fbfaf7"/><text x="332.3333333333333" y="206" class="edge-label" text-anchor="middle">invoke</text><path class="edge" d="M 602.6666666666666 204 C 627.6666666666666 204, 627.6666666666666 204, 652.6666666666666 204"/><rect x="585.6666666666666" y="192" width="84" height="20" rx="10" fill="#fbfaf7"/><text x="627.6666666666666" y="206" class="edge-label" text-anchor="middle">action</text><g filter="url(#shadow)"><rect x="62" y="158" width="245.33333333333331" height="92" rx="13" fill="#e7ebeb" stroke="#94a3a3"/></g><text x="184.66666666666666" y="189" class="node-title" text-anchor="middle">Invoker</text><text x="184.66666666666666" y="214" class="node-sub" text-anchor="middle">只负责触发</text><g filter="url(#shadow)"><rect x="357.3333333333333" y="158" width="245.33333333333331" height="92" rx="13" fill="#eee6e1" stroke="#b39a8f"/></g><text x="480" y="189" class="node-title" text-anchor="middle">Command</text><text x="480" y="214" class="node-sub" text-anchor="middle">execute / undo</text><g filter="url(#shadow)"><rect x="652.6666666666666" y="158" width="245.33333333333331" height="92" rx="13" fill="#e7ece6" stroke="#95a192"/></g><text x="775.3333333333333" y="189" class="node-title" text-anchor="middle">Receiver</text><text x="775.3333333333333" y="214" class="node-sub" text-anchor="middle">完成实际操作</text><rect x="48" y="476" width="864" height="58" rx="14" fill="#eee6e1" stroke="#c6b7ae"/><text x="68" y="499" class="note-title">关键机制</text><text x="68" y="521" class="note" text-anchor="start">Invoker与Receiver解耦；请求对象化后可以进入队列、日志或历史栈。</text>
  </svg>