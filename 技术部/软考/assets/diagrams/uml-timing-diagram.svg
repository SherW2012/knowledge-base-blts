<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="t d"><title id="t">UML时序图示例</title><desc id="d">时序图以横轴时间展示状态或值随时间变化及约束。</desc><defs><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 20px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:16px 'Microsoft YaHei',sans-serif;fill:#5f5851}.grid{stroke:#d0c9c1;stroke-width:1.5}.sig{stroke:#756d65;stroke-width:4;fill:none}</style></defs><rect width="1500" height="820" rx="34" fill="#fbfaf7"/><text x="65" y="70" class="h">时序图：把“状态变化”放到真实时间横轴上</text><text x="65" y="108" class="sub">它特别适合实时系统、通信协议、硬件/嵌入式场景，关注状态持续多久以及事件发生的时间约束</text><text x="105" y="220" class="th">Door</text><text x="105" y="285" class="tx">OPEN</text><text x="105" y="385" class="tx">CLOSED</text><text x="105" y="520" class="th">Lock</text><text x="105" y="585" class="tx">LOCKED</text><text x="105" y="685" class="tx">UNLOCKED</text><g><line x1="280" y1="170" x2="280" y2="720" class="grid"/><line x1="480" y1="170" x2="480" y2="720" class="grid"/><line x1="680" y1="170" x2="680" y2="720" class="grid"/><line x1="880" y1="170" x2="880" y2="720" class="grid"/><line x1="1080" y1="170" x2="1080" y2="720" class="grid"/><line x1="1280" y1="170" x2="1280" y2="720" class="grid"/></g><g class="tx"><text x="280" y="755" text-anchor="middle">0ms</text><text x="480" y="755" text-anchor="middle">100</text><text x="680" y="755" text-anchor="middle">200</text><text x="880" y="755" text-anchor="middle">300</text><text x="1080" y="755" text-anchor="middle">400</text><text x="1280" y="755" text-anchor="middle">500</text></g><path d="M280 385H500V285H850V385H1280" class="sig"/><path d="M280 585H470V685H900V585H1280" class="sig"/><line x1="500" y1="250" x2="850" y2="250" stroke="#b99588" stroke-width="3"/><line x1="500" y1="238" x2="500" y2="262" stroke="#b99588" stroke-width="3"/><line x1="850" y1="238" x2="850" y2="262" stroke="#b99588" stroke-width="3"/><text x="675" y="230" text-anchor="middle" class="tx">{duration &lt; 200ms}</text><line x1="470" y1="470" x2="500" y2="385" stroke="#9bb3ad" stroke-width="2.5"/><text x="420" y="455" class="tx">unlock</text><line x1="850" y1="385" x2="900" y2="585" stroke="#c1a196" stroke-width="2.5"/><text x="920" y="475" class="tx">close → lock</text><rect x="250" y="780" width="1000" height="0" fill="none"/><text x="750" y="800" text-anchor="middle" class="tx">顺序图的纵轴只是先后顺序；时序图把时间本身变成建模重点，可直接表达 duration/time constraint。</text></svg>