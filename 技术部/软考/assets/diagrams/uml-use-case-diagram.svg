<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="t d"><title id="t">UML用例图示例</title><desc id="d">用例图展示参与者、系统边界、用例，以及 include、extend 和泛化。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#756d65"/></marker><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#fbfaf7" stroke="#756d65"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 22px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:17px 'Microsoft YaHei',sans-serif;fill:#5f5851}.ln{stroke:#756d65;stroke-width:2.5;fill:none}.dash{stroke:#756d65;stroke-width:2.5;fill:none;stroke-dasharray:10 8}</style></defs><rect width="1500" height="820" rx="34" fill="#fbfaf7"/><text x="65" y="70" class="h">用例图：从系统外部看“谁为了什么目标使用系统”</text><text x="65" y="108" class="sub">它表达用户目标与系统边界，不负责描述内部类结构，也不负责展开步骤的时间顺序</text><g><circle cx="130" cy="300" r="28" fill="none" stroke="#756d65" stroke-width="3"/><line x1="130" y1="328" x2="130" y2="415" class="ln"/><line x1="85" y1="355" x2="175" y2="355" class="ln"/><line x1="130" y1="415" x2="95" y2="470" class="ln"/><line x1="130" y1="415" x2="165" y2="470" class="ln"/><text x="130" y="510" text-anchor="middle" class="th">Customer</text></g><rect x="300" y="180" width="980" height="500" rx="24" fill="#f4f1eb" stroke="#91877d" stroke-width="2.5"/><text x="335" y="220" class="th">Online Shop</text><ellipse cx="575" cy="310" rx="145" ry="55" fill="#eef0e7" stroke="#9ea78d"/><text x="575" y="318" text-anchor="middle" class="th">提交订单</text><ellipse cx="930" cy="310" rx="145" ry="55" fill="#e8efed" stroke="#9bb3ad"/><text x="930" y="318" text-anchor="middle" class="th">校验身份</text><ellipse cx="575" cy="515" rx="145" ry="55" fill="#f0e7e3" stroke="#c1a196"/><text x="575" y="523" text-anchor="middle" class="th">使用优惠券</text><ellipse cx="930" cy="515" rx="145" ry="55" fill="#eeeade" stroke="#b7aa83"/><text x="930" y="523" text-anchor="middle" class="th">会员下单</text><line x1="175" y1="355" x2="430" y2="325" class="ln"/><path d="M720 310H785" class="dash" marker-end="url(#arr)"/><text x="753" y="288" text-anchor="middle" class="tx">«include»</text><path d="M575 460V375" class="dash" marker-end="url(#arr)"/><text x="610" y="422" class="tx">«extend»</text><path d="M930 460V375" class="ln" marker-end="url(#tri)"/><text x="965" y="422" class="tx">用例泛化</text><rect x="325" y="705" width="950" height="70" rx="20" fill="#fbfaf7" stroke="#bab1a6"/><text x="800" y="748" text-anchor="middle" class="tx">include = 必然复用公共行为｜extend = 条件满足时可选扩展｜泛化 = 特殊参与者或特殊用例继承一般语义</text></svg>