<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800" role="img" aria-labelledby="t d"><title id="t">ARP地址解析过程</title><desc id="d">同一局域网主机通过ARP Request和ARP Reply把IPv4地址解析为MAC地址，并说明跨网段时解析下一跳网关MAC</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 23px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:18px 'Microsoft YaHei',sans-serif;fill:#665e57}.em{font:700 17px 'Microsoft YaHei',sans-serif;fill:#6d6256}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1500" height="800" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">ARP · 已知 IPv4，下一跳帧该写哪个 MAC</text><text x="65" y="110" class="sub">IP负责逻辑寻址，MAC负责当前链路交付；ARP把这两个层次在本地链路上接起来</text><g filter="url(#s)"><rect x="90" y="220" width="340" height="255" rx="28" fill="#e7edec" stroke="#9cadaa"/><rect x="1070" y="220" width="340" height="255" rx="28" fill="#eef0e8" stroke="#aeb79b"/></g><text x="260" y="275" text-anchor="middle" class="th">Host A</text><text x="260" y="320" text-anchor="middle" class="tx">IP：192.168.1.10</text><text x="260" y="360" text-anchor="middle" class="tx">MAC：00:AA:…</text><text x="260" y="420" text-anchor="middle" class="em">已知目标IP，不知道目标MAC</text><text x="1240" y="275" text-anchor="middle" class="th">Host B</text><text x="1240" y="320" text-anchor="middle" class="tx">IP：192.168.1.20</text><text x="1240" y="360" text-anchor="middle" class="tx">MAC：AA:BB:CC:DD:EE:FF</text><path d="M430 290H1060" class="ln"/><text x="745" y="265" text-anchor="middle" class="em">ARP Request · 广播</text><text x="745" y="315" text-anchor="middle" class="tx">“谁拥有 192.168.1.20？”</text><path d="M1070 405H440" class="ln"/><text x="755" y="438" text-anchor="middle" class="em">ARP Reply · 返回映射</text><text x="755" y="470" text-anchor="middle" class="tx">“192.168.1.20 → AA:BB:CC:DD:EE:FF”</text><g filter="url(#s)"><rect x="120" y="575" width="540" height="135" rx="28" fill="#eee9e2" stroke="#b9a38f"/><rect x="840" y="575" width="540" height="135" rx="28" fill="#ebe8ef" stroke="#a89fb0"/></g><text x="390" y="620" text-anchor="middle" class="th">同一网段</text><text x="390" y="658" text-anchor="middle" class="tx">ARP解析目标主机自己的MAC</text><text x="390" y="690" text-anchor="middle" class="tx">随后直接封装本地链路帧</text><text x="1110" y="620" text-anchor="middle" class="th">跨网段</text><text x="1110" y="658" text-anchor="middle" class="tx">ARP解析的是下一跳默认网关MAC</text><text x="1110" y="690" text-anchor="middle" class="tx">不会直接得到远端服务器的MAC</text></svg>