<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560"><rect width="100%" height="100%" fill="#f8fafc"/><text x="600" y="45" text-anchor="middle" font-size="30" font-family="sans-serif">ARP：IPv4 → 当前链路 MAC</text><rect x="80" y="130" width="300" height="150" rx="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="230" y="180" text-anchor="middle" font-size="24" font-family="sans-serif">Host A</text><text x="230" y="220" text-anchor="middle" font-size="18" font-family="sans-serif">192.168.1.10</text><rect x="820" y="130" width="300" height="150" rx="20" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/><text x="970" y="180" text-anchor="middle" font-size="24" font-family="sans-serif">Host B</text><text x="970" y="220" text-anchor="middle" font-size="18" font-family="sans-serif">192.168.1.20</text><text x="970" y="252" text-anchor="middle" font-size="18" font-family="sans-serif">AA:BB:CC:DD:EE:FF</text><line x1="380" y1="175" x2="820" y2="175" stroke="#f59e0b" stroke-width="5"/><text x="600" y="155" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#92400e">ARP Request：谁是 192.168.1.20？</text><line x1="820" y1="245" x2="380" y2="245" stroke="#16a34a" stroke-width="5"/><text x="600" y="280" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#166534">ARP Reply：我的MAC是 AA:BB:CC:DD:EE:FF</text><rect x="180" y="360" width="840" height="110" rx="18" fill="#fff" stroke="#64748b"/><text x="600" y="402" text-anchor="middle" font-size="21" font-family="sans-serif">跨网段时，ARP解析的是下一跳网关MAC</text><text x="600" y="440" text-anchor="middle" font-size="18" font-family="sans-serif">DNS：域名→IP　ARP：IPv4→下一跳MAC</text></svg>