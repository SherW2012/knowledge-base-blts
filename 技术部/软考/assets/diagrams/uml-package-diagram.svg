<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="t d"><title id="t">UML包图示例</title><desc id="d">包图展示模型元素如何分组以及包之间的依赖。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#756d65"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 22px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:17px 'Microsoft YaHei',sans-serif;fill:#5f5851}.dash{stroke:#756d65;stroke-width:2.5;fill:none;stroke-dasharray:10 8}</style></defs><rect width="1500" height="760" rx="34" fill="#fbfaf7"/><text x="65" y="70" class="h">包图：把大型模型分区，并看“哪个包依赖哪个包”</text><text x="65" y="108" class="sub">包是命名空间和组织单元，不等同于运行时进程，也不等同于部署节点</text><g><rect x="110" y="240" width="330" height="230" rx="10" fill="#eef0e7" stroke="#9ea78d"/><rect x="110" y="205" width="130" height="45" rx="8" fill="#eef0e7" stroke="#9ea78d"/><text x="275" y="310" text-anchor="middle" class="th">presentation</text><text x="275" y="355" text-anchor="middle" class="tx">Controller</text><text x="275" y="390" text-anchor="middle" class="tx">ViewModel</text></g><g><rect x="585" y="240" width="330" height="230" rx="10" fill="#e8efed" stroke="#9bb3ad"/><rect x="585" y="205" width="130" height="45" rx="8" fill="#e8efed" stroke="#9bb3ad"/><text x="750" y="310" text-anchor="middle" class="th">domain</text><text x="750" y="355" text-anchor="middle" class="tx">Order</text><text x="750" y="390" text-anchor="middle" class="tx">Customer</text></g><g><rect x="1060" y="240" width="330" height="230" rx="10" fill="#f0e7e3" stroke="#c1a196"/><rect x="1060" y="205" width="130" height="45" rx="8" fill="#f0e7e3" stroke="#c1a196"/><text x="1225" y="310" text-anchor="middle" class="th">infrastructure</text><text x="1225" y="355" text-anchor="middle" class="tx">RepositoryImpl</text><text x="1225" y="390" text-anchor="middle" class="tx">MessageClient</text></g><path d="M440 350H570" class="dash" marker-end="url(#arr)"/><text x="505" y="330" text-anchor="middle" class="tx">«import»</text><path d="M1060 410H930" class="dash" marker-end="url(#arr)"/><text x="995" y="390" text-anchor="middle" class="tx">«access»</text><rect x="225" y="560" width="1050" height="105" rx="24" fill="#f4f1eb" stroke="#bab1a6"/><text x="750" y="603" text-anchor="middle" class="th">包图的核心价值：管理“大模型的边界”</text><text x="750" y="640" text-anchor="middle" class="tx">常见关系是 package dependency、import、access、merge；它表达的是模型组织与依赖，不是对象消息顺序。</text></svg>