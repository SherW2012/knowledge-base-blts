<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800" role="img" aria-labelledby="t d"><title id="t">环形复杂度与独立路径</title><desc id="d">三个判定节点形成四条线性独立路径，展示V(G)等于判定节点数加一的常见结构</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 23px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:18px 'Microsoft YaHei',sans-serif;fill:#665e57}.em{font:700 22px 'Microsoft YaHei',sans-serif;fill:#6d6256}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}.alt{fill:none;stroke:#b09f92;stroke-width:2.5;marker-end:url(#a)}</style></defs><rect width="1500" height="800" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">Cyclomatic Complexity · 控制流到底复杂到什么程度</text><text x="65" y="110" class="sub">环形复杂度衡量的是线性独立路径数量级，不是代码行数，也不是所有可能路径总数</text><g filter="url(#s)"><rect x="85" y="190" width="250" height="430" rx="28" fill="#f3efe8" stroke="#cabfaf"/><rect x="410" y="190" width="1005" height="430" rx="28" fill="#f4f1eb" stroke="#c5bcaf"/></g><text x="210" y="250" text-anchor="middle" class="th">三个常用公式</text><text x="125" y="315" class="tx">① V(G) = E - N + 2P</text><text x="125" y="365" class="tx">② 单连通图：E - N + 2</text><text x="125" y="415" class="tx">③ 常见结构化程序：</text><text x="210" y="458" text-anchor="middle" class="em">判定节点数 + 1</text><text x="210" y="535" text-anchor="middle" class="tx">本例：3个判定</text><text x="210" y="575" text-anchor="middle" class="em">V(G) = 4</text><circle cx="485" cy="405" r="48" fill="#e7edec" stroke="#9cadaa"/><text x="485" y="413" text-anchor="middle" class="tx">Start</text><polygon points="650,335 720,405 650,475 580,405" fill="#ebe8ef" stroke="#a89fb0"/><text x="650" y="413" text-anchor="middle" class="tx">D1?</text><polygon points="900,335 970,405 900,475 830,405" fill="#ebe8ef" stroke="#a89fb0"/><text x="900" y="413" text-anchor="middle" class="tx">D2?</text><polygon points="1150,335 1220,405 1150,475 1080,405" fill="#ebe8ef" stroke="#a89fb0"/><text x="1150" y="413" text-anchor="middle" class="tx">D3?</text><circle cx="1335" cy="405" r="48" fill="#eef0e8" stroke="#aeb79b"/><text x="1335" y="413" text-anchor="middle" class="tx">End</text><path d="M533 405H570" class="ln"/><path d="M720 405H820" class="ln"/><path d="M970 405H1070" class="ln"/><path d="M1220 405H1277" class="ln"/><path d="M650 475C650 545 1260 545 1300 450" class="alt"/><path d="M900 475C900 520 1250 515 1300 450" class="alt"/><path d="M1150 475C1150 500 1270 490 1300 450" class="alt"/><rect x="345" y="680" width="810" height="72" rx="20" fill="#eee9e2" stroke="#b9a38f"/><text x="750" y="710" text-anchor="middle" class="th">V(G)=4 → 可以构造4条线性独立基本路径</text><text x="750" y="738" text-anchor="middle" class="tx">不等于程序只有4条具体执行路径，更不等于测4次就能证明程序正确</text></svg>