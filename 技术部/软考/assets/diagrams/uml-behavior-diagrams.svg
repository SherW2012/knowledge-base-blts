<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="t d"><title id="t">顺序图状态图和活动图关注点</title><desc id="d">顺序图关注多个对象交互，状态图关注单个对象生命周期，活动图关注业务控制流程。</desc><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 22px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:17px 'Microsoft YaHei',sans-serif;fill:#665e57}.ln{stroke:#8c847a;stroke-width:3;fill:none}.dash{stroke:#aaa29a;stroke-width:2;stroke-dasharray:8 7}</style><rect width="1500" height="850" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">三种行为图分别把“变化”放在不同对象上观察</text><text x="65" y="110" class="sub">顺序图看多个对象如何交互，状态图看一个对象怎样变化，活动图看工作怎样流转</text><rect x="65" y="180" width="430" height="570" rx="28" fill="#eef0e7" stroke="#aab397"/><rect x="535" y="180" width="430" height="570" rx="28" fill="#e8efed" stroke="#9bb3ad"/><rect x="1005" y="180" width="430" height="570" rx="28" fill="#eee7e2" stroke="#baa495"/><text x="280" y="230" text-anchor="middle" class="th">顺序图：对象交互</text><text x="165" y="290" text-anchor="middle" class="tx">用户</text><text x="385" y="290" text-anchor="middle" class="tx">订单服务</text><line x1="165" y1="315" x2="165" y2="620" class="dash"/><line x1="385" y1="315" x2="385" y2="620" class="dash"/><line x1="165" y1="370" x2="385" y2="370" class="ln"/><text x="275" y="355" text-anchor="middle" class="tx">createOrder()</text><line x1="385" y1="460" x2="165" y2="460" class="ln"/><text x="275" y="445" text-anchor="middle" class="tx">orderId</text><text x="750" y="230" text-anchor="middle" class="th">状态图：对象生命周期</text><rect x="610" y="330" width="125" height="70" rx="28" fill="#f7f5f0" stroke="#8ca8a2"/><rect x="790" y="330" width="125" height="70" rx="28" fill="#f7f5f0" stroke="#8ca8a2"/><rect x="700" y="500" width="125" height="70" rx="28" fill="#f7f5f0" stroke="#8ca8a2"/><text x="672" y="373" text-anchor="middle" class="tx">待支付</text><text x="852" y="373" text-anchor="middle" class="tx">已支付</text><text x="762" y="543" text-anchor="middle" class="tx">已取消</text><line x1="735" y1="365" x2="790" y2="365" class="ln"/><text x="762" y="342" text-anchor="middle" class="tx">支付</text><line x1="672" y1="400" x2="735" y2="492" class="ln"/><text x="645" y="455" class="tx">超时</text><text x="1220" y="230" text-anchor="middle" class="th">活动图：控制流程</text><circle cx="1115" cy="310" r="18" fill="#766f68"/><rect x="1060" y="370" width="110" height="60" rx="18" fill="#f7f5f0" stroke="#b49c8d"/><text x="1115" y="407" text-anchor="middle" class="tx">校验</text><polygon points="1115,470 1165,520 1115,570 1065,520" fill="#f7f5f0" stroke="#b49c8d"/><text x="1115" y="526" text-anchor="middle" class="tx">库存?</text><rect x="1240" y="490" width="130" height="60" rx="18" fill="#f7f5f0" stroke="#b49c8d"/><text x="1305" y="527" text-anchor="middle" class="tx">锁库存</text><line x1="1115" y1="328" x2="1115" y2="370" class="ln"/><line x1="1115" y1="430" x2="1115" y2="470" class="ln"/><line x1="1165" y1="520" x2="1240" y2="520" class="ln"/></svg>