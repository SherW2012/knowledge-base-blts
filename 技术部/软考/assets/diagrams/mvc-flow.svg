<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800" role="img" aria-labelledby="t d"><title id="t">MVC职责关系</title><desc id="d">控制器接收用户输入，模型负责业务状态和规则，视图呈现结果</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 24px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:18px 'Microsoft YaHei',sans-serif;fill:#665e57}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}.lab{font:700 16px 'Microsoft YaHei',sans-serif;fill:#827b72}</style></defs><rect width="1500" height="800" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">MVC · 把交互应用的三种职责拆开</text><text x="65" y="110" class="sub">不是“前端、后端、数据库”三层，而是 Model、View、Controller 三种协作职责</text><g filter="url(#s)"><rect x="585" y="185" width="330" height="180" rx="28" fill="#ebe8ef" stroke="#a89fb0"/><rect x="190" y="475" width="390" height="190" rx="28" fill="#eef0e8" stroke="#aeb79b"/><rect x="920" y="475" width="390" height="190" rx="28" fill="#eee9e2" stroke="#b9a38f"/></g><text x="750" y="245" text-anchor="middle" class="th">Controller</text><text x="750" y="292" text-anchor="middle" class="tx">接收请求 / 用户输入</text><text x="750" y="330" text-anchor="middle" class="tx">决定调用什么应用行为</text><text x="385" y="535" text-anchor="middle" class="th">Model</text><text x="385" y="582" text-anchor="middle" class="tx">业务数据 · 业务规则 · 状态</text><text x="385" y="620" text-anchor="middle" class="tx">与具体界面展示解耦</text><text x="1115" y="535" text-anchor="middle" class="th">View</text><text x="1115" y="582" text-anchor="middle" class="tx">把模型状态呈现给用户</text><text x="1115" y="620" text-anchor="middle" class="tx">同一模型可以拥有不同视图</text><path d="M660 365C590 420 500 430 430 465" class="ln"/><text x="535" y="414" class="lab">调用 / 改变状态</text><path d="M580 570H910" class="ln"/><text x="745" y="548" text-anchor="middle" class="lab">读取 / 观察状态</text><path d="M1075 475C1015 420 920 405 845 365" class="ln"/><text x="990" y="414" class="lab">选择呈现 / 返回结果</text><rect x="310" y="710" width="880" height="54" rx="17" fill="#f4f1eb" stroke="#c5bcaf"/><text x="750" y="744" text-anchor="middle" class="tx">具体框架的箭头细节可以不同；判断MVC时抓住“交互控制、业务模型、界面呈现”的职责分离</text></svg>