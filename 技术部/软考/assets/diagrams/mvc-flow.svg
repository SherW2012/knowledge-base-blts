<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560"><rect width="100%" height="100%" fill="#f8fafc"/><text x="600" y="45" text-anchor="middle" font-size="30" font-family="sans-serif">MVC：Model · View · Controller</text><rect x="450" y="90" width="300" height="100" rx="20" fill="#eef2ff" stroke="#6366f1" stroke-width="3"/><text x="600" y="135" text-anchor="middle" font-size="27" font-family="sans-serif" fill="#4338ca">Controller</text><text x="600" y="168" text-anchor="middle" font-size="18" font-family="sans-serif">解释输入 / 请求</text><rect x="100" y="330" width="300" height="120" rx="20" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/><text x="250" y="380" text-anchor="middle" font-size="27" font-family="sans-serif" fill="#15803d">Model</text><text x="250" y="417" text-anchor="middle" font-size="18" font-family="sans-serif">业务数据 · 规则 · 状态</text><rect x="800" y="330" width="300" height="120" rx="20" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/><text x="950" y="380" text-anchor="middle" font-size="27" font-family="sans-serif" fill="#b45309">View</text><text x="950" y="417" text-anchor="middle" font-size="18" font-family="sans-serif">呈现状态</text><line x1="500" y1="190" x2="320" y2="330" stroke="#6366f1" stroke-width="4"/><line x1="400" y1="390" x2="800" y2="390" stroke="#16a34a" stroke-width="4"/><line x1="900" y1="330" x2="700" y2="190" stroke="#f59e0b" stroke-width="4"/><text x="600" y="510" text-anchor="middle" font-size="20" font-family="sans-serif" fill="#475569">抓职责分离，不要把MVC机械等同于“前端/后端/数据库三层”</text></svg>