<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800" role="img" aria-labelledby="t d"><title id="t">IP路由、下一跳与ARP</title><desc id="d">目标IP用于路由查找得到出口接口与下一跳IP，ARP再把以太网链路上的下一跳IPv4地址解析为MAC地址</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 23px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:18px 'Microsoft YaHei',sans-serif;fill:#665e57}.em{font:700 18px 'Microsoft YaHei',sans-serif;fill:#6d6256}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1500" height="800" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">IP 路由 · 从最终目标到当前链路下一跳</text><text x="65" y="110" class="sub">路由表负责选择出口与下一跳；ARP只解决当前以太网链路上的IPv4到MAC映射</text><g filter="url(#s)"><rect x="90" y="235" width="300" height="210" rx="28" fill="#e7edec" stroke="#9cadaa"/><rect x="600" y="235" width="300" height="210" rx="28" fill="#eee9e2" stroke="#b9a38f"/><rect x="1110" y="235" width="300" height="210" rx="28" fill="#eef0e8" stroke="#aeb79b"/></g><text x="240" y="290" text-anchor="middle" class="th">最终目标 IP</text><text x="240" y="342" text-anchor="middle" class="em">192.168.20.30</text><text x="240" y="390" text-anchor="middle" class="tx">网络层端到端目标</text><text x="750" y="290" text-anchor="middle" class="th">本机路由表</text><text x="750" y="342" text-anchor="middle" class="em">目标前缀 → 出口 / 下一跳</text><text x="750" y="390" text-anchor="middle" class="tx">例：下一跳 192.168.10.1</text><text x="1260" y="290" text-anchor="middle" class="th">本机 ARP 缓存</text><text x="1260" y="342" text-anchor="middle" class="em">下一跳 IPv4 → 下一跳 MAC</text><text x="1260" y="390" text-anchor="middle" class="tx">用于当前以太网帧交付</text><path d="M390 340H590" class="ln"/><path d="M900 340H1100" class="ln"/><g filter="url(#s)"><rect x="250" y="565" width="1000" height="125" rx="28" fill="#ebe8ef" stroke="#a89fb0"/></g><text x="750" y="615" text-anchor="middle" class="th">转发边界</text><text x="750" y="657" text-anchor="middle" class="tx">无NAT时源/目标IP保持端到端关系；进入新的链路时重新生成该链路的源、目标MAC</text></svg>