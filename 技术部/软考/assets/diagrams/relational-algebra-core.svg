<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="t d"><title id="t">关系代数核心运算</title><desc id="d">选择减少行，投影减少列，连接组合两个关系</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 23px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:17px 'Microsoft YaHei',sans-serif;fill:#665e57}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1500" height="850" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">选择控制行，投影控制列，连接组合关系</text><text x="65" y="110" class="sub">三种运算的结果仍然是关系，可以继续参与下一步运算</text>
<g filter="url(#s)"><rect x="65" y="175" width="405" height="500" rx="28" fill="#eef0e8" stroke="#aeb79b"/><rect x="548" y="175" width="405" height="500" rx="28" fill="#e6efed" stroke="#94afa9"/><rect x="1030" y="175" width="405" height="500" rx="28" fill="#eee9e2" stroke="#b9a38f"/></g><text x="267" y="225" text-anchor="middle" class="th">选择 σ</text><text x="267" y="258" text-anchor="middle" class="tx">按条件保留行</text><text x="750" y="225" text-anchor="middle" class="th">投影 π</text><text x="750" y="258" text-anchor="middle" class="tx">保留指定列</text><text x="1232" y="225" text-anchor="middle" class="th">连接 ⋈</text><text x="1232" y="258" text-anchor="middle" class="tx">按联系组合两个关系</text>
<g stroke="#9c948a" stroke-width="2" fill="#fffefa"><rect x="125" y="310" width="285" height="240"/><rect x="608" y="310" width="285" height="240"/><rect x="1075" y="310" width="150" height="190"/><rect x="1260" y="310" width="130" height="190"/></g><g stroke="#9c948a" stroke-width="2"><path d="M125 365H410M125 425H410M125 485H410M220 310V550M315 310V550"/><path d="M608 365H893M608 425H893M608 485H893M703 310V550M798 310V550"/><path d="M1075 365H1225M1075 425H1225M1150 310V500M1260 365H1390M1260 425H1390M1325 310V500"/></g><rect x="126" y="426" width="283" height="58" fill="#d8e5d1" opacity=".9"/><rect x="704" y="311" width="93" height="238" fill="#cfe0dc" opacity=".9"/><path d="M1140 520C1170 580 1280 580 1310 520" class="ln"/>
<text x="267" y="610" text-anchor="middle" class="tx">σ score≥60(Enroll)</text><text x="750" y="610" text-anchor="middle" class="tx">π name(Student)</text><text x="1232" y="610" text-anchor="middle" class="tx">Student ⋈ Enroll</text><rect x="350" y="730" width="800" height="70" rx="20" fill="#f4f1eb" stroke="#c5bcaf"/><text x="750" y="774" text-anchor="middle" class="th">闭包性：每一步结果都能继续选择、投影、连接或参与集合运算</text></svg>
