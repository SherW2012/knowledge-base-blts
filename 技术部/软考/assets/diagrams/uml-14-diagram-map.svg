<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="t d"><title id="t">UML 2.x 十四种图分类</title><desc id="d">UML图分为结构图和行为图，交互图属于行为图子集。</desc><defs><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 24px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:18px 'Microsoft YaHei',sans-serif;fill:#5f5851}.sm{font:16px 'Microsoft YaHei',sans-serif;fill:#6f675f}</style></defs><rect width="1500" height="900" rx="34" fill="#fbfaf7"/><text x="65" y="70" class="h">UML 2.x：14种图先按“结构”与“行为”分家</text><text x="65" y="108" class="sub">交互图不是第三大类，而是行为图中的一个子类</text><rect x="80" y="170" width="630" height="610" rx="28" fill="#eef0e7" stroke="#aab397"/><text x="395" y="220" text-anchor="middle" class="th">结构图 Structure Diagrams</text><text x="395" y="252" text-anchor="middle" class="sm">描述系统“是什么、由什么组成、怎么静态连接”</text><g class="tx"><text x="130" y="320">1. 类图 Class Diagram</text><text x="130" y="375">2. 对象图 Object Diagram</text><text x="130" y="430">3. 构件图 Component Diagram</text><text x="130" y="485">4. 组合结构图 Composite Structure Diagram</text><text x="130" y="540">5. 包图 Package Diagram</text><text x="130" y="595">6. 部署图 Deployment Diagram</text><text x="130" y="650">7. 轮廓图 Profile Diagram</text></g><rect x="790" y="170" width="630" height="610" rx="28" fill="#e8efed" stroke="#9bb3ad"/><text x="1105" y="220" text-anchor="middle" class="th">行为图 Behavior Diagrams</text><text x="1105" y="252" text-anchor="middle" class="sm">描述系统“做什么、怎样变化、怎样协作”</text><g class="tx"><text x="840" y="320">8. 用例图 Use Case Diagram</text><text x="840" y="375">9. 活动图 Activity Diagram</text><text x="840" y="430">10. 状态机图 State Machine Diagram</text></g><rect x="835" y="485" width="540" height="240" rx="22" fill="#f0e7e3" stroke="#c1a196"/><text x="1105" y="525" text-anchor="middle" class="th">交互图 Interaction Diagrams</text><text x="1105" y="562" text-anchor="middle" class="sm">行为图子集：专门描述多个参与者之间的交互</text><g class="tx"><text x="875" y="610">11. 顺序图 Sequence Diagram</text><text x="875" y="650">12. 通信图 Communication Diagram</text><text x="875" y="690">13. 交互概览图 Interaction Overview Diagram</text><text x="875" y="730">14. 时序图 Timing Diagram</text></g><rect x="180" y="810" width="1140" height="55" rx="18" fill="#f4f1eb" stroke="#bab1a6"/><text x="750" y="845" text-anchor="middle" class="tx">记忆主线：结构图看“静态骨架”｜行为图看“动态变化”｜交互图看“多对象如何协作”</text></svg>