<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800" role="img" aria-labelledby="t d"><title id="t">嵌入式中断与任务处理链</title><desc id="d">设备事件触发中断，ISR快速处理并唤醒任务，复杂工作在普通任务上下文完成。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 22px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:17px 'Microsoft YaHei',sans-serif;fill:#665e57}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1500" height="800" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">中断只负责及时接住事件，复杂工作交给普通任务</text><text x="65" y="110" class="sub">这样既保持外设响应速度，也避免中断服务程序长期占住处理器</text><g><rect x="70" y="270" width="230" height="170" rx="26" fill="#eef0e7" stroke="#aab397"/><rect x="365" y="270" width="230" height="170" rx="26" fill="#e8efed" stroke="#9bb3ad"/><rect x="660" y="245" width="230" height="220" rx="26" fill="#eee7e2" stroke="#baa495"/><rect x="955" y="270" width="230" height="170" rx="26" fill="#e9e5ef" stroke="#aaa1b8"/><rect x="1250" y="270" width="180" height="170" rx="26" fill="#f0e7e3" stroke="#c1a196"/></g><text x="185" y="325" text-anchor="middle" class="th">外设事件</text><text x="185" y="365" text-anchor="middle" class="tx">数据到达 / 定时器</text><text x="185" y="400" text-anchor="middle" class="tx">传感器变化</text><text x="480" y="325" text-anchor="middle" class="th">中断控制器</text><text x="480" y="365" text-anchor="middle" class="tx">通知 CPU</text><text x="775" y="305" text-anchor="middle" class="th">ISR</text><text x="775" y="350" text-anchor="middle" class="tx">确认中断</text><text x="775" y="385" text-anchor="middle" class="tx">读取必要状态</text><text x="775" y="420" text-anchor="middle" class="tx">发消息/释放信号量</text><text x="1070" y="325" text-anchor="middle" class="th">后台任务</text><text x="1070" y="365" text-anchor="middle" class="tx">协议解析、计算</text><text x="1070" y="400" text-anchor="middle" class="tx">业务处理</text><text x="1340" y="325" text-anchor="middle" class="th">输出</text><text x="1340" y="365" text-anchor="middle" class="tx">控制 / 存储</text><path d="M300 355H355" class="ln"/><path d="M595 355H650" class="ln"/><path d="M890 355H945" class="ln"/><path d="M1185 355H1240" class="ln"/><text x="750" y="610" text-anchor="middle" class="th">为什么 ISR 要短？</text><text x="750" y="655" text-anchor="middle" class="tx">ISR执行太久会推迟其他中断和高优先级任务，破坏系统响应时间的可预测性</text></svg>