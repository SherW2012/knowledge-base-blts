<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800" role="img" aria-labelledby="t d"><title id="t">UML组合结构图示例</title><desc id="d">组合结构图展示一个分类器内部的部件、端口和连接器。</desc><defs><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 22px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:17px 'Microsoft YaHei',sans-serif;fill:#5f5851}.ln{stroke:#756d65;stroke-width:2.5;fill:none}</style></defs><rect width="1500" height="800" rx="34" fill="#fbfaf7"/><text x="65" y="70" class="h">组合结构图：钻进一个类或构件内部，看“里面怎么拼”</text><text x="65" y="108" class="sub">类图看分类器之间的外部关系；组合结构图看某个分类器内部的 part、port 与 connector</text><rect x="150" y="180" width="1200" height="500" rx="28" fill="#f4f1eb" stroke="#91877d" stroke-width="2.5"/><text x="190" y="225" class="th">OrderProcessor</text><text x="190" y="255" class="tx">内部结构</text><rect x="300" y="330" width="280" height="170" rx="18" fill="#eef0e7" stroke="#9ea78d"/><text x="440" y="385" text-anchor="middle" class="th">validator : Validator</text><text x="440" y="425" text-anchor="middle" class="tx">校验订单</text><rect x="920" y="330" width="280" height="170" rx="18" fill="#e8efed" stroke="#9bb3ad"/><text x="1060" y="385" text-anchor="middle" class="th">executor : Executor</text><text x="1060" y="425" text-anchor="middle" class="tx">执行处理</text><rect x="145" y="380" width="18" height="60" fill="#f0e7e3" stroke="#c1a196"/><text x="185" y="415" class="tx">inPort</text><rect x="1337" y="380" width="18" height="60" fill="#f0e7e3" stroke="#c1a196"/><text x="1240" y="415" class="tx">outPort</text><line x1="163" y1="410" x2="300" y2="410" class="ln"/><line x1="580" y1="410" x2="920" y2="410" class="ln"/><line x1="1200" y1="410" x2="1337" y2="410" class="ln"/><text x="750" y="390" text-anchor="middle" class="tx">connector</text><rect x="230" y="575" width="1040" height="70" rx="18" fill="#fbfaf7" stroke="#bab1a6"/><text x="750" y="617" text-anchor="middle" class="tx">part = 内部角色实例｜port = 对外暴露的交互点｜connector = 内部部件或端口之间的连接</text></svg>