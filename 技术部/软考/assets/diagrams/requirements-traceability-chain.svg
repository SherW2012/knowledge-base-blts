<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="t d"><title id="t">需求追踪链</title><desc id="d">从业务目标、需求、设计、实现到测试建立正向和反向追踪。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 22px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:17px 'Microsoft YaHei',sans-serif;fill:#665e57}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}.back{fill:none;stroke:#b19a8d;stroke-width:2.5;stroke-dasharray:8 8;marker-end:url(#a)}</style></defs><rect width="1500" height="760" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">追踪关系让每个实现都能找到上游理由</text><text x="65" y="110" class="sub">正向检查需求有没有落实，反向检查实现有没有需求依据</text><g><rect x="80" y="260" width="230" height="150" rx="24" fill="#eef0e7" stroke="#aab397"/><rect x="365" y="260" width="230" height="150" rx="24" fill="#e8efed" stroke="#9bb3ad"/><rect x="650" y="260" width="230" height="150" rx="24" fill="#eee7e2" stroke="#baa495"/><rect x="935" y="260" width="230" height="150" rx="24" fill="#e9e5ef" stroke="#aaa1b8"/><rect x="1220" y="260" width="200" height="150" rx="24" fill="#f0e7e3" stroke="#c1a196"/></g><text x="195" y="315" text-anchor="middle" class="th">业务目标</text><text x="195" y="360" text-anchor="middle" class="tx">为什么建设</text><text x="480" y="315" text-anchor="middle" class="th">需求 R12</text><text x="480" y="360" text-anchor="middle" class="tx">系统必须做到什么</text><text x="765" y="315" text-anchor="middle" class="th">设计 D7</text><text x="765" y="360" text-anchor="middle" class="tx">怎样组织实现</text><text x="1050" y="315" text-anchor="middle" class="th">代码 M3</text><text x="1050" y="360" text-anchor="middle" class="tx">具体实现位置</text><text x="1320" y="315" text-anchor="middle" class="th">测试 T21</text><text x="1320" y="360" text-anchor="middle" class="tx">如何证明满足</text><path d="M310 335H355" class="ln"/><path d="M595 335H640" class="ln"/><path d="M880 335H925" class="ln"/><path d="M1165 335H1210" class="ln"/><path d="M1320 430C1280 590 250 590 195 430" class="back"/><text x="750" y="650" text-anchor="middle" class="tx">需求变化时沿链向后做影响分析；发现多余实现时沿链向前寻找来源</text></svg>