<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="t d"><title id="t">事务ACID性质与实现机制</title><desc id="d">原子性、一致性、隔离性、持久性及常见实现支撑</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 24px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:17px 'Microsoft YaHei',sans-serif;fill:#665e57}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1500" height="850" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">ACID描述事务承诺，底层机制共同实现这些承诺</text><text x="65" y="110" class="sub">一致性是总体目标，原子性、隔离性和持久性为它提供关键运行保障</text>
<g filter="url(#s)"><rect x="70" y="180" width="310" height="260" rx="28" fill="#eef0e8" stroke="#aeb79b"/><rect x="420" y="180" width="310" height="260" rx="28" fill="#e6efed" stroke="#94afa9"/><rect x="770" y="180" width="310" height="260" rx="28" fill="#eee9e2" stroke="#b9a38f"/><rect x="1120" y="180" width="310" height="260" rx="28" fill="#ebe7f0" stroke="#aaa0bf"/></g><text x="225" y="230" text-anchor="middle" class="th">A 原子性</text><text x="225" y="275" text-anchor="middle" class="tx">全部生效或全部撤销</text><text x="225" y="330" text-anchor="middle" class="th">常见支撑</text><text x="225" y="370" text-anchor="middle" class="tx">UNDO日志 · 回滚</text><text x="575" y="230" text-anchor="middle" class="th">C 一致性</text><text x="575" y="275" text-anchor="middle" class="tx">一致状态到一致状态</text><text x="575" y="330" text-anchor="middle" class="th">共同支撑</text><text x="575" y="370" text-anchor="middle" class="tx">约束 + 正确事务逻辑</text><text x="925" y="230" text-anchor="middle" class="th">I 隔离性</text><text x="925" y="275" text-anchor="middle" class="tx">控制并发事务相互可见</text><text x="925" y="330" text-anchor="middle" class="th">常见支撑</text><text x="925" y="370" text-anchor="middle" class="tx">锁 · MVCC · 时间戳</text><text x="1275" y="230" text-anchor="middle" class="th">D 持久性</text><text x="1275" y="275" text-anchor="middle" class="tx">提交结果故障后可恢复</text><text x="1275" y="330" text-anchor="middle" class="th">常见支撑</text><text x="1275" y="370" text-anchor="middle" class="tx">WAL · 刷盘 · 复制</text>
<rect x="300" y="580" width="900" height="125" rx="26" fill="#f4f1eb" stroke="#c5bcaf"/><text x="750" y="625" text-anchor="middle" class="th">一致性还要求事务程序本身正确</text><text x="750" y="665" text-anchor="middle" class="tx">数据库可以保证一组错误操作被原子提交，却不能自动判断业务规则是否写错</text><path d="M575 440V570" class="ln"/></svg>
