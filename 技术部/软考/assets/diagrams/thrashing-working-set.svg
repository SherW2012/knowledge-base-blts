<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780" role="img" aria-labelledby="t d"><title id="t">抖动与工作集</title><desc id="d">工作集大于可用页框时，页面反复换入换出形成抖动；增加页框覆盖工作集后缺页率下降</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 23px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:18px 'Microsoft YaHei',sans-serif;fill:#665e57}.em{font:700 18px 'Microsoft YaHei',sans-serif;fill:#8d6558}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1500" height="780" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">Thrashing · 系统为什么“忙着换页却没干活”</text><text x="65" y="110" class="sub">问题不在于偶尔缺页，而在于活跃页面集合大于可用页框，刚换出的页面很快又要换回来</text><g filter="url(#s)"><rect x="80" y="215" width="360" height="280" rx="28" fill="#eee9e2" stroke="#b9a38f"/><rect x="570" y="215" width="360" height="280" rx="28" fill="#eee6e3" stroke="#b39b95"/><rect x="1060" y="215" width="360" height="280" rx="28" fill="#e7edec" stroke="#9cadaa"/></g><text x="260" y="270" text-anchor="middle" class="th">工作集 Working Set</text><text x="260" y="315" text-anchor="middle" class="tx">近期反复访问：</text><text x="260" y="365" text-anchor="middle" class="em">1 · 2 · 3 · 4</text><text x="260" y="420" text-anchor="middle" class="tx">当前真正活跃的页面集合</text><text x="750" y="270" text-anchor="middle" class="th">只给 2 个页框</text><rect x="645" y="325" width="90" height="68" rx="14" fill="#f4f1eb" stroke="#c5bcaf"/><rect x="765" y="325" width="90" height="68" rx="14" fill="#f4f1eb" stroke="#c5bcaf"/><text x="690" y="368" text-anchor="middle" class="tx">1</text><text x="810" y="368" text-anchor="middle" class="tx">2</text><text x="750" y="440" text-anchor="middle" class="tx">3来 → 淘汰1；1又来 → 再淘汰</text><text x="1240" y="270" text-anchor="middle" class="th">结果：抖动</text><text x="1240" y="325" text-anchor="middle" class="tx">缺页异常频繁</text><text x="1240" y="365" text-anchor="middle" class="tx">磁盘 / SSD I/O 增多</text><text x="1240" y="405" text-anchor="middle" class="tx">有效计算时间下降</text><text x="1240" y="445" text-anchor="middle" class="em">系统看起来很忙，但吞吐下降</text><path d="M440 355H560" class="ln"/><path d="M930 355H1050" class="ln"/><rect x="245" y="590" width="1010" height="110" rx="24" fill="#eef0e8" stroke="#aeb79b"/><text x="750" y="630" text-anchor="middle" class="th">恢复思路：让页框更接近当前工作集需要</text><text x="750" y="665" text-anchor="middle" class="tx">Working Set直接观察近期活跃页；PFF根据缺页频率判断“页框是不是太少”</text></svg>