<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="t d"><title id="t">UML对象图示例</title><desc id="d">对象图表示类图在某一时刻的实例快照。</desc><defs><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 22px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:17px 'Microsoft YaHei',sans-serif;fill:#5f5851}.ln{stroke:#756d65;stroke-width:2.5;fill:none}</style></defs><rect width="1500" height="760" rx="34" fill="#fbfaf7"/><text x="65" y="70" class="h">对象图：把类图“拍一张运行时快照”</text><text x="65" y="108" class="sub">类图说“可能有哪些对象和关系”，对象图说“此刻具体有哪些实例、属性值和链接”</text><g><rect x="100" y="210" width="350" height="230" rx="14" fill="#eef0e7" stroke="#9ea78d"/><line x1="100" y1="270" x2="450" y2="270" class="ln"/><text x="275" y="248" text-anchor="middle" class="th" text-decoration="underline">order001 : Order</text><text x="130" y="315" class="tx">orderId = "001"</text><text x="130" y="350" class="tx">status = PAID</text><text x="130" y="385" class="tx">amount = 320</text></g><g><rect x="590" y="210" width="350" height="230" rx="14" fill="#e8efed" stroke="#9bb3ad"/><line x1="590" y1="270" x2="940" y2="270" class="ln"/><text x="765" y="248" text-anchor="middle" class="th" text-decoration="underline">itemA : OrderItem</text><text x="620" y="315" class="tx">sku = "A-12"</text><text x="620" y="350" class="tx">quantity = 2</text><text x="620" y="385" class="tx">price = 160</text></g><g><rect x="1080" y="210" width="320" height="230" rx="14" fill="#f0e7e3" stroke="#c1a196"/><line x1="1080" y1="270" x2="1400" y2="270" class="ln"/><text x="1240" y="248" text-anchor="middle" class="th" text-decoration="underline">alice : Customer</text><text x="1110" y="315" class="tx">name = "Alice"</text><text x="1110" y="350" class="tx">level = VIP</text></g><line x1="450" y1="325" x2="590" y2="325" class="ln"/><text x="520" y="307" text-anchor="middle" class="tx">items</text><line x1="450" y1="390" x2="1080" y2="390" class="ln"/><text x="765" y="372" text-anchor="middle" class="tx">buyer</text><rect x="190" y="535" width="1120" height="120" rx="24" fill="#f4f1eb" stroke="#bab1a6"/><text x="750" y="580" text-anchor="middle" class="th">理解关键</text><text x="750" y="620" text-anchor="middle" class="tx">对象名:类名通常带下划线；属性出现具体值；对象之间的“链接”是类图关联关系在某一时刻的实例。</text></svg>