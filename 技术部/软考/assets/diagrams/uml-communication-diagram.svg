<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780" role="img" aria-labelledby="t d"><title id="t">UML通信图示例</title><desc id="d">通信图通过对象连接与消息编号表达交互，突出结构网络。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#756d65"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 20px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:16px 'Microsoft YaHei',sans-serif;fill:#5f5851}.ln{stroke:#8a8178;stroke-width:2.5;fill:none}.msg{stroke:#756d65;stroke-width:2.2;fill:none;marker-end:url(#arr)}</style></defs><rect width="1500" height="780" rx="34" fill="#fbfaf7"/><text x="65" y="70" class="h">通信图：仍然讲交互，但更强调“对象连接网络”</text><text x="65" y="108" class="sub">没有顺序图那条明显的纵向时间轴，消息先后主要靠 1、1.1、1.2、2 等编号表达</text><rect x="100" y="280" width="260" height="90" rx="14" fill="#eef0e7" stroke="#9ea78d"/><text x="230" y="335" text-anchor="middle" class="th">user : User</text><rect x="620" y="180" width="280" height="90" rx="14" fill="#e8efed" stroke="#9bb3ad"/><text x="760" y="235" text-anchor="middle" class="th">order : OrderService</text><rect x="620" y="500" width="280" height="90" rx="14" fill="#f0e7e3" stroke="#c1a196"/><text x="760" y="555" text-anchor="middle" class="th">stock : StockService</text><rect x="1130" y="300" width="280" height="90" rx="14" fill="#eeeade" stroke="#b7aa83"/><text x="1270" y="355" text-anchor="middle" class="th">pay : PaymentService</text><line x1="360" y1="325" x2="620" y2="230" class="ln"/><line x1="760" y1="270" x2="760" y2="500" class="ln"/><line x1="900" y1="225" x2="1130" y2="330" class="ln"/><path d="M390 300L585 235" class="msg"/><text x="470" y="245" class="tx">1: createOrder()</text><path d="M780 295V470" class="msg"/><text x="805" y="390" class="tx">1.1: reserve()</text><path d="M925 250L1105 330" class="msg"/><text x="1015" y="260" class="tx">1.2: createPayment()</text><rect x="250" y="650" width="1000" height="70" rx="20" fill="#f4f1eb" stroke="#bab1a6"/><text x="750" y="692" text-anchor="middle" class="tx">顺序图突出“时间先后”，通信图突出“谁与谁有链接”；二者都属于交互图，通常可以表达同一场景。</text></svg>