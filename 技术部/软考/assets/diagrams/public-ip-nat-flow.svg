<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="t d"><title id="t">私网主机访问公网IP与NAT</title><desc id="d">私网主机通过默认网关和NAT访问拥有公网IP的服务器，源地址在出口被转换</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 22px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:18px 'Microsoft YaHei',sans-serif;fill:#665e57}.em{font:700 17px 'Microsoft YaHei',sans-serif;fill:#6d6256}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1500" height="850" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">访问公网 IP · NAT 改源地址，不是把目标改成网关</text><text x="65" y="110" class="sub">目标公网IP从一开始就是最终服务器；默认网关只是本地下一跳</text><g filter="url(#s)"><rect x="70" y="245" width="290" height="220" rx="28" fill="#e7edec" stroke="#9cadaa"/><rect x="465" y="215" width="350" height="280" rx="30" fill="#eee9e2" stroke="#b9a38f"/><rect x="930" y="245" width="210" height="220" rx="28" fill="#ebe8ef" stroke="#a89fb0"/><rect x="1245" y="245" width="190" height="220" rx="28" fill="#eef0e8" stroke="#aeb79b"/></g><text x="215" y="300" text-anchor="middle" class="th">内网主机</text><text x="215" y="345" text-anchor="middle" class="tx">192.168.10.20</text><text x="215" y="392" text-anchor="middle" class="em">目标：8.8.8.8</text><text x="640" y="270" text-anchor="middle" class="th">出口网关 / NAT</text><text x="640" y="315" text-anchor="middle" class="tx">内网接口：192.168.10.1</text><text x="640" y="350" text-anchor="middle" class="tx">公网接口：1.1.1.1</text><text x="640" y="402" text-anchor="middle" class="em">SNAT：192.168.10.20 → 1.1.1.1</text><text x="640" y="448" text-anchor="middle" class="tx">并保存连接/NAT映射</text><text x="1035" y="300" text-anchor="middle" class="th">Internet</text><text x="1035" y="350" text-anchor="middle" class="tx">公网路由器</text><text x="1035" y="400" text-anchor="middle" class="em">按目标 8.8.8.8 路由</text><text x="1340" y="300" text-anchor="middle" class="th">公网服务器</text><text x="1340" y="350" text-anchor="middle" class="tx">8.8.8.8</text><text x="1340" y="400" text-anchor="middle" class="em">服务器自己拥有公网IP</text><path d="M360 355H455" class="ln"/><path d="M815 355H920" class="ln"/><path d="M1140 355H1235" class="ln"/><g filter="url(#s)"><rect x="160" y="600" width="1180" height="150" rx="28" fill="#fbfaf7" stroke="#b9a38f"/></g><text x="210" y="645" class="th">地址变化</text><text x="210" y="690" class="tx">主机发出：源 192.168.10.20　→　目标 8.8.8.8</text><text x="210" y="725" class="tx">进入公网：源 1.1.1.1　　　 →　目标 8.8.8.8</text><text x="1015" y="690" class="em">目标从未变成“网关IP”</text></svg>