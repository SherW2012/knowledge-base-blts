<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">一台计算机内部怎样协作</title><desc id="desc">位置和包含关系本身就是知识：缓存位于CPU内，外设位于主机边界之外</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#4f493f" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c7a74"/></marker>
    <style>
      .title{font:700 25px Inter,'Microsoft YaHei',sans-serif;fill:#292724}.subtitle{font:400 13px Inter,'Microsoft YaHei',sans-serif;fill:#7c766d}
      .group{font:700 12px Inter,'Microsoft YaHei',sans-serif;fill:#8b8479;letter-spacing:.08em}.node-title{font:700 15px Inter,'Microsoft YaHei',sans-serif}.node-sub{font:400 12px Inter,'Microsoft YaHei',sans-serif;fill:#6f6a62}
      .edge{fill:none;stroke:#7c7a74;stroke-width:1.55;marker-end:url(#arrow)}.edge-label{font:600 11px Inter,'Microsoft YaHei',sans-serif;fill:#716b63}
      .note-title{font:700 12px Inter,'Microsoft YaHei',sans-serif;fill:#667166}.note{font:500 13px Inter,'Microsoft YaHei',sans-serif;fill:#514c45}
    </style>
  </defs>
  <rect width="960" height="560" rx="24" fill="#fbfaf7"/>
  <text x="48" y="50" class="title">一台计算机内部怎样协作</text><text x="48" y="76" class="subtitle">位置和包含关系本身就是知识：缓存位于CPU内，外设位于主机边界之外</text>
  
  <rect x="45" y="106" width="680" height="390" rx="24" fill="#f2f1eb" stroke="#aaa79f"/><text x="68" y="137" class="group">主机内部 · 主板与总线互连</text>
  <g filter="url(#shadow)"><rect x="72" y="164" width="245" height="150" rx="17" fill="#e7ebeb" stroke="#9aa7a6"/><text x="194" y="194" class="node-title" text-anchor="middle" fill="#536363">CPU 处理器</text><text x="194" y="217" class="node-sub" text-anchor="middle">执行指令与控制系统</text><rect x="104" y="235" width="181" height="55" rx="12" fill="#e4ebe5" stroke="#96a498"/><text x="194" y="258" class="node-title" text-anchor="middle" fill="#5b695f">高速缓存</text><text x="194" y="278" class="node-sub" text-anchor="middle">L1 / L2 / L3</text></g>
  <g filter="url(#shadow)"><rect x="342" y="164" width="340" height="150" rx="17" fill="#eee6e3" stroke="#b39b95"/><text x="512" y="215" class="node-title" text-anchor="middle" fill="#6f5c54">GPU 显卡</text><text x="512" y="242" class="node-sub" text-anchor="middle">图形与并行计算 · 图像输出</text></g>
  <g filter="url(#shadow)"><rect x="72" y="340" width="196" height="98" rx="15" fill="#ebe8ed" stroke="#a29aa8"/><text x="170" y="378" class="node-title" text-anchor="middle" fill="#655e6b">RAM 内存</text><text x="170" y="402" class="node-sub" text-anchor="middle">运行中的代码与数据</text></g>
  <g filter="url(#shadow)"><rect x="292" y="340" width="190" height="98" rx="15" fill="#eee9df" stroke="#b3a386"/><text x="387" y="378" class="node-title" text-anchor="middle" fill="#6d6250">PCH 芯片组</text><text x="387" y="402" class="node-sub" text-anchor="middle">连接存储与外设</text></g>
  <g filter="url(#shadow)"><rect x="506" y="340" width="176" height="98" rx="15" fill="#e7ebe3" stroke="#9da58b"/><text x="594" y="378" class="node-title" text-anchor="middle" fill="#626b56">SSD / 硬盘</text><text x="594" y="402" class="node-sub" text-anchor="middle">长期保存数据</text></g>
  <rect x="757" y="147" width="158" height="72" rx="15" fill="#eee6e8" stroke="#b29aa0"/><text x="836" y="177" class="node-title" text-anchor="middle" fill="#705b61">显示器</text><text x="836" y="199" class="node-sub" text-anchor="middle">输出设备</text>
  <rect x="757" y="247" width="158" height="72" rx="15" fill="#eee6e8" stroke="#b29aa0"/><text x="836" y="277" class="node-title" text-anchor="middle" fill="#705b61">键盘 / 鼠标</text><text x="836" y="299" class="node-sub" text-anchor="middle">输入设备</text>
  <rect x="757" y="347" width="158" height="72" rx="15" fill="#ece9e3" stroke="#aaa39a"/><text x="836" y="377" class="node-title" text-anchor="middle" fill="#625e58">网络与USB</text><text x="836" y="399" class="node-sub" text-anchor="middle">外部连接</text>
