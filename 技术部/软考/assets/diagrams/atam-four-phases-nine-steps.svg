<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="t d"><title id="t">ATAM四阶段九步骤</title><desc id="d">ATAM从介绍背景、调查分析、利益相关者深入测试到结果报告的九个步骤。</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".11"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.ph{font:700 25px 'Microsoft YaHei',sans-serif;fill:#48413b}.st{font:700 18px 'Microsoft YaHei',sans-serif;fill:#514a44}.tx{font:16px 'Microsoft YaHei',sans-serif;fill:#6d655e}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1500" height="900" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">ATAM从业务背景推进到架构风险与权衡</text><text x="65" y="110" class="sub">效用树驱动第一轮分析，广泛利益相关者的场景用于再次检验和补充</text>
<g filter="url(#s)"><rect x="55" y="165" width="300" height="610" rx="28" fill="#eef0e7" stroke="#abb399"/><rect x="415" y="165" width="300" height="610" rx="28" fill="#e6efed" stroke="#94afa9"/><rect x="775" y="165" width="300" height="610" rx="28" fill="#ece5df" stroke="#b49d8c"/><rect x="1135" y="165" width="310" height="610" rx="28" fill="#e9e5ef" stroke="#aaa0b8"/></g>
<text x="205" y="220" text-anchor="middle" class="ph">阶段一　介绍</text><text x="565" y="220" text-anchor="middle" class="ph">阶段二　调查与分析</text><text x="925" y="220" text-anchor="middle" class="ph">阶段三　深入测试</text><text x="1290" y="220" text-anchor="middle" class="ph">阶段四　报告</text>
<g><rect x="90" y="270" width="230" height="90" rx="20" fill="#fbfaf7" stroke="#abb399"/><text x="205" y="306" text-anchor="middle" class="st">1 介绍ATAM</text><text x="205" y="335" text-anchor="middle" class="tx">统一方法与预期</text><rect x="90" y="400" width="230" height="90" rx="20" fill="#fbfaf7" stroke="#abb399"/><text x="205" y="436" text-anchor="middle" class="st">2 介绍业务驱动</text><text x="205" y="465" text-anchor="middle" class="tx">明确目标和约束</text><rect x="90" y="530" width="230" height="90" rx="20" fill="#fbfaf7" stroke="#abb399"/><text x="205" y="566" text-anchor="middle" class="st">3 介绍体系结构</text><text x="205" y="595" text-anchor="middle" class="tx">建立共同结构视图</text></g>
<g><rect x="450" y="270" width="230" height="90" rx="20" fill="#fbfaf7" stroke="#94afa9"/><text x="565" y="306" text-anchor="middle" class="st">4 识别架构方法</text><text x="565" y="335" text-anchor="middle" class="tx">风格、模式和关键决策</text><rect x="450" y="400" width="230" height="90" rx="20" fill="#fbfaf7" stroke="#94afa9"/><text x="565" y="436" text-anchor="middle" class="st">5 建立效用树</text><text x="565" y="465" text-anchor="middle" class="tx">细化并排序质量场景</text><rect x="450" y="530" width="230" height="90" rx="20" fill="#fbfaf7" stroke="#94afa9"/><text x="565" y="566" text-anchor="middle" class="st">6 分析架构方法</text><text x="565" y="595" text-anchor="middle" class="tx">第一轮风险与权衡</text></g>
<g><rect x="810" y="320" width="230" height="110" rx="20" fill="#fbfaf7" stroke="#b49d8c"/><text x="925" y="358" text-anchor="middle" class="st">7 头脑风暴并排序</text><text x="925" y="389" text-anchor="middle" class="tx">汇集广泛利益相关者</text><rect x="810" y="500" width="230" height="110" rx="20" fill="#fbfaf7" stroke="#b49d8c"/><text x="925" y="538" text-anchor="middle" class="st">8 再次分析架构方法</text><text x="925" y="569" text-anchor="middle" class="tx">高优先级场景检验架构</text></g>
<rect x="1175" y="395" width="230" height="120" rx="20" fill="#fbfaf7" stroke="#aaa0b8"/><text x="1290" y="438" text-anchor="middle" class="st">9 展示评价结果</text><text x="1290" y="470" text-anchor="middle" class="tx">风险、非风险、敏感点</text><text x="1290" y="497" text-anchor="middle" class="tx">权衡点和风险主题</text>
<path d="M355 470H405" class="ln"/><path d="M715 470H765" class="ln"/><path d="M1075 470H1125" class="ln"/><text x="750" y="835" text-anchor="middle" class="sub">准备共同背景 → 形成第一轮技术判断 → 用更多利益相关者场景深化 → 汇总可行动结果</text></svg>
