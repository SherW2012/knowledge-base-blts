<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="t d"><title id="t">质量场景、架构战术与质量结果</title><desc id="d">质量场景驱动战术选择，战术形成架构决策并产生主要收益和副作用。</desc>
<defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 23px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:18px 'Microsoft YaHei',sans-serif;fill:#665e57}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1500" height="760" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">架构战术把质量目标转化为设计动作</text><text x="65" y="110" class="sub">战术不是独立答案；它必须满足具体场景，并接受其他质量属性的副作用检查</text>
<g filter="url(#s)"><rect x="75" y="245" width="260" height="180" rx="27" fill="#eef0e7" stroke="#abb399"/><rect x="410" y="215" width="260" height="240" rx="27" fill="#e6efed" stroke="#94afa9"/><rect x="745" y="215" width="260" height="240" rx="27" fill="#ece5df" stroke="#b49d8c"/><rect x="1080" y="155" width="340" height="150" rx="27" fill="#e8e4ef" stroke="#a99fb8"/><rect x="1080" y="365" width="340" height="150" rx="27" fill="#f1e7e3" stroke="#c1a095"/></g>
<text x="205" y="300" text-anchor="middle" class="th">质量属性场景</text><text x="205" y="345" text-anchor="middle" class="tx">限定环境、响应</text><text x="205" y="380" text-anchor="middle" class="tx">和可判断指标</text>
<text x="540" y="275" text-anchor="middle" class="th">选择架构战术</text><text x="540" y="322" text-anchor="middle" class="tx">缓存、冗余、隔离</text><text x="540" y="357" text-anchor="middle" class="tx">认证、稳定接口</text><text x="540" y="392" text-anchor="middle" class="tx">观察与状态控制</text>
<text x="875" y="275" text-anchor="middle" class="th">形成架构决策</text><text x="875" y="322" text-anchor="middle" class="tx">构件与连接关系</text><text x="875" y="357" text-anchor="middle" class="tx">资源、部署和接口</text><text x="875" y="392" text-anchor="middle" class="tx">参数与运行策略</text>
<text x="1250" y="210" text-anchor="middle" class="th">主要质量收益</text><text x="1250" y="253" text-anchor="middle" class="tx">延迟降低、恢复加快、变化隔离</text>
<text x="1250" y="420" text-anchor="middle" class="th">其他属性的成本与风险</text><text x="1250" y="463" text-anchor="middle" class="tx">一致性、复杂度、成本、安全或易用性</text>
<path d="M335 335H400" class="ln"/><path d="M670 335H735" class="ln"/><path d="M1005 305L1070 245" class="ln"/><path d="M1005 365L1070 435" class="ln"/>
<rect x="300" y="585" width="900" height="100" rx="26" fill="#f4f1eb" stroke="#bab1a6"/><text x="750" y="628" text-anchor="middle" class="th">评价重点</text><text x="750" y="661" text-anchor="middle" class="tx">是否满足原场景？哪些参数敏感？改善一项质量是否损害另一项质量？</text></svg>
