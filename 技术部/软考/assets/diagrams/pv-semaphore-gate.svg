<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="t d"><title id="t">信号量通过P和V控制进程进入共享区域</title><desc id="d">P取得许可，没有许可则等待；V归还许可并唤醒等待进程。</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 23px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:18px 'Microsoft YaHei',sans-serif;fill:#665e57}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1500" height="760" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">信号量把“资格数量”和“等待队列”绑在一起</text><text x="65" y="110" class="sub">P先取得许可才能继续；V归还许可，并让等待者重新具备运行条件</text><g filter="url(#s)"><rect x="80" y="230" width="260" height="220" rx="28" fill="#eef0e7" stroke="#aab397"/><rect x="455" y="205" width="300" height="270" rx="28" fill="#e8efed" stroke="#9bb3ad"/><rect x="875" y="230" width="260" height="220" rx="28" fill="#eee7e2" stroke="#baa495"/><rect x="1230" y="230" width="200" height="220" rx="28" fill="#f0e7e3" stroke="#c1a196"/></g><text x="210" y="285" text-anchor="middle" class="th">进程请求进入</text><text x="210" y="330" text-anchor="middle" class="tx">执行 P(S)</text><text x="210" y="370" text-anchor="middle" class="tx">申请一份许可</text><text x="605" y="260" text-anchor="middle" class="th">信号量 S</text><text x="605" y="312" text-anchor="middle" class="tx">可用许可 &gt; 0</text><text x="605" y="345" text-anchor="middle" class="tx">→ 扣减后继续</text><text x="605" y="395" text-anchor="middle" class="tx">没有许可</text><text x="605" y="428" text-anchor="middle" class="tx">→ 进入等待队列</text><text x="1005" y="285" text-anchor="middle" class="th">共享区域</text><text x="1005" y="330" text-anchor="middle" class="tx">访问临界资源</text><text x="1005" y="370" text-anchor="middle" class="tx">或使用资源实例</text><text x="1330" y="285" text-anchor="middle" class="th">离开</text><text x="1330" y="330" text-anchor="middle" class="tx">执行 V(S)</text><text x="1330" y="370" text-anchor="middle" class="tx">归还许可</text><path d="M340 340H445" class="ln"/><path d="M755 340H865" class="ln"/><path d="M1135 340H1220" class="ln"/><path d="M1330 460C1330 590 600 620 600 485" class="ln"/><text x="750" y="690" text-anchor="middle" class="tx">P/V本身必须是原子操作，否则多个进程仍可能同时修改信号量状态</text></svg>