<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="t d"><title id="t">关系规范化从1NF到BCNF</title><desc id="d">展示第一范式、第二范式、第三范式和BCNF逐步消除的依赖问题</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 24px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:17px 'Microsoft YaHei',sans-serif;fill:#665e57}.em{font:700 17px 'Microsoft YaHei',sans-serif;fill:#8d6558}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1500" height="850" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">范式逐级限制依赖，不是把表拆得越多越好</text><text x="65" y="110" class="sub">每向上一层都先满足前一层，并进一步消除一种结构性冗余来源</text>
<g filter="url(#s)"><rect x="70" y="190" width="290" height="330" rx="28" fill="#eef0e8" stroke="#aeb79b"/><rect x="425" y="190" width="290" height="330" rx="28" fill="#e6efed" stroke="#94afa9"/><rect x="780" y="190" width="290" height="330" rx="28" fill="#eee9e2" stroke="#b9a38f"/><rect x="1135" y="190" width="290" height="330" rx="28" fill="#ebe7f0" stroke="#aaa0bf"/></g><text x="215" y="245" text-anchor="middle" class="th">1NF</text><text x="215" y="290" text-anchor="middle" class="tx">属性值在当前语义中原子化</text><text x="215" y="340" text-anchor="middle" class="em">处理重复组和多值单元格</text><text x="215" y="405" text-anchor="middle" class="tx">为关系运算建立基本结构</text><text x="570" y="245" text-anchor="middle" class="th">2NF</text><text x="570" y="290" text-anchor="middle" class="tx">先满足1NF</text><text x="570" y="340" text-anchor="middle" class="em">消除对组合候选键的部分依赖</text><text x="570" y="405" text-anchor="middle" class="tx">非主属性依赖整个候选键</text><text x="925" y="245" text-anchor="middle" class="th">3NF</text><text x="925" y="290" text-anchor="middle" class="tx">先满足2NF</text><text x="925" y="340" text-anchor="middle" class="em">消除非主属性的传递依赖</text><text x="925" y="405" text-anchor="middle" class="tx">避免事实通过另一个非键属性重复</text><text x="1280" y="245" text-anchor="middle" class="th">BCNF</text><text x="1280" y="290" text-anchor="middle" class="tx">比3NF更严格</text><text x="1280" y="340" text-anchor="middle" class="em">每个决定因素都必须是超键</text><text x="1280" y="405" text-anchor="middle" class="tx">继续处理候选键重叠造成的异常</text><path d="M360 355H415" class="ln"/><path d="M715 355H770" class="ln"/><path d="M1070 355H1125" class="ln"/>
<rect x="200" y="630" width="1100" height="115" rx="24" fill="#f4f1eb" stroke="#c5bcaf"/><text x="750" y="675" text-anchor="middle" class="th">分解合格还要同时问两个问题</text><text x="490" y="715" text-anchor="middle" class="tx">无损连接：能否准确还原原关系</text><text x="1010" y="715" text-anchor="middle" class="tx">依赖保持：能否在局部关系中直接检查原依赖</text><path d="M750 520V620" class="ln"/></svg>
