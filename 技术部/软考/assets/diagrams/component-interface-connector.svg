<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800" role="img" aria-labelledby="t d"><title id="t">构件接口与连接件</title><desc id="d">订单构件通过需要接口连接库存构件提供接口，中间连接件表达同步调用或消息等交互语义。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 23px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:18px 'Microsoft YaHei',sans-serif;fill:#665e57}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1500" height="800" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">构件通过接口暴露契约，通过连接件发生交互</text><text x="65" y="110" class="sub">接口说明“能做什么”，连接件进一步说明“调用、消息或数据怎样传过去”</text><rect x="110" y="260" width="420" height="300" rx="30" fill="#eef0e7" stroke="#aab397"/><rect x="970" y="260" width="420" height="300" rx="30" fill="#e8efed" stroke="#9bb3ad"/><text x="320" y="320" text-anchor="middle" class="th">订单构件</text><text x="320" y="375" text-anchor="middle" class="tx">提供：IOrderService</text><text x="320" y="425" text-anchor="middle" class="tx">需要：IInventoryService</text><text x="1180" y="320" text-anchor="middle" class="th">库存构件</text><text x="1180" y="375" text-anchor="middle" class="tx">提供：IInventoryService</text><text x="1180" y="425" text-anchor="middle" class="tx">隐藏内部表和实现</text><circle cx="555" cy="425" r="22" fill="#f7f5f0" stroke="#8ca8a2" stroke-width="4"/><path d="M577 425H690" class="ln"/><rect x="690" y="360" width="270" height="130" rx="24" fill="#eee7e2" stroke="#baa495"/><text x="825" y="405" text-anchor="middle" class="th">连接件</text><text x="825" y="445" text-anchor="middle" class="tx">RPC / REST / 消息 / 事件</text><path d="M960 425H948" class="ln"/><text x="750" y="650" text-anchor="middle" class="tx">替换库存构件时，只要继续满足 IInventoryService 契约，订单构件无需理解其内部实现</text></svg>