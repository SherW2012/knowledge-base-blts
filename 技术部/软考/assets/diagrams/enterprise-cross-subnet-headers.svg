<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800" role="img" aria-labelledby="t d"><title id="t">跨子网通信逐跳封装</title><desc id="d">展示跨子网通信中IP地址保持不变而以太网MAC地址在每一跳重新封装</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 23px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:18px 'Microsoft YaHei',sans-serif;fill:#665e57}.em{font:700 17px 'Microsoft YaHei',sans-serif;fill:#6d6256}</style></defs><rect width="1500" height="800" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">跨子网逐跳封装 · IP 不变，MAC 每跳重写</text><text x="65" y="110" class="sub">普通路由器不会把最终目标IP改成网关IP；网关只作为当前下一跳存在于二层帧里</text><g filter="url(#s)"><rect x="110" y="205" width="1280" height="210" rx="30" fill="#e7edec" stroke="#9cadaa"/><rect x="110" y="475" width="1280" height="210" rx="30" fill="#eef0e8" stroke="#aeb79b"/></g><text x="165" y="255" class="th">第 1 跳：Host A → 路由器接口 A</text><text x="180" y="312" class="em">IP 层</text><text x="420" y="312" class="tx">源：192.168.10.20</text><text x="760" y="312" class="tx">目标：192.168.20.30</text><text x="180" y="362" class="em">以太网层</text><text x="420" y="362" class="tx">源：MAC_A</text><text x="760" y="362" class="tx">目标：MAC_R10</text><text x="165" y="525" class="th">第 2 跳：路由器接口 B → Host B</text><text x="180" y="582" class="em">IP 层</text><text x="420" y="582" class="tx">源：192.168.10.20</text><text x="760" y="582" class="tx">目标：192.168.20.30</text><text x="180" y="632" class="em">以太网层</text><text x="420" y="632" class="tx">源：MAC_R20</text><text x="760" y="632" class="tx">目标：MAC_B</text><text x="1130" y="312" text-anchor="middle" class="em">IP：端到端</text><text x="1130" y="362" text-anchor="middle" class="em">MAC：当前一跳</text><text x="1130" y="582" text-anchor="middle" class="em">IP：仍然不变</text><text x="1130" y="632" text-anchor="middle" class="em">MAC：重新封装</text></svg>