<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" role="img" aria-labelledby="title desc">
  <title id="title">词嵌入：把词变成一串数字</title><desc id="desc">每个 token 先被映射成一个高维向量，向量的每个元素是一个实数；语义相近的词，向量在空间中也相近</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4f493f" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c7a74"/></marker>
    <style>
      .title{font:700 24px Inter,'Microsoft YaHei',sans-serif;fill:#292724}.subtitle{font:400 13px Inter,'Microsoft YaHei',sans-serif;fill:#7c766d}
      .nt{font:700 18px Inter,'Microsoft YaHei',sans-serif}.ns{font:400 12px Inter,'Microsoft YaHei',sans-serif;fill:#6f6a62}
      .num{font:600 13px 'Cascadia Code',Consolas,monospace;fill:#514c45}.tag{font:600 11px Inter,'Microsoft YaHei',sans-serif;fill:#8b8479}
      .dot{font:600 12px Inter,'Microsoft YaHei',sans-serif;fill:#514c45}
    </style>
  </defs>
  <rect width="860" height="430" rx="24" fill="#fbfaf7"/>
  <text x="48" y="50" class="title">词嵌入：把词变成一串数字（向量）</text><text x="48" y="76" class="subtitle">向量就是一列实数；语义相近的词，向量在空间中也相近</text>

  <rect x="60" y="180" width="86" height="52" rx="12" fill="#e4ebe5" stroke="#5b695f" filter="url(#shadow)"/><text x="103" y="213" class="nt" text-anchor="middle" fill="#4c5a4c">猫</text>
  <path d="M150 206 L 196 206" fill="none" stroke="#7c7a74" stroke-width="1.7" marker-end="url(#arrow)"/>

  <text x="206" y="128" class="tag">嵌入向量（约几千维，此处示意 6 维）</text>
  <rect x="206" y="136" width="132" height="196" rx="10" fill="#f4f2ed" stroke="#cbc7ba"/>
  <text x="272" y="162" class="num" text-anchor="middle">0.21</text><line x1="216" y1="172" x2="328" y2="172" stroke="#e2ded5"/>
  <text x="272" y="190" class="num" text-anchor="middle">-0.53</text><line x1="216" y1="200" x2="328" y2="200" stroke="#e2ded5"/>
  <text x="272" y="218" class="num" text-anchor="middle">0.87</text><line x1="216" y1="228" x2="328" y2="228" stroke="#e2ded5"/>
  <text x="272" y="246" class="num" text-anchor="middle">0.05</text><line x1="216" y1="256" x2="328" y2="256" stroke="#e2ded5"/>
  <text x="272" y="274" class="num" text-anchor="middle">-0.12</text><line x1="216" y1="284" x2="328" y2="284" stroke="#e2ded5"/>
  <text x="272" y="302" class="num" text-anchor="middle">0.44</text>
  <text x="272" y="324" class="num" text-anchor="middle" fill="#9a948a">⋮</text>
  <text x="206" y="352" class="ns">每个格子 = 一个实数（训练学出来的特征分量）</text>

  <text x="470" y="128" class="tag">把词放进高维空间的一个点（降到二维示意）</text>
  <rect x="470" y="136" width="342" height="230" rx="14" fill="#f8f6f1" stroke="#ddd8cb"/>
  <line x1="490" y1="346" x2="792" y2="346" stroke="#d5cfc4"/><line x1="500" y1="150" x2="500" y2="346" stroke="#d5cfc4"/>
  <circle cx="560" cy="200" r="6" fill="#5b695f"/><text x="572" y="196" class="dot">猫</text>
  <circle cx="592" cy="222" r="6" fill="#5b695f"/><text x="604" y="218" class="dot">狗</text>
  <circle cx="566" cy="248" r="6" fill="#5b695f"/><text x="578" y="262" class="dot">老虎</text>
  <text x="560" y="300" class="ns" fill="#5b695f">动物：聚在一起</text>
  <circle cx="712" cy="300" r="6" fill="#536363"/><text x="724" y="296" class="dot">汽车</text>
  <circle cx="740" cy="320" r="6" fill="#536363"/><text x="752" y="334" class="dot">卡车</text>
  <text x="678" y="286" class="ns" fill="#536363">交通工具：另一簇</text>
  <circle cx="700" cy="176" r="6" fill="#6f5c54"/><text x="712" y="172" class="dot">齿轮</text>
  <text x="646" y="196" class="ns" fill="#6f5c54">语义无关 → 距离远</text>
</svg>
