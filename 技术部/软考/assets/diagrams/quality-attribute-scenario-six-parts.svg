<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="t d">
<title id="t">质量属性场景六要素</title><desc id="d">刺激源在特定环境中对制品施加刺激，系统产生响应并以响应度量判断。</desc>
<defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 22px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:17px 'Microsoft YaHei',sans-serif;fill:#665e57}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}</style></defs>
<rect width="1500" height="760" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">质量属性场景把抽象目标变成可判断要求</text><text x="65" y="110" class="sub">六个要素共同回答谁在什么条件下影响系统，系统怎样响应，以及用什么标准判断</text>
<g filter="url(#s)"><rect x="70" y="230" width="190" height="150" rx="24" fill="#eef0e7" stroke="#aab397"/><rect x="310" y="230" width="190" height="150" rx="24" fill="#e8efed" stroke="#9bb3ad"/><rect x="550" y="180" width="190" height="250" rx="24" fill="#eee7e2" stroke="#baa495"/><rect x="790" y="180" width="190" height="250" rx="24" fill="#e9e5ef" stroke="#aaa1b8"/><rect x="1030" y="230" width="190" height="150" rx="24" fill="#f0e7e3" stroke="#c1a196"/><rect x="1270" y="230" width="190" height="150" rx="24" fill="#eeeade" stroke="#b7aa83"/></g>
<text x="165" y="275" text-anchor="middle" class="th">刺激源</text><text x="165" y="315" text-anchor="middle" class="tx">谁或什么</text><text x="165" y="344" text-anchor="middle" class="tx">产生事件</text>
<text x="405" y="275" text-anchor="middle" class="th">刺激</text><text x="405" y="315" text-anchor="middle" class="tx">发生了什么</text><text x="405" y="344" text-anchor="middle" class="tx">请求、故障、变化</text>
<text x="645" y="235" text-anchor="middle" class="th">环境</text><text x="645" y="280" text-anchor="middle" class="tx">系统当时的状态</text><text x="645" y="316" text-anchor="middle" class="tx">正常、过载</text><text x="645" y="352" text-anchor="middle" class="tx">维护或故障期间</text>
<text x="885" y="235" text-anchor="middle" class="th">制品</text><text x="885" y="280" text-anchor="middle" class="tx">受到影响的对象</text><text x="885" y="316" text-anchor="middle" class="tx">系统、服务</text><text x="885" y="352" text-anchor="middle" class="tx">构件或数据</text>
<text x="1125" y="275" text-anchor="middle" class="th">响应</text><text x="1125" y="315" text-anchor="middle" class="tx">系统采取</text><text x="1125" y="344" text-anchor="middle" class="tx">什么行动</text>
<text x="1365" y="275" text-anchor="middle" class="th">响应度量</text><text x="1365" y="315" text-anchor="middle" class="tx">怎样判断</text><text x="1365" y="344" text-anchor="middle" class="tx">是否达到要求</text>
<path d="M260 305H300" class="ln"/><path d="M500 305H540" class="ln"/><path d="M740 305H780" class="ln"/><path d="M980 305H1020" class="ln"/><path d="M1220 305H1260" class="ln"/>
<rect x="170" y="535" width="1160" height="125" rx="28" fill="#f4f1eb" stroke="#bab1a6"/><text x="750" y="583" text-anchor="middle" class="th">示例</text><text x="750" y="623" text-anchor="middle" class="tx">外部用户｜发起查询｜业务高峰期｜查询服务｜返回结果｜95%的请求不超过2秒</text>
</svg>
