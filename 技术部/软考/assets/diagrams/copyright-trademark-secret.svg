<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="t d"><title id="t">著作权商标商业秘密对比</title><desc id="d">从权利产生、公开与保密、期限三个维度比较著作权、商标和商业秘密。</desc><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 22px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:17px 'Microsoft YaHei',sans-serif;fill:#665e57}</style><rect width="1500" height="820" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">三种保护制度的关键差异在“怎样产生、要不要保密、能持续多久”</text><text x="65" y="110" class="sub">把三个维度同时看，很多容易混淆的边界会自然分开</text><rect x="75" y="190" width="420" height="510" rx="30" fill="#eef0e7" stroke="#aab397"/><rect x="540" y="190" width="420" height="510" rx="30" fill="#e8efed" stroke="#9bb3ad"/><rect x="1005" y="190" width="420" height="510" rx="30" fill="#eee7e2" stroke="#baa495"/><text x="285" y="245" text-anchor="middle" class="th">著作权</text><text x="285" y="310" text-anchor="middle" class="tx">作品完成通常自动产生</text><text x="285" y="380" text-anchor="middle" class="tx">可以公开，也可以不公开</text><text x="285" y="450" text-anchor="middle" class="tx">不要求持续保密</text><text x="285" y="520" text-anchor="middle" class="tx">财产权具有法定保护期限</text><text x="750" y="245" text-anchor="middle" class="th">商标</text><text x="750" y="310" text-anchor="middle" class="tx">专用权典型通过注册取得</text><text x="750" y="380" text-anchor="middle" class="tx">用于公开识别商品/服务来源</text><text x="750" y="450" text-anchor="middle" class="tx">不依靠秘密状态</text><text x="750" y="520" text-anchor="middle" class="tx">10年一期，可依法续展</text><text x="1215" y="245" text-anchor="middle" class="th">商业秘密</text><text x="1215" y="310" text-anchor="middle" class="tx">满足秘密性、价值、保密措施</text><text x="1215" y="380" text-anchor="middle" class="tx">核心前提就是不为公众所知</text><text x="1215" y="450" text-anchor="middle" class="tx">必须采取相应保密措施</text><text x="1215" y="520" text-anchor="middle" class="tx">无固定年限，秘密状态决定持续时间</text><text x="750" y="760" text-anchor="middle" class="tx">公开不是统一答案：商标需要公开识别，著作权不依赖保密，商业秘密则以持续保密为基础</text></svg>