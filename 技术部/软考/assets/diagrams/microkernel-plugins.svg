<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800" role="img" aria-labelledby="t d"><title id="t">微内核架构模式</title><desc id="d">稳定核心通过插件接口连接多个可插拔扩展能力</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 24px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:18px 'Microsoft YaHei',sans-serif;fill:#665e57}.lab{font:700 16px 'Microsoft YaHei',sans-serif;fill:#827b72}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1500" height="800" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">Microkernel · 把“稳定核心”和“变化能力”分开</text><text x="65" y="110" class="sub">核心只保留长期稳定机制，语言支持、主题、调试器等变化能力通过统一插件接口扩展</text><g filter="url(#s)"><rect x="520" y="245" width="460" height="260" rx="36" fill="#e7edec" stroke="#9cadaa"/><rect x="90" y="195" width="300" height="150" rx="28" fill="#ebe8ef" stroke="#a89fb0"/><rect x="90" y="505" width="300" height="150" rx="28" fill="#eef0e8" stroke="#aeb79b"/><rect x="1110" y="195" width="300" height="150" rx="28" fill="#eee9e2" stroke="#b9a38f"/><rect x="1110" y="505" width="300" height="150" rx="28" fill="#eee6e3" stroke="#b39b95"/></g><text x="750" y="315" text-anchor="middle" class="th">稳定 Core</text><text x="750" y="365" text-anchor="middle" class="tx">插件生命周期 · 命令系统 · 文件基础能力</text><text x="750" y="405" text-anchor="middle" class="tx">统一扩展点与公共服务</text><text x="750" y="457" text-anchor="middle" class="lab">长期稳定，不因每个扩展功能频繁修改</text><text x="240" y="250" text-anchor="middle" class="th">Plugin A</text><text x="240" y="295" text-anchor="middle" class="tx">C++ / 语言支持</text><text x="240" y="560" text-anchor="middle" class="th">Plugin B</text><text x="240" y="605" text-anchor="middle" class="tx">Git / 版本控制</text><text x="1260" y="250" text-anchor="middle" class="th">Plugin C</text><text x="1260" y="295" text-anchor="middle" class="tx">Debugger / 调试器</text><text x="1260" y="560" text-anchor="middle" class="th">Plugin D</text><text x="1260" y="605" text-anchor="middle" class="tx">Theme / 主题</text><path d="M390 270C455 270 480 300 510 335" class="ln"/><path d="M390 580C455 580 480 520 520 470" class="ln"/><path d="M1110 270C1045 270 1020 300 990 335" class="ln"/><path d="M1110 580C1045 580 1020 520 980 470" class="ln"/><rect x="265" y="710" width="970" height="54" rx="17" fill="#f4f1eb" stroke="#c5bcaf"/><text x="750" y="744" text-anchor="middle" class="tx">识别关键词：稳定最小核心 · Plugin · 扩展点 · 按需安装 / 升级；不要和微服务混为一谈</text></svg>