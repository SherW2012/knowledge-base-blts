<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="t d"><title id="t">ATAM三类场景与架构分析</title><desc id="d">用例、增长和探索性场景经过排序后映射到架构，识别风险、敏感点和权衡点。</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 23px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:17px 'Microsoft YaHei',sans-serif;fill:#665e57}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1500" height="820" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">三类场景从不同方向检验同一架构</text><text x="65" y="110" class="sub">分类依据是场景描述的活动性质，不是功能当前处于需求、开发还是上线阶段</text>
<g filter="url(#s)"><rect x="60" y="175" width="350" height="170" rx="27" fill="#e8efed" stroke="#94afa9"/><rect x="60" y="385" width="350" height="170" rx="27" fill="#eee9df" stroke="#b4aa88"/><rect x="60" y="595" width="350" height="170" rx="27" fill="#f1e7e3" stroke="#c1a095"/><rect x="535" y="300" width="310" height="220" rx="28" fill="#f3f0e9" stroke="#b8afa3"/><rect x="970" y="260" width="420" height="300" rx="28" fill="#e9e5ef" stroke="#aaa0b8"/></g>
<text x="235" y="222" text-anchor="middle" class="th">用例场景</text><text x="235" y="260" text-anchor="middle" class="tx">确定的运行使用</text><text x="235" y="294" text-anchor="middle" class="tx">功能完成时应达到什么质量</text><text x="235" y="322" text-anchor="middle" class="tx">不代表当前已经开发完成</text>
<text x="235" y="432" text-anchor="middle" class="th">增长场景</text><text x="235" y="470" text-anchor="middle" class="tx">合理预期的近期改变</text><text x="235" y="504" text-anchor="middle" class="tx">增加功能、规模或平台变化</text>
<text x="235" y="642" text-anchor="middle" class="th">探索性场景</text><text x="235" y="680" text-anchor="middle" class="tx">超出近期规划的极端改变</text><text x="235" y="714" text-anchor="middle" class="tx">试探边界和隐含假设</text>
<text x="690" y="355" text-anchor="middle" class="th">场景排序</text><text x="690" y="400" text-anchor="middle" class="tx">利益相关者投票</text><text x="690" y="434" text-anchor="middle" class="tx">重要性与风险</text><text x="690" y="478" text-anchor="middle" class="tx">选择高优先级场景</text>
<text x="1180" y="315" text-anchor="middle" class="th">映射到体系结构</text><text x="1180" y="360" text-anchor="middle" class="tx">追踪执行路径或修改范围</text><text x="1180" y="405" text-anchor="middle" class="tx">检查相关架构方法与决策</text><text x="1180" y="465" text-anchor="middle" class="th">形成评价结果</text><text x="1180" y="505" text-anchor="middle" class="tx">风险、非风险、敏感点、权衡点</text>
<path d="M410 260L525 355" class="ln"/><path d="M410 470H525" class="ln"/><path d="M410 680L525 485" class="ln"/><path d="M845 410H960" class="ln"/></svg>
