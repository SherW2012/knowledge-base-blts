<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">软件测试的三个分类维度</title>
  <desc id="desc">分别按照测试设计依据、测试目标和测试层级对软件测试进行分类，并强调三个维度可以组合</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#4f493f" flood-opacity=".10"/></filter>
    <style>
      .title{font:700 25px Inter,'Microsoft YaHei',sans-serif;fill:#292724}.subtitle{font:400 13px Inter,'Microsoft YaHei',sans-serif;fill:#7c766d}
      .axis{font:700 13px Inter,'Microsoft YaHei',sans-serif;fill:#716b63;letter-spacing:.06em}.card-title{font:700 16px Inter,'Microsoft YaHei',sans-serif}.card-sub{font:400 12px Inter,'Microsoft YaHei',sans-serif;fill:#6f6a62}
      .note-title{font:700 14px Inter,'Microsoft YaHei',sans-serif;fill:#5f625d}.note{font:400 12px Inter,'Microsoft YaHei',sans-serif;fill:#6f6a62}
    </style>
  </defs>
  <rect width="960" height="640" rx="24" fill="#fbfaf7"/>
  <text x="48" y="50" class="title">软件测试的三个分类维度</text>
  <text x="48" y="76" class="subtitle">同一次测试可以同时拥有一种设计依据、一个测试目标和一个测试层级</text>

  <rect x="48" y="108" width="864" height="150" rx="20" fill="#f3f0e9" stroke="#c8c0b4" filter="url(#shadow)"/>
  <text x="76" y="139" class="axis">设计依据 · 测试用例根据什么设计</text>
  <rect x="76" y="158" width="246" height="72" rx="14" fill="#e7ebeb" stroke="#9aa7a6"/>
  <text x="199" y="187" class="card-title" text-anchor="middle" fill="#536363">白盒测试</text>
  <text x="199" y="211" class="card-sub" text-anchor="middle">控制流 · 数据流 · 程序变异</text>
  <rect x="357" y="158" width="246" height="72" rx="14" fill="#eee6e3" stroke="#b39b95"/>
  <text x="480" y="187" class="card-title" text-anchor="middle" fill="#6f5c54">黑盒测试</text>
  <text x="480" y="211" class="card-sub" text-anchor="middle">功能 · 等价类 · 边界值</text>
  <rect x="638" y="158" width="246" height="72" rx="14" fill="#ece8ee" stroke="#a097a5"/>
  <text x="761" y="187" class="card-title" text-anchor="middle" fill="#685f6d">灰盒测试</text>
  <text x="761" y="211" class="card-sub" text-anchor="middle">掌握部分内部信息</text>

  <rect x="48" y="282" width="864" height="124" rx="20" fill="#f5f2eb" stroke="#cec6ba"/>
  <text x="76" y="313" class="axis">测试目标 · 需要验证什么</text>
  <rect x="76" y="332" width="190" height="48" rx="12" fill="#e7ece6" stroke="#95a192"/><text x="171" y="362" class="card-title" text-anchor="middle" fill="#596657">功能测试</text>
  <rect x="282" y="332" width="190" height="48" rx="12" fill="#eee8df" stroke="#b7a990"/><text x="377" y="362" class="card-title" text-anchor="middle" fill="#6e624f">性能测试</text>
  <rect x="488" y="332" width="190" height="48" rx="12" fill="#e8e8ed" stroke="#9fa0aa"/><text x="583" y="362" class="card-title" text-anchor="middle" fill="#5f606a">安全测试</text>
  <rect x="694" y="332" width="190" height="48" rx="12" fill="#ece7e2" stroke="#ada197"/><text x="789" y="362" class="card-title" text-anchor="middle" fill="#695f58">可靠性测试</text>

  <rect x="48" y="430" width="864" height="124" rx="20" fill="#f5f2eb" stroke="#cec6ba"/>
  <text x="76" y="461" class="axis">测试层级 · 测试对象组合到什么程度</text>
  <rect x="76" y="480" width="190" height="48" rx="12" fill="#e7ebeb" stroke="#9aa7a6"/><text x="171" y="510" class="card-title" text-anchor="middle" fill="#536363">单元测试</text>
  <rect x="282" y="480" width="190" height="48" rx="12" fill="#e7ece6" stroke="#95a192"/><text x="377" y="510" class="card-title" text-anchor="middle" fill="#596657">集成测试</text>
  <rect x="488" y="480" width="190" height="48" rx="12" fill="#eee6e3" stroke="#b39b95"/><text x="583" y="510" class="card-title" text-anchor="middle" fill="#6f5c54">系统测试</text>
  <rect x="694" y="480" width="190" height="48" rx="12" fill="#ece8ee" stroke="#a097a5"/><text x="789" y="510" class="card-title" text-anchor="middle" fill="#685f6d">验收测试</text>

  <rect x="188" y="577" width="584" height="38" rx="12" fill="#ebe9e2" stroke="#c3bdb2"/>
  <text x="480" y="593" class="note-title" text-anchor="middle">三个维度可以组合，不能互相替代</text>
  <text x="480" y="609" class="note" text-anchor="middle">例如：一个单元测试可以采用白盒方法验证功能</text>
</svg>
