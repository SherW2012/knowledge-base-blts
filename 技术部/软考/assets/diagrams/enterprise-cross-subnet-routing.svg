<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800" role="img" aria-labelledby="t d"><title id="t">企业内部跨子网通信</title><desc id="d">主机A通过同一台三层设备的两个接口访问另一个私有子网中的主机B</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 23px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:18px 'Microsoft YaHei',sans-serif;fill:#665e57}.em{font:700 17px 'Microsoft YaHei',sans-serif;fill:#6d6256}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1500" height="800" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">企业内部跨子网 · 同一台路由器连接两个私有子网</text><text x="65" y="110" class="sub">两个“网关IP”可以只是同一台三层设备上的两个接口</text><g filter="url(#s)"><rect x="70" y="235" width="320" height="260" rx="28" fill="#e7edec" stroke="#9cadaa"/><rect x="560" y="185" width="380" height="365" rx="30" fill="#eee9e2" stroke="#b9a38f"/><rect x="1110" y="235" width="320" height="260" rx="28" fill="#eef0e8" stroke="#aeb79b"/></g><text x="230" y="295" text-anchor="middle" class="th">Host A</text><text x="230" y="342" text-anchor="middle" class="tx">IP：192.168.10.20/24</text><text x="230" y="382" text-anchor="middle" class="tx">MAC：MAC_A</text><text x="230" y="438" text-anchor="middle" class="em">网关：192.168.10.1</text><text x="750" y="245" text-anchor="middle" class="th">企业三层设备 / 路由器</text><rect x="610" y="305" width="280" height="90" rx="22" fill="#fbfaf7" stroke="#b9a38f"/><rect x="610" y="425" width="280" height="90" rx="22" fill="#fbfaf7" stroke="#b9a38f"/><text x="750" y="340" text-anchor="middle" class="em">接口 A：192.168.10.1</text><text x="750" y="372" text-anchor="middle" class="tx">MAC_R10</text><text x="750" y="460" text-anchor="middle" class="em">接口 B：192.168.20.1</text><text x="750" y="492" text-anchor="middle" class="tx">MAC_R20</text><text x="1270" y="295" text-anchor="middle" class="th">Host B</text><text x="1270" y="342" text-anchor="middle" class="tx">IP：192.168.20.30/24</text><text x="1270" y="382" text-anchor="middle" class="tx">MAC：MAC_B</text><text x="1270" y="438" text-anchor="middle" class="em">网关：192.168.20.1</text><path d="M390 365H550" class="ln"/><path d="M950 365H1100" class="ln"/><text x="470" y="335" text-anchor="middle" class="em">帧 1</text><text x="1025" y="335" text-anchor="middle" class="em">帧 2</text><g filter="url(#s)"><rect x="250" y="615" width="1000" height="105" rx="26" fill="#ebe8ef" stroke="#a89fb0"/></g><text x="750" y="655" text-anchor="middle" class="th">关键点</text><text x="750" y="694" text-anchor="middle" class="tx">MAC_R10 与 MAC_R20 属于同一台设备的两个接口，路由器内部转发不构成一条新的以太网链路</text></svg>