<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <rect width="1200" height="650" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" font-size="30" font-family="sans-serif" fill="#0f172a">调度 / 置换算法先按“对象”分组</text>
  <rect x="450" y="90" width="300" height="70" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
  <text x="600" y="134" text-anchor="middle" font-size="24" font-family="sans-serif" fill="#075985">系统要做选择</text>
  <line x1="530" y1="160" x2="280" y2="250" stroke="#64748b" stroke-width="4"/>
  <line x1="600" y1="160" x2="600" y2="250" stroke="#64748b" stroke-width="4"/>
  <line x1="670" y1="160" x2="920" y2="250" stroke="#64748b" stroke-width="4"/>
  <rect x="90" y="250" width="380" height="300" rx="24" fill="#eef2ff" stroke="#6366f1" stroke-width="3"/>
  <text x="280" y="300" text-anchor="middle" font-size="25" font-family="sans-serif" fill="#4338ca">普通CPU调度</text>
  <text x="280" y="340" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#475569">对象：就绪进程 / 线程</text>
  <text x="280" y="385" text-anchor="middle" font-size="21" font-family="sans-serif">FCFS：先到先跑</text>
  <text x="280" y="425" text-anchor="middle" font-size="21" font-family="sans-serif">SJF：短作业先跑</text>
  <text x="280" y="465" text-anchor="middle" font-size="21" font-family="sans-serif">SRTF：剩余时间短先跑</text>
  <text x="280" y="505" text-anchor="middle" font-size="21" font-family="sans-serif">RR：按时间片轮转</text>
  <rect x="410" y="250" width="380" height="300" rx="24" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
  <text x="600" y="300" text-anchor="middle" font-size="25" font-family="sans-serif" fill="#15803d">实时CPU调度</text>
  <text x="600" y="340" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#475569">对象：带Deadline的实时任务</text>
  <text x="600" y="385" text-anchor="middle" font-size="21" font-family="sans-serif">RM：看周期 / Rate</text>
  <text x="600" y="425" text-anchor="middle" font-size="21" font-family="sans-serif">DM：看相对截止期</text>
  <text x="600" y="465" text-anchor="middle" font-size="21" font-family="sans-serif">EDF：看绝对截止时刻</text>
  <text x="600" y="505" text-anchor="middle" font-size="21" font-family="sans-serif">LLF：看松弛度</text>
  <rect x="730" y="250" width="380" height="300" rx="24" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/>
  <text x="920" y="300" text-anchor="middle" font-size="25" font-family="sans-serif" fill="#b45309">页面置换</text>
  <text x="920" y="340" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#475569">对象：RAM中的页面</text>
  <text x="920" y="395" text-anchor="middle" font-size="21" font-family="sans-serif">FIFO：最早装入先淘汰</text>
  <text x="920" y="440" text-anchor="middle" font-size="21" font-family="sans-serif">LRU：最久未访问先淘汰</text>
  <text x="920" y="485" text-anchor="middle" font-size="21" font-family="sans-serif">OPT：未来最晚使用先淘汰</text>
  <text x="600" y="610" text-anchor="middle" font-size="21" font-family="sans-serif" fill="#334155">先问“是在选CPU使用者，还是在选牺牲页面”，算法就不会混在一起</text>
</svg>
