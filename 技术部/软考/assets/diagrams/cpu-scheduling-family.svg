<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="t d"><title id="t">CPU调度与页面置换算法分组</title><desc id="d">普通处理机调度、实时调度和页面置换按不同对象分成三组</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 23px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:18px 'Microsoft YaHei',sans-serif;fill:#665e57}.em{font:700 18px 'Microsoft YaHei',sans-serif;fill:#6d6256}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1500" height="820" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">调度算法别混着背 · 先看“系统在选谁”</text><text x="65" y="110" class="sub">CPU调度是在选下一位执行者，页面置换是在选牺牲页；对象不同，算法族自然不同</text><g filter="url(#s)"><rect x="585" y="155" width="330" height="95" rx="24" fill="#f3efe8" stroke="#cabfaf"/><rect x="70" y="345" width="410" height="335" rx="28" fill="#e7edec" stroke="#9cadaa"/><rect x="545" y="345" width="410" height="335" rx="28" fill="#eef0e8" stroke="#aeb79b"/><rect x="1020" y="345" width="410" height="335" rx="28" fill="#eee9e2" stroke="#b9a38f"/></g><text x="750" y="198" text-anchor="middle" class="th">系统需要做一次“选择”</text><text x="750" y="228" text-anchor="middle" class="tx">先确认对象，再匹配算法</text><path d="M670 250C570 300 430 300 280 335" class="ln"/><path d="M750 250V335" class="ln"/><path d="M830 250C930 300 1070 300 1220 335" class="ln"/><text x="275" y="400" text-anchor="middle" class="th">普通 CPU 调度</text><text x="275" y="438" text-anchor="middle" class="tx">对象：就绪进程 / 线程</text><text x="120" y="490" class="tx">FCFS：先到先运行</text><text x="120" y="535" class="tx">SJF：短作业优先</text><text x="120" y="580" class="tx">SRTF：剩余时间短优先</text><text x="120" y="625" class="tx">RR：时间片轮转</text><text x="750" y="400" text-anchor="middle" class="th">实时 CPU 调度</text><text x="750" y="438" text-anchor="middle" class="tx">对象：带 Deadline 的任务</text><text x="595" y="490" class="tx">RM：看周期 / Rate</text><text x="595" y="535" class="tx">DM：看相对截止期</text><text x="595" y="580" class="tx">EDF：看绝对截止时刻</text><text x="595" y="625" class="tx">LLF：看剩余松弛度</text><text x="1225" y="400" text-anchor="middle" class="th">页面置换</text><text x="1225" y="438" text-anchor="middle" class="tx">对象：RAM 中的驻留页面</text><text x="1070" y="505" class="tx">FIFO：最早装入先淘汰</text><text x="1070" y="555" class="tx">LRU：最久未访问先淘汰</text><text x="1070" y="605" class="tx">OPT：未来最晚再用先淘汰</text><rect x="300" y="730" width="900" height="54" rx="17" fill="#f4f1eb" stroke="#c5bcaf"/><text x="750" y="764" text-anchor="middle" class="em">先问：选CPU使用者，还是选牺牲页面？——算法就不会串组</text></svg>