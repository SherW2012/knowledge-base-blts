<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="t d"><title id="t">UML图家族</title><desc id="d">UML主要分为结构图和行为图，列出类图、构件图、部署图、用例图、顺序图、状态图和活动图。</desc><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 23px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:17px 'Microsoft YaHei',sans-serif;fill:#665e57}</style><rect width="1500" height="850" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">不同UML图是在回答不同问题</text><text x="65" y="110" class="sub">结构图描述系统“有什么”，行为图描述系统“怎样发生变化和协作”</text><rect x="90" y="190" width="620" height="530" rx="30" fill="#eef0e7" stroke="#aab397"/><rect x="790" y="190" width="620" height="530" rx="30" fill="#e8efed" stroke="#9bb3ad"/><text x="400" y="250" text-anchor="middle" class="th">结构图 Structural</text><text x="1100" y="250" text-anchor="middle" class="th">行为图 Behavioral</text><g fill="#f8f6f1" stroke="#b7b0a7"><rect x="160" y="310" width="220" height="110" rx="20"/><rect x="420" y="310" width="220" height="110" rx="20"/><rect x="290" y="490" width="220" height="110" rx="20"/><rect x="850" y="300" width="220" height="110" rx="20"/><rect x="1130" y="300" width="220" height="110" rx="20"/><rect x="850" y="490" width="220" height="110" rx="20"/><rect x="1130" y="490" width="220" height="110" rx="20"/></g><text x="270" y="355" text-anchor="middle" class="th">类图</text><text x="270" y="390" text-anchor="middle" class="tx">类型与静态关系</text><text x="530" y="355" text-anchor="middle" class="th">构件图</text><text x="530" y="390" text-anchor="middle" class="tx">软件实现组织</text><text x="400" y="535" text-anchor="middle" class="th">部署图</text><text x="400" y="570" text-anchor="middle" class="tx">运行节点与制品</text><text x="960" y="345" text-anchor="middle" class="th">用例图</text><text x="960" y="380" text-anchor="middle" class="tx">外部目标</text><text x="1240" y="345" text-anchor="middle" class="th">顺序图</text><text x="1240" y="380" text-anchor="middle" class="tx">交互时间顺序</text><text x="960" y="535" text-anchor="middle" class="th">状态图</text><text x="960" y="570" text-anchor="middle" class="tx">对象生命周期</text><text x="1240" y="535" text-anchor="middle" class="th">活动图</text><text x="1240" y="570" text-anchor="middle" class="tx">业务控制流程</text></svg>