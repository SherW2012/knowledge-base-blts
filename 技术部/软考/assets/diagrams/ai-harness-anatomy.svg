<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" role="img" aria-labelledby="title desc">
  <title id="title">Harness 的构成</title><desc id="desc">模型只负责每步决策，外围的循环、工具、上下文、记忆、权限、恢复与可观测共同把它组织成可靠系统</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4f493f" flood-opacity=".10"/></filter>
    <style>
      .title{font:700 24px Inter,'Microsoft YaHei',sans-serif;fill:#292724}.subtitle{font:400 13px Inter,'Microsoft YaHei',sans-serif;fill:#7c766d}
      .nt{font:700 14px Inter,'Microsoft YaHei',sans-serif}.ns{font:400 11.5px Inter,'Microsoft YaHei',sans-serif;fill:#6f6a62}
      .core{font:700 17px Inter,'Microsoft YaHei',sans-serif;fill:#6f5c54}.coresub{font:400 12px Inter,'Microsoft YaHei',sans-serif;fill:#8a7168}
      .frame{font:700 12px Inter,'Microsoft YaHei',sans-serif;fill:#8b8479;letter-spacing:.08em}
    </style>
  </defs>
  <rect width="820" height="520" rx="24" fill="#fbfaf7"/>
  <text x="48" y="50" class="title">Harness 的构成</text><text x="48" y="76" class="subtitle">模型提供智能，外围支架把它组织成能在真实环境中稳定行动的系统</text>

  <rect x="70" y="100" width="680" height="392" rx="20" fill="none" stroke="#d5cfc4" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="90" y="126" class="frame">HARNESS</text>

  <rect x="310" y="248" width="200" height="96" rx="18" fill="#eee6e3" stroke="#b39b95" filter="url(#shadow)"/><text x="410" y="290" class="core" text-anchor="middle">模型</text><text x="410" y="312" class="coresub" text-anchor="middle">只负责每步决策</text>

  <rect x="96" y="150" width="196" height="60" rx="13" fill="#e4ebe5" stroke="#5b695f" filter="url(#shadow)"/><text x="116" y="176" class="nt" fill="#4c5a4c">Agent Loop</text><text x="116" y="195" class="ns">循环与停止条件</text>
  <rect x="312" y="150" width="196" height="60" rx="13" fill="#e7ebeb" stroke="#536363" filter="url(#shadow)"/><text x="332" y="176" class="nt" fill="#4a5757">工具执行层</text><text x="332" y="195" class="ns">执行调用并回填结果</text>
  <rect x="528" y="150" width="196" height="60" rx="13" fill="#ece8ee" stroke="#685f6d" filter="url(#shadow)"/><text x="548" y="176" class="nt" fill="#5b5265">上下文管理</text><text x="548" y="195" class="ns">裁剪 · 压缩 · 稳定前缀</text>

  <rect x="96" y="382" width="196" height="60" rx="13" fill="#eee9df" stroke="#6d6250" filter="url(#shadow)"/><text x="116" y="408" class="nt" fill="#6d6250">记忆与检索</text><text x="116" y="427" class="ns">持久存储与按需召回</text>
  <rect x="312" y="382" width="196" height="60" rx="13" fill="#e7ebe3" stroke="#626b56" filter="url(#shadow)"/><text x="332" y="408" class="nt" fill="#545c4a">失败恢复</text><text x="332" y="427" class="ns">重试 · 循环检测 · 超时</text>
  <rect x="528" y="382" width="196" height="60" rx="13" fill="#ece9e3" stroke="#625e58" filter="url(#shadow)"/><text x="548" y="408" class="nt" fill="#625e58">可观测</text><text x="548" y="427" class="ns">轨迹 · 日志</text>

  <rect x="96" y="266" width="196" height="60" rx="13" fill="#eee6e8" stroke="#8a6f76" filter="url(#shadow)"/><text x="116" y="292" class="nt" fill="#705b61">权限与安全</text><text x="116" y="311" class="ns">危险操作 · 不可信输入</text>
  <rect x="528" y="266" width="196" height="60" rx="13" fill="#e7ebe3" stroke="#9da58b" filter="url(#shadow)"/><text x="548" y="292" class="nt" fill="#59604e">工具 / 技能供给</text><text x="548" y="311" class="ns">模型的行动能力来源</text>
</svg>
