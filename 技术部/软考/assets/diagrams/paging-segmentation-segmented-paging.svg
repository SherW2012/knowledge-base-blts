<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">分页、分段与段页式的地址转换关系</title>
  <desc id="desc">并列展示纯分页查页表、纯分段查段表以及段页式先查段表再查页表的地址转换过程。</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#40372f" flood-opacity=".10"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#91887d"/></marker><style>.title{font:700 39px "Microsoft YaHei","PingFang SC",sans-serif;fill:#22201d}.sub{font:20px "Microsoft YaHei","PingFang SC",sans-serif;fill:#786f66}.h{font:700 24px "Microsoft YaHei","PingFang SC",sans-serif;fill:#5d554d}.t{font:18px "Microsoft YaHei","PingFang SC",sans-serif;fill:#6d645c}.tag{font:700 18px "Microsoft YaHei","PingFang SC",sans-serif;fill:#675e55}.line{fill:none;stroke:#91887d;stroke-width:3;marker-end:url(#arrow)}</style></defs>
  <rect width="1500" height="900" rx="38" fill="#fbfaf7"/><text x="65" y="76" class="title">三种方案使用不同的地址结构和转换表</text><text x="65" y="114" class="sub">段表不是分页系统无条件增加的一张表；只有段页式才同时使用段表和页表</text>
  <g filter="url(#shadow)"><rect x="55" y="165" width="430" height="650" rx="30" fill="#e7edec" stroke="#9cadaa"/><rect x="535" y="165" width="430" height="650" rx="30" fill="#f0e8e4" stroke="#b89e94"/><rect x="1015" y="165" width="430" height="650" rx="30" fill="#ebe8ef" stroke="#a89fb0"/></g>
  <text x="270" y="215" text-anchor="middle" class="h">纯分页</text><text x="750" y="215" text-anchor="middle" class="h">纯分段</text><text x="1230" y="215" text-anchor="middle" class="h">段页式</text>
  <rect x="105" y="270" width="330" height="90" rx="22" fill="#f7f5f0" stroke="#9cadaa"/><text x="270" y="307" text-anchor="middle" class="tag">虚拟页号 ＋ 页内偏移</text><text x="270" y="338" text-anchor="middle" class="t">固定大小页面</text><path d="M270 360V430" class="line"/><rect x="135" y="430" width="270" height="100" rx="22" fill="#dce6e4" stroke="#9cadaa"/><text x="270" y="472" text-anchor="middle" class="h">页表</text><text x="270" y="505" text-anchor="middle" class="t">虚拟页 → 物理页框</text><path d="M270 530V605" class="line"/><rect x="105" y="605" width="330" height="90" rx="22" fill="#f7f5f0" stroke="#9cadaa"/><text x="270" y="643" text-anchor="middle" class="tag">页框号 ＋ 原页内偏移</text><text x="270" y="674" text-anchor="middle" class="t">形成物理地址</text><text x="270" y="765" text-anchor="middle" class="tag">面向内存分配与虚拟内存</text>
  <rect x="585" y="270" width="330" height="90" rx="22" fill="#f7f5f0" stroke="#b89e94"/><text x="750" y="307" text-anchor="middle" class="tag">段号 ＋ 段内偏移</text><text x="750" y="338" text-anchor="middle" class="t">逻辑段长度不等</text><path d="M750 360V430" class="line"/><rect x="615" y="430" width="270" height="100" rx="22" fill="#eadeda" stroke="#b89e94"/><text x="750" y="472" text-anchor="middle" class="h">段表</text><text x="750" y="505" text-anchor="middle" class="t">段基址 · 段长 · 权限</text><path d="M750 530V605" class="line"/><rect x="585" y="605" width="330" height="90" rx="22" fill="#f7f5f0" stroke="#b89e94"/><text x="750" y="643" text-anchor="middle" class="tag">段基址 ＋ 段内偏移</text><text x="750" y="674" text-anchor="middle" class="t">越界检查后形成物理地址</text><text x="750" y="765" text-anchor="middle" class="tag">面向逻辑结构、保护与共享</text>
  <rect x="1065" y="245" width="330" height="90" rx="22" fill="#f7f5f0" stroke="#a89fb0"/><text x="1230" y="282" text-anchor="middle" class="tag">段号＋段内页号＋偏移</text><text x="1230" y="313" text-anchor="middle" class="t">先分段，再在段内分页</text><path d="M1230 335V390" class="line"/><rect x="1095" y="390" width="270" height="90" rx="22" fill="#e3dfea" stroke="#a89fb0"/><text x="1230" y="430" text-anchor="middle" class="h">段表</text><text x="1230" y="460" text-anchor="middle" class="t">找到该段页表</text><path d="M1230 480V535" class="line"/><rect x="1095" y="535" width="270" height="90" rx="22" fill="#dce6e4" stroke="#9cadaa"/><text x="1230" y="575" text-anchor="middle" class="h">该段的页表</text><text x="1230" y="605" text-anchor="middle" class="t">段内页 → 物理页框</text><path d="M1230 625V670" class="line"/><rect x="1065" y="670" width="330" height="70" rx="22" fill="#f7f5f0" stroke="#a89fb0"/><text x="1230" y="713" text-anchor="middle" class="tag">页框号 ＋ 原页内偏移</text><text x="1230" y="785" text-anchor="middle" class="tag">逻辑段语义＋非连续页框分配</text>
</svg>

