<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" role="img" aria-labelledby="title desc">
  <title id="title">智能体（Agent）整体架构</title><desc id="desc">外部来源（AGENT.md 规范、技能库、知识库、长期记忆）汇入上下文窗口，上下文送入模型，模型与工具在 Agent Loop 中循环，全部由 Harness 驱动</desc>
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#4f493f" flood-opacity=".10"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c7a74"/></marker>
    <marker id="arAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c96a44"/></marker>
    <style>
      .title{font:700 24px Inter,'Microsoft YaHei',sans-serif;fill:#292724}.subtitle{font:400 13px Inter,'Microsoft YaHei',sans-serif;fill:#7c766d}
      .frame{font:700 13px Inter,'Microsoft YaHei',sans-serif;fill:#8b8479;letter-spacing:.08em}
      .nt{font:700 14px Inter,'Microsoft YaHei',sans-serif}.ns{font:400 11px Inter,'Microsoft YaHei',sans-serif;fill:#6f6a62}
      .row{font:600 12px Inter,'Microsoft YaHei',sans-serif;fill:#514c45}.el{font:600 11px Inter,'Microsoft YaHei',sans-serif;fill:#716b63}
      .elA{font:700 11px Inter,'Microsoft YaHei',sans-serif;fill:#bd5d3a}.mono{font:700 12px 'Cascadia Code',Consolas,monospace}
    </style>
  </defs>
  <rect width="1080" height="720" rx="24" fill="#fbfaf7"/>
  <text x="48" y="46" class="title">智能体（Agent）整体架构</text><text x="48" y="72" class="subtitle">外部来源 → 上下文窗口 → 模型 ⇄ 工具，全部由 Harness 驱动、循环推进</text>

  <rect x="36" y="92" width="1008" height="600" rx="20" fill="none" stroke="#c6bfb0" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="56" y="118" class="frame">HARNESS（驱动一切的外层框架）</text>

  <!-- 左侧来源 -->
  <rect x="56" y="150" width="176" height="62" rx="12" fill="#ece8ee" stroke="#685f6d" filter="url(#sh)"/><text x="72" y="176" class="mono" fill="#5b5265">AGENT.md</text><text x="72" y="196" class="ns">项目规范 · 显式记忆</text>
  <rect x="56" y="236" width="176" height="62" rx="12" fill="#e4ebe5" stroke="#5b695f" filter="url(#sh)"/><text x="72" y="262" class="nt" fill="#4c5a4c">Skills 技能库</text><text x="72" y="282" class="ns">能力按需加载</text>
  <rect x="56" y="322" width="176" height="62" rx="12" fill="#e7ebeb" stroke="#536363" filter="url(#sh)"/><text x="72" y="348" class="nt" fill="#4a5757">知识库</text><text x="72" y="368" class="ns">RAG 数据源 · 显式记忆</text>
  <rect x="56" y="408" width="176" height="62" rx="12" fill="#eee9df" stroke="#6d6250" filter="url(#sh)"/><text x="72" y="434" class="nt" fill="#6d6250">长期记忆</text><text x="72" y="454" class="ns">外部存储 · 显式记忆</text>

  <!-- 上下文窗口 -->
  <rect x="338" y="146" width="240" height="454" rx="16" fill="#f8f6f1" stroke="#ddd8cb" filter="url(#sh)"/>
  <text x="458" y="176" class="nt" text-anchor="middle" fill="#59604e">上下文窗口</text>
  <rect x="356" y="190" width="204" height="42" rx="9" fill="#ece8ee" stroke="#b7aebf"/><text x="458" y="216" class="row" text-anchor="middle">系统规范（AGENT.md）</text>
  <rect x="356" y="238" width="204" height="42" rx="9" fill="#e4ebe5" stroke="#9db09d"/><text x="458" y="264" class="row" text-anchor="middle">技能（按需加载）</text>
  <rect x="356" y="286" width="204" height="42" rx="9" fill="#e7ebeb" stroke="#93a3a3"/><text x="458" y="312" class="row" text-anchor="middle">检索到的知识（RAG）</text>
  <rect x="356" y="334" width="204" height="42" rx="9" fill="#eee9df" stroke="#bda98c"/><text x="458" y="360" class="row" text-anchor="middle">召回的长期记忆</text>
  <rect x="356" y="382" width="204" height="42" rx="9" fill="#f1ede4" stroke="#cbc7ba"/><text x="458" y="408" class="row" text-anchor="middle">历史对话与工具结果</text>
  <rect x="356" y="430" width="204" height="42" rx="9" fill="#f1ede4" stroke="#cbc7ba"/><text x="458" y="456" class="row" text-anchor="middle">当前任务</text>

  <!-- 来源 → 上下文 -->
  <path d="M232 178 L 334 205" fill="none" stroke="#7c7a74" stroke-width="1.5" marker-end="url(#ar)"/><text x="252" y="172" class="el">加载</text>
  <path d="M232 260 L 334 256" fill="none" stroke="#7c7a74" stroke-width="1.5" marker-end="url(#ar)"/><text x="248" y="246" class="el">按需加载</text>
  <path d="M232 346 L 334 306" fill="none" stroke="#c96a44" stroke-width="1.8" marker-end="url(#arAcc)"/><text x="246" y="332" class="elA">RAG 检索</text>
  <path d="M232 440 L 334 356" fill="none" stroke="#7c7a74" stroke-width="1.5" marker-end="url(#ar)"/><text x="244" y="440" class="el">召回 / 写回</text>

  <!-- 上下文 → 模型 -->
  <path d="M578 356 L 654 356" fill="none" stroke="#7c7a74" stroke-width="1.7" marker-end="url(#ar)"/><text x="586" y="346" class="el">每轮送入</text>

  <!-- 模型、工具、Loop -->
  <text x="658" y="290" class="el" fill="#bd5d3a">◤ Agent Loop：模型 ⇄ 工具，循环到完成 ◢</text>
  <rect x="658" y="300" width="150" height="118" rx="14" fill="#f6e6dd" stroke="#bd5d3a" filter="url(#sh)"/><text x="733" y="352" class="nt" text-anchor="middle" fill="#a2492b">模型</text><text x="733" y="374" class="ns" text-anchor="middle">只做每步决策</text>
  <rect x="874" y="300" width="140" height="118" rx="14" fill="#eee9df" stroke="#6d6250" filter="url(#sh)"/><text x="944" y="352" class="nt" text-anchor="middle" fill="#6d6250">工具 Tools</text><text x="944" y="374" class="ns" text-anchor="middle">由 Harness 执行</text>
  <path d="M810 338 L 870 338" fill="none" stroke="#7c7a74" stroke-width="1.6" marker-end="url(#ar)"/><text x="840" y="330" class="el" text-anchor="middle">调用</text>
  <path d="M870 384 L 810 384" fill="none" stroke="#7c7a74" stroke-width="1.6" marker-end="url(#ar)"/><text x="840" y="400" class="el" text-anchor="middle">结果</text>

  <!-- 结果回填上下文 -->
  <path d="M944 418 C 944 636, 640 648, 462 606" fill="none" stroke="#9da58b" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#ar)"/>
  <text x="700" y="640" class="el" text-anchor="middle">每轮的输出与工具结果追加回上下文 → 进入下一轮</text>

  <text x="338" y="676" class="ns">Harness 还统管：上下文管理与前缀缓存 · 权限与安全 · 失败恢复 · 可观测</text>
</svg>
