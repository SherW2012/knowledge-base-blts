<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800" role="img" aria-labelledby="t d"><title id="t">IDS与IPS部署差异</title><desc id="d">IDS通常旁路获取流量副本进行检测告警，IPS通常串联在业务路径上并可以直接阻断</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 23px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:18px 'Microsoft YaHei',sans-serif;fill:#665e57}.em{font:700 17px 'Microsoft YaHei',sans-serif;fill:#6d6256}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}.tap{fill:none;stroke:#aaa199;stroke-width:2.5;stroke-dasharray:9 8;marker-end:url(#a)}</style></defs><rect width="1500" height="800" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">IDS vs IPS · 最大差别在“是不是流量必经点”</text><text x="65" y="110" class="sub">二者都可以分析攻击特征；IDS以检测告警为主，IPS通常串联部署并具备主动阻断能力</text><g filter="url(#s)"><rect x="70" y="190" width="650" height="430" rx="28" fill="#f4f1eb" stroke="#c5bcaf"/><rect x="780" y="190" width="650" height="430" rx="28" fill="#f4f1eb" stroke="#c5bcaf"/></g><text x="395" y="245" text-anchor="middle" class="th">IDS · Detection</text><text x="395" y="280" text-anchor="middle" class="tx">常见：旁路获取流量副本</text><rect x="115" y="350" width="180" height="90" rx="22" fill="#e7edec" stroke="#9cadaa"/><rect x="495" y="350" width="180" height="90" rx="22" fill="#eef0e8" stroke="#aeb79b"/><rect x="300" y="505" width="190" height="88" rx="22" fill="#ebe8ef" stroke="#a89fb0"/><text x="205" y="405" text-anchor="middle" class="tx">客户端</text><text x="585" y="405" text-anchor="middle" class="tx">服务器</text><text x="395" y="540" text-anchor="middle" class="th">IDS</text><text x="395" y="570" text-anchor="middle" class="tx">检测 · 记录 · 告警</text><path d="M295 395H485" class="ln"/><path d="M395 440V495" class="tap"/><text x="395" y="325" text-anchor="middle" class="em">业务流量照常通过，IDS拿到副本分析</text><text x="1105" y="245" text-anchor="middle" class="th">IPS · Prevention</text><text x="1105" y="280" text-anchor="middle" class="tx">常见：inline 串联在转发路径</text><rect x="825" y="350" width="160" height="90" rx="22" fill="#e7edec" stroke="#9cadaa"/><rect x="1015" y="330" width="180" height="130" rx="24" fill="#eee9e2" stroke="#b9a38f"/><rect x="1225" y="350" width="160" height="90" rx="22" fill="#eef0e8" stroke="#aeb79b"/><text x="905" y="405" text-anchor="middle" class="tx">客户端</text><text x="1105" y="375" text-anchor="middle" class="th">IPS</text><text x="1105" y="410" text-anchor="middle" class="tx">检测 + 阻断</text><text x="1305" y="405" text-anchor="middle" class="tx">服务器</text><path d="M985 395H1005" class="ln"/><path d="M1195 395H1215" class="ln"/><text x="1105" y="510" text-anchor="middle" class="em">命中策略后可丢包、重置连接、封禁来源</text><text x="1105" y="552" text-anchor="middle" class="tx">代价：误报、延迟和设备故障会直接影响业务</text><rect x="265" y="690" width="970" height="58" rx="18" fill="#eee6e3" stroke="#b39b95"/><text x="750" y="726" text-anchor="middle" class="tx">记忆：IDS = 看见并报告；IPS = 看见后还能在路径上拦截。实际产品可以在不同模式之间切换</text></svg>