<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="t d"><title id="t">生产者消费者中的三个信号量</title><desc id="d">empty控制空槽，full控制已生产数据，mutex保护缓冲区临界区。</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 23px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:18px 'Microsoft YaHei',sans-serif;fill:#665e57}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1500" height="820" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">有限缓冲区同时存在数量同步和互斥</text><text x="65" y="110" class="sub">empty/full回答“能不能放、能不能取”，mutex回答“谁可以修改缓冲区”</text><g filter="url(#s)"><rect x="75" y="250" width="255" height="230" rx="28" fill="#eef0e7" stroke="#aab397"/><rect x="575" y="220" width="350" height="290" rx="28" fill="#eee7e2" stroke="#baa495"/><rect x="1170" y="250" width="255" height="230" rx="28" fill="#e8efed" stroke="#9bb3ad"/></g><text x="202" y="305" text-anchor="middle" class="th">生产者</text><text x="202" y="350" text-anchor="middle" class="tx">P(empty)</text><text x="202" y="385" text-anchor="middle" class="tx">P(mutex)</text><text x="202" y="420" text-anchor="middle" class="tx">放入 → V(mutex)</text><text x="202" y="455" text-anchor="middle" class="tx">V(full)</text><text x="750" y="275" text-anchor="middle" class="th">共享缓冲区</text><rect x="625" y="325" width="55" height="85" rx="8" fill="#c8d2c0"/><rect x="690" y="325" width="55" height="85" rx="8" fill="#c8d2c0"/><rect x="755" y="325" width="55" height="85" rx="8" fill="#f4f1eb" stroke="#bab1a6"/><rect x="820" y="325" width="55" height="85" rx="8" fill="#f4f1eb" stroke="#bab1a6"/><text x="750" y="465" text-anchor="middle" class="tx">full = 已有数据数　empty = 空槽数</text><text x="1297" y="305" text-anchor="middle" class="th">消费者</text><text x="1297" y="350" text-anchor="middle" class="tx">P(full)</text><text x="1297" y="385" text-anchor="middle" class="tx">P(mutex)</text><text x="1297" y="420" text-anchor="middle" class="tx">取出 → V(mutex)</text><text x="1297" y="455" text-anchor="middle" class="tx">V(empty)</text><path d="M330 365H565" class="ln"/><path d="M925 365H1160" class="ln"/><rect x="465" y="590" width="570" height="120" rx="25" fill="#e9e5ef" stroke="#aaa1b8"/><text x="750" y="638" text-anchor="middle" class="th">mutex = 1</text><text x="750" y="675" text-anchor="middle" class="tx">只保护“修改缓冲区”这一临界区，不表示槽位数量</text></svg>