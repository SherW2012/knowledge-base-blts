<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="t d"><title id="t">ISO产品质量模型的层级</title><desc id="d">从质量模型、特性、子特性到产品要求与质量度量的层次。</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 23px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:17px 'Microsoft YaHei',sans-serif;fill:#665e57}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1500" height="760" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">质量分类不等于质量得分</text><text x="65" y="110" class="sub">模型提供统一词汇，项目还必须把子特性转化为具体要求和可取得的证据</text>
<g filter="url(#s)"><rect x="70" y="245" width="240" height="190" rx="28" fill="#eef0e7" stroke="#abb399"/><rect x="350" y="215" width="240" height="250" rx="28" fill="#e6efed" stroke="#94afa9"/><rect x="630" y="215" width="240" height="250" rx="28" fill="#ece5df" stroke="#b49d8c"/><rect x="910" y="215" width="240" height="250" rx="28" fill="#e9e5ef" stroke="#aaa0b8"/><rect x="1190" y="245" width="240" height="190" rx="28" fill="#f1e7e3" stroke="#c1a095"/></g>
<text x="190" y="298" text-anchor="middle" class="th">质量模型</text><text x="190" y="342" text-anchor="middle" class="tx">组织完整质量范围</text><text x="190" y="376" text-anchor="middle" class="tx">统一评价语言</text>
<text x="470" y="270" text-anchor="middle" class="th">特性</text><text x="470" y="316" text-anchor="middle" class="tx">大的质量领域</text><text x="470" y="352" text-anchor="middle" class="tx">例如可靠性</text><text x="470" y="402" text-anchor="middle" class="tx">仍不能直接评分</text>
<text x="750" y="270" text-anchor="middle" class="th">子特性</text><text x="750" y="316" text-anchor="middle" class="tx">具体关注点</text><text x="750" y="352" text-anchor="middle" class="tx">例如可用性</text><text x="750" y="402" text-anchor="middle" class="tx">明确评价方向</text>
<text x="1030" y="270" text-anchor="middle" class="th">质量要求</text><text x="1030" y="316" text-anchor="middle" class="tx">目标产品必须达到</text><text x="1030" y="352" text-anchor="middle" class="tx">月度可用度≥99.9%</text><text x="1030" y="402" text-anchor="middle" class="tx">形成验收边界</text>
<text x="1310" y="298" text-anchor="middle" class="th">质量度量</text><text x="1310" y="342" text-anchor="middle" class="tx">怎样取得并计算证据</text><text x="1310" y="376" text-anchor="middle" class="tx">服务时间÷计划时间</text>
<path d="M310 340H340" class="ln"/><path d="M590 340H620" class="ln"/><path d="M870 340H900" class="ln"/><path d="M1150 340H1180" class="ln"/>
<rect x="250" y="560" width="1000" height="105" rx="27" fill="#f4f1eb" stroke="#bab1a6"/><text x="750" y="603" text-anchor="middle" class="th">25010负责分类，具体度量还需要测量标准和项目定义</text><text x="750" y="640" text-anchor="middle" class="tx">“属于可靠性”与“可靠性已经合格”是两个不同结论</text></svg>
