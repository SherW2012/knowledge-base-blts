<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="t d"><title id="t">UML顺序图示例</title><desc id="d">顺序图展示生命线、激活条、同步消息、返回消息和组合片段。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#756d65"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 20px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:16px 'Microsoft YaHei',sans-serif;fill:#5f5851}.life{stroke:#8a8178;stroke-width:2;stroke-dasharray:8 8}.msg{stroke:#756d65;stroke-width:2.5;fill:none;marker-end:url(#arr)}.ret{stroke:#9b9289;stroke-width:2;fill:none;stroke-dasharray:8 7;marker-end:url(#arr)}</style></defs><rect width="1500" height="900" rx="34" fill="#fbfaf7"/><text x="65" y="70" class="h">顺序图：把一次场景放到“时间轴”上看对象协作</text><text x="65" y="108" class="sub">横向是参与交互的生命线，纵向从上到下表示时间推进</text><g><rect x="110" y="170" width="220" height="70" rx="12" fill="#eef0e7" stroke="#9ea78d"/><text x="220" y="212" text-anchor="middle" class="th">customer : User</text><line x1="220" y1="240" x2="220" y2="790" class="life"/></g><g><rect x="480" y="170" width="220" height="70" rx="12" fill="#e8efed" stroke="#9bb3ad"/><text x="590" y="212" text-anchor="middle" class="th">order : OrderService</text><line x1="590" y1="240" x2="590" y2="790" class="life"/></g><g><rect x="850" y="170" width="220" height="70" rx="12" fill="#f0e7e3" stroke="#c1a196"/><text x="960" y="212" text-anchor="middle" class="th">stock : StockService</text><line x1="960" y1="240" x2="960" y2="790" class="life"/></g><g><rect x="1220" y="170" width="220" height="70" rx="12" fill="#eeeade" stroke="#b7aa83"/><text x="1330" y="212" text-anchor="middle" class="th">pay : PaymentService</text><line x1="1330" y1="240" x2="1330" y2="790" class="life"/></g><rect x="580" y="292" width="20" height="385" fill="#d9ded4" stroke="#8d9581"/><rect x="950" y="365" width="20" height="95" fill="#dce8e5" stroke="#91aaa4"/><rect x="1320" y="555" width="20" height="90" fill="#eadbd5" stroke="#b99588"/><path d="M220 300H580" class="msg"/><text x="400" y="282" text-anchor="middle" class="tx">createOrder()</text><path d="M600 380H950" class="msg"/><text x="775" y="362" text-anchor="middle" class="tx">reserve(items)</text><path d="M950 445H600" class="ret"/><text x="775" y="428" text-anchor="middle" class="tx">reserved</text><rect x="525" y="490" width="875" height="190" fill="none" stroke="#9b9289"/><rect x="525" y="490" width="120" height="32" fill="#f4f1eb" stroke="#9b9289"/><text x="585" y="512" text-anchor="middle" class="tx">alt</text><text x="650" y="548" class="tx">[需要支付]</text><path d="M600 570H1320" class="msg"/><text x="960" y="552" text-anchor="middle" class="tx">createPayment()</text><text x="650" y="650" class="tx">[无需支付]</text><path d="M600 705H220" class="ret"/><text x="410" y="688" text-anchor="middle" class="tx">orderId</text><text x="750" y="840" text-anchor="middle" class="tx">高频元素：lifeline、activation、同步/异步/返回消息、create/destroy、alt、opt、loop、par 等组合片段。</text></svg>