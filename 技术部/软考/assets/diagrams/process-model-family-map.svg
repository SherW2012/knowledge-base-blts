<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">软件生命周期与过程模型的分类关系</title>
  <desc id="desc">按照阶段组织、需求探索、迭代交付、风险处理和复用框架展示常见软件过程模型</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#4f493f" flood-opacity=".10"/></filter>
    <style>
      .title{font:700 25px Inter,'Microsoft YaHei',sans-serif;fill:#292724}.subtitle{font:400 13px Inter,'Microsoft YaHei',sans-serif;fill:#7c766d}
      .group{font:700 16px Inter,'Microsoft YaHei',sans-serif}.items{font:500 13px Inter,'Microsoft YaHei',sans-serif;fill:#5f5a53}.focus{font:400 12px Inter,'Microsoft YaHei',sans-serif;fill:#777168}
      .center{font:700 18px Inter,'Microsoft YaHei',sans-serif;fill:#4f4a43}.line{stroke:#aaa297;stroke-width:1.6;fill:none}
    </style>
  </defs>
  <rect width="960" height="600" rx="24" fill="#fbfaf7"/>
  <text x="48" y="50" class="title">软件生命周期与过程模型的分类关系</text>
  <text x="48" y="76" class="subtitle">不同模型关注阶段、需求、交付、风险或复用，分类角度并不完全互斥</text>

  <rect x="350" y="110" width="260" height="76" rx="18" fill="#ebe8e1" stroke="#bdb5a9" filter="url(#shadow)"/>
  <text x="480" y="143" class="center" text-anchor="middle">软件开发过程</text>
  <text x="480" y="166" class="focus" text-anchor="middle">组织分析、设计、实现、测试与交付</text>

  <path d="M480 186 L480 218 M480 218 L150 218 M480 218 L810 218" class="line"/>
  <path d="M150 218 L150 246 M315 218 L315 246 M480 218 L480 246 M645 218 L645 246 M810 218 L810 246" class="line"/>

  <rect x="55" y="246" width="190" height="132" rx="18" fill="#e7ebeb" stroke="#9aa7a6"/>
  <text x="150" y="281" class="group" text-anchor="middle" fill="#536363">阶段与验证</text>
  <text x="150" y="314" class="items" text-anchor="middle">瀑布模型</text><text x="150" y="338" class="items" text-anchor="middle">V模型</text>
  <text x="150" y="362" class="focus" text-anchor="middle">明确阶段及测试对应</text>

  <rect x="220" y="246" width="190" height="132" rx="18" fill="#eee6e3" stroke="#b39b95"/>
  <text x="315" y="281" class="group" text-anchor="middle" fill="#6f5c54">需求探索</text>
  <text x="315" y="314" class="items" text-anchor="middle">原型模型</text>
  <text x="315" y="338" class="focus" text-anchor="middle">通过可观察成果</text><text x="315" y="358" class="focus" text-anchor="middle">降低需求不确定性</text>

  <rect x="385" y="246" width="190" height="160" rx="18" fill="#e7ece6" stroke="#95a192"/>
  <text x="480" y="281" class="group" text-anchor="middle" fill="#596657">迭代与交付</text>
  <text x="480" y="314" class="items" text-anchor="middle">增量 · 迭代</text><text x="480" y="338" class="items" text-anchor="middle">喷泉模型</text>
  <text x="480" y="370" class="focus" text-anchor="middle">增加能力、改善成果</text><text x="480" y="390" class="focus" text-anchor="middle">或使活动反复交叠</text>

  <rect x="550" y="246" width="190" height="132" rx="18" fill="#ece8ee" stroke="#a097a5"/>
  <text x="645" y="281" class="group" text-anchor="middle" fill="#685f6d">风险驱动</text>
  <text x="645" y="314" class="items" text-anchor="middle">螺旋模型</text>
  <text x="645" y="338" class="focus" text-anchor="middle">每轮识别、评估</text><text x="645" y="358" class="focus" text-anchor="middle">并处理关键风险</text>

  <rect x="715" y="246" width="190" height="160" rx="18" fill="#eee8df" stroke="#b7a990"/>
  <text x="810" y="281" class="group" text-anchor="middle" fill="#6e624f">快速、复用与框架</text>
  <text x="810" y="314" class="items" text-anchor="middle">RAD</text><text x="810" y="338" class="items" text-anchor="middle">构件组装</text><text x="810" y="362" class="items" text-anchor="middle">UP / RUP</text>
  <text x="810" y="390" class="focus" text-anchor="middle">工具、复用与过程框架</text>

  <rect x="175" y="466" width="610" height="76" rx="18" fill="#f0ede6" stroke="#c8c0b4"/>
  <text x="480" y="497" class="center" text-anchor="middle">实际项目可以组合多种特征</text>
  <text x="480" y="522" class="focus" text-anchor="middle">例如：以螺旋方式处理风险，同时采用增量交付并在每轮迭代改进</text>
</svg>
