<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="title desc">
  <title id="title">三层 Engineering 的包含关系</title><desc id="desc">Harness 工程包含上下文工程，上下文工程包含提示工程，是从全局到局部的同一件事</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4f493f" flood-opacity=".10"/></filter>
    <style>
      .title{font:700 24px Inter,'Microsoft YaHei',sans-serif;fill:#292724}.subtitle{font:400 13px Inter,'Microsoft YaHei',sans-serif;fill:#7c766d}
      .l1t{font:700 17px Inter,'Microsoft YaHei',sans-serif;fill:#5b695f}.l2t{font:700 17px Inter,'Microsoft YaHei',sans-serif;fill:#536363}.l3t{font:700 17px Inter,'Microsoft YaHei',sans-serif;fill:#6f5c54}
      .ls{font:400 12.5px Inter,'Microsoft YaHei',sans-serif;fill:#6f6a62}
    </style>
  </defs>
  <rect width="760" height="480" rx="24" fill="#fbfaf7"/>
  <text x="48" y="50" class="title">三层 Engineering 的包含关系</text><text x="48" y="76" class="subtitle">后者包含前者，从系统全局逐层收敛到单次请求的一段文字</text>

  <rect x="60" y="104" width="640" height="352" rx="20" fill="#e4ebe5" stroke="#5b695f" filter="url(#shadow)"/>
  <text x="88" y="140" class="l1t">Harness Engineering</text><text x="88" y="162" class="ls">循环 · 工具 · 记忆 · 权限 · 失败恢复 · 可观测</text>

  <rect x="112" y="184" width="536" height="248" rx="18" fill="#e7ebeb" stroke="#536363"/>
  <text x="140" y="220" class="l2t">Context Engineering</text><text x="140" y="242" class="ls">每一步该把什么放进上下文窗口：选择 · 排序 · 压缩 · 更新</text>

  <rect x="168" y="264" width="424" height="144" rx="16" fill="#eee6e3" stroke="#6f5c54"/>
  <text x="196" y="300" class="l3t">Prompt Engineering</text><text x="196" y="322" class="ls">单次请求里指令与内容怎么写：</text><text x="196" y="344" class="ls">指令 · 少样本示例 · 输出格式 · 约束</text>
</svg>
