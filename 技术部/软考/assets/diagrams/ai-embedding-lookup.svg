<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" role="img" aria-labelledby="title desc">
  <title id="title">词嵌入是怎么“查表”得到的</title><desc id="desc">分词器给每个 token 一个整数下标；嵌入矩阵按这个下标取出对应的一行，就是该 token 的嵌入向量。矩阵是模型参数，随模型加载在显存中</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4f493f" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c7a74"/></marker>
    <style>
      .title{font:700 23px Inter,'Microsoft YaHei',sans-serif;fill:#292724}.subtitle{font:400 13px Inter,'Microsoft YaHei',sans-serif;fill:#7c766d}
      .nt{font:700 17px Inter,'Microsoft YaHei',sans-serif}.step{font:700 12px Inter,'Microsoft YaHei',sans-serif;fill:#8b8479}
      .num{font:600 12.5px 'Cascadia Code',Consolas,monospace;fill:#514c45}.numf{font:600 12.5px 'Cascadia Code',Consolas,monospace;fill:#b8b2a6}
      .idl{font:700 13px 'Cascadia Code',Consolas,monospace;fill:#6f6a62}.cap{font:400 12.5px Inter,'Microsoft YaHei',sans-serif;fill:#514c45}
    </style>
  </defs>
  <rect width="920" height="470" rx="24" fill="#fbfaf7"/>
  <text x="48" y="46" class="title">词嵌入是怎么“查表”得到的</text><text x="48" y="72" class="subtitle">查表 = 按 token 的整数下标，取出嵌入矩阵的对应一行</text>

  <text x="56" y="132" class="step">① 分词得到整数下标</text>
  <rect x="56" y="150" width="80" height="46" rx="12" fill="#e4ebe5" stroke="#5b695f" filter="url(#shadow)"/><text x="96" y="180" class="nt" text-anchor="middle" fill="#4c5a4c">猫</text>
  <path d="M140 173 L 178 173" fill="none" stroke="#7c7a74" stroke-width="1.7" marker-end="url(#arrow)"/>
  <rect x="182" y="152" width="118" height="42" rx="11" fill="#f4f2ed" stroke="#cbc7ba"/><text x="241" y="179" class="num" text-anchor="middle">id = 5231</text>

  <text x="360" y="132" class="step">② 嵌入矩阵（模型参数）　[ 词表大小 × 维度 d ]</text>
  <text x="470" y="164" class="idl" fill="#8b8479">d1    d2    d3    ⋯    d4096</text>
  <rect x="360" y="172" width="404" height="204" rx="12" fill="#f8f6f1" stroke="#ddd8cb"/>
  <text x="352" y="204" class="idl" text-anchor="end">5230</text><text x="470" y="204" class="numf">0.07　0.31　-0.22　⋯　0.10</text>
  <line x1="360" y1="220" x2="764" y2="220" stroke="#eae5da"/>
  <rect x="360" y="220" width="404" height="48" fill="#e4ebe5" opacity=".7"/>
  <text x="352" y="250" class="idl" text-anchor="end" fill="#4c5a4c">5231 猫</text><text x="470" y="250" class="num">0.21　-0.53　0.87　⋯　0.44</text>
  <line x1="360" y1="268" x2="764" y2="268" stroke="#eae5da"/>
  <text x="352" y="298" class="idl" text-anchor="end">5232</text><text x="470" y="298" class="numf">-0.14　0.09　0.55　⋯　-0.03</text>
  <line x1="360" y1="316" x2="764" y2="316" stroke="#eae5da"/>
  <text x="352" y="348" class="idl" text-anchor="end">⋮</text><text x="470" y="348" class="numf">⋮</text>

  <path d="M300 173 C 330 173, 330 244, 356 244" fill="none" stroke="#7c7a74" stroke-width="1.7" marker-end="url(#arrow)"/>
  <path d="M768 244 L 806 244" fill="none" stroke="#7c7a74" stroke-width="1.7" marker-end="url(#arrow)"/>
  <text x="812" y="238" class="cap" fill="#4c5a4c">取第 5231 行</text><text x="812" y="258" class="cap" fill="#4c5a4c">= “猫”的向量</text>

  <rect x="56" y="398" width="808" height="50" rx="12" fill="#f2ecdb" stroke="#d8cdae"/>
  <text x="76" y="420" class="cap">矩阵和其他权重一起随模型加载在显存(GPU)中、并在训练时被一同学出来——它不是外部数据库。</text>
  <text x="76" y="440" class="cap">这是“输入侧”；输出侧另有一个矩阵把顶层向量变回词表分数(logits)，二者是不同的矩阵。</text>
</svg>
