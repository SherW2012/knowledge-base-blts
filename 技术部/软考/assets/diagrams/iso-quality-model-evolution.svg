<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="t d"><title id="t">ISO软件产品质量模型的版本演进</title><desc id="d">从9126六项特性到25010 2011八项特性，再到2023产品质量与使用质量分立。</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 24px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:17px 'Microsoft YaHei',sans-serif;fill:#665e57}.cap{font:700 18px 'Microsoft YaHei',sans-serif;fill:#514a44}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1500" height="760" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">版本先分开，再比较变化</text><text x="65" y="110" class="sub">不要把六项、八项和九项特性合并为一张没有版本标识的质量清单</text>
<g filter="url(#s)"><rect x="65" y="210" width="360" height="330" rx="30" fill="#eef0e7" stroke="#abb399"/><rect x="570" y="180" width="360" height="390" rx="30" fill="#e6efed" stroke="#94afa9"/><rect x="1075" y="150" width="360" height="450" rx="30" fill="#e9e5ef" stroke="#aaa0b8"/></g>
<text x="245" y="266" text-anchor="middle" class="th">ISO/IEC 9126-1:2001</text><text x="245" y="308" text-anchor="middle" class="cap">六项产品质量特性</text><text x="245" y="360" text-anchor="middle" class="tx">功能 · 可靠 · 易用</text><text x="245" y="395" text-anchor="middle" class="tx">效率 · 维护 · 移植</text><text x="245" y="458" text-anchor="middle" class="tx">安全和互操作尚在其他特性之下</text><text x="245" y="500" text-anchor="middle" class="cap">已撤销，旧教材常用</text>
<text x="750" y="236" text-anchor="middle" class="th">ISO/IEC 25010:2011</text><text x="750" y="278" text-anchor="middle" class="cap">八项产品质量特性</text><text x="750" y="330" text-anchor="middle" class="tx">兼容性、信息安全性成为一级特性</text><text x="750" y="368" text-anchor="middle" class="tx">性能效率增加容量</text><text x="750" y="406" text-anchor="middle" class="tx">同时包含五项使用质量特性</text><text x="750" y="480" text-anchor="middle" class="cap">已撤销，大量教材的主要口径</text>
<text x="1255" y="206" text-anchor="middle" class="th">2023年现行体系</text><text x="1255" y="258" text-anchor="middle" class="cap">ISO/IEC 25010:2023</text><text x="1255" y="298" text-anchor="middle" class="tx">九项产品质量特性</text><text x="1255" y="338" text-anchor="middle" class="tx">交互能力 · 灵活性 · Safety等调整</text><text x="1255" y="406" text-anchor="middle" class="cap">ISO/IEC 25019:2023</text><text x="1255" y="446" text-anchor="middle" class="tx">使用质量模型独立成标准</text><text x="1255" y="518" text-anchor="middle" class="cap">产品质量与使用质量分开维护</text>
<path d="M425 375H560" class="ln"/><path d="M930 375H1065" class="ln"/><rect x="250" y="650" width="1000" height="65" rx="24" fill="#f4f1eb" stroke="#bab1a6"/><text x="750" y="692" text-anchor="middle" class="tx">做题先识别版本：9126看六项，25010:2011看八项，现行25010:2023看九项</text></svg>
