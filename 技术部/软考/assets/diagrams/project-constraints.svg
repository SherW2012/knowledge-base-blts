<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="t d"><title id="t">项目管理主要约束关系</title><desc id="d">范围、进度、成本和质量通过资源与风险相互影响。</desc><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 24px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:18px 'Microsoft YaHei',sans-serif;fill:#665e57}.ln{stroke:#968e85;stroke-width:4;fill:none}</style></defs><rect width="1500" height="820" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">项目目标之间不是独立开关，而是一组联动约束</text><text x="65" y="110" class="sub">改变范围、时间或成本，通常都会把影响传到资源、风险与最终质量</text><path d="M750 245L1080 455L750 650L420 455Z" fill="#f4f1eb" stroke="#b4aaa0" stroke-width="3"/><circle cx="750" cy="245" r="115" fill="#eef0e7" stroke="#aab397"/><circle cx="1080" cy="455" r="115" fill="#e8efed" stroke="#9bb3ad"/><circle cx="750" cy="650" r="115" fill="#eee7e2" stroke="#baa495"/><circle cx="420" cy="455" r="115" fill="#e9e5ef" stroke="#aaa1b8"/><circle cx="750" cy="455" r="125" fill="#f0e7e3" stroke="#c1a196"/><text x="750" y="238" text-anchor="middle" class="th">范围</text><text x="750" y="278" text-anchor="middle" class="tx">交付多少工作</text><text x="1080" y="448" text-anchor="middle" class="th">进度</text><text x="1080" y="488" text-anchor="middle" class="tx">什么时候完成</text><text x="750" y="643" text-anchor="middle" class="th">成本</text><text x="750" y="683" text-anchor="middle" class="tx">投入多少资源</text><text x="420" y="448" text-anchor="middle" class="th">质量</text><text x="420" y="488" text-anchor="middle" class="tx">做到什么水平</text><text x="750" y="445" text-anchor="middle" class="th">项目目标</text><text x="750" y="485" text-anchor="middle" class="tx">资源与风险共同约束</text></svg>