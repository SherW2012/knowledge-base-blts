<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="t d"><title id="t">NAT映射与回包</title><desc id="d">展示内网连接经SNAT/PAT改写后，出口网关如何通过NAT状态表把公网回包还原到正确内网主机</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 22px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:18px 'Microsoft YaHei',sans-serif;fill:#665e57}.em{font:700 17px 'Microsoft YaHei',sans-serif;fill:#6d6256}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1500" height="820" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">NAT 回包 · “公网IP怎么知道还给哪台内网主机”</text><text x="65" y="110" class="sub">答案不是远端服务器记住私网地址，而是本地NAT网关保存连接映射</text><g filter="url(#s)"><rect x="90" y="205" width="330" height="220" rx="28" fill="#e7edec" stroke="#9cadaa"/><rect x="585" y="175" width="330" height="280" rx="30" fill="#eee9e2" stroke="#b9a38f"/><rect x="1080" y="205" width="330" height="220" rx="28" fill="#eef0e8" stroke="#aeb79b"/></g><text x="255" y="260" text-anchor="middle" class="th">内网主机</text><text x="255" y="310" text-anchor="middle" class="tx">192.168.10.20:50000</text><text x="255" y="360" text-anchor="middle" class="em">访问 8.8.8.8:443</text><text x="750" y="230" text-anchor="middle" class="th">NAT 网关</text><text x="750" y="280" text-anchor="middle" class="em">保存映射</text><text x="750" y="323" text-anchor="middle" class="tx">192.168.10.20:50000</text><text x="750" y="358" text-anchor="middle" class="tx">↕</text><text x="750" y="393" text-anchor="middle" class="tx">1.1.1.1:62001</text><text x="1245" y="260" text-anchor="middle" class="th">公网服务器</text><text x="1245" y="310" text-anchor="middle" class="tx">8.8.8.8:443</text><text x="1245" y="360" text-anchor="middle" class="em">只需回复 1.1.1.1:62001</text><path d="M420 300H575" class="ln"/><path d="M915 300H1070" class="ln"/><g filter="url(#s)"><rect x="145" y="555" width="1210" height="165" rx="28" fill="#ebe8ef" stroke="#a89fb0"/></g><text x="200" y="602" class="th">回包</text><text x="200" y="648" class="tx">8.8.8.8:443 → 1.1.1.1:62001</text><text x="650" y="648" class="em">NAT网关查状态表</text><text x="910" y="648" class="tx">→ 192.168.10.20:50000</text><text x="200" y="692" class="tx">公网服务器不知道 192.168.10.20；真正记住“1.1.1.1:62001 属于谁”的是 NAT 网关。</text></svg>