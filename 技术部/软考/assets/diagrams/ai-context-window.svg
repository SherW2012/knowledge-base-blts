<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
  <title id="title">一次请求的上下文构成</title><desc id="desc">上下文由稳定到易变层叠而成，越靠前越稳定并利于前缀缓存，越靠后越贴近当前决策</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4f493f" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c7a74"/></marker>
    <style>
      .title{font:700 24px Inter,'Microsoft YaHei',sans-serif;fill:#292724}.subtitle{font:400 13px Inter,'Microsoft YaHei',sans-serif;fill:#7c766d}
      .nt{font:700 15px Inter,'Microsoft YaHei',sans-serif}.ns{font:400 12px Inter,'Microsoft YaHei',sans-serif;fill:#6f6a62}
      .group{font:700 12px Inter,'Microsoft YaHei',sans-serif;fill:#8b8479;letter-spacing:.06em}.edge{fill:none;stroke:#7c7a74;stroke-width:1.7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="760" height="560" rx="24" fill="#fbfaf7"/>
  <text x="48" y="50" class="title">一次请求的上下文构成</text><text x="48" y="76" class="subtitle">上下文窗口是模型唯一的工作内存，由稳定到易变层叠而成</text>

  <text x="70" y="116" class="group">稳定 · 靠前 · 利于前缀缓存</text>
  <rect x="70" y="126" width="470" height="52" rx="12" fill="#eee6e3" stroke="#6f5c54" filter="url(#shadow)"/><text x="92" y="149" class="nt" fill="#6f5c54">System Prompt</text><text x="92" y="169" class="ns">角色 · 规则 · 全局约束</text>
  <rect x="70" y="186" width="470" height="52" rx="12" fill="#eee9df" stroke="#6d6250" filter="url(#shadow)"/><text x="92" y="209" class="nt" fill="#6d6250">工具与技能定义</text><text x="92" y="229" class="ns">可用的工具 schema、技能描述</text>
  <rect x="70" y="246" width="470" height="52" rx="12" fill="#ece8ee" stroke="#685f6d" filter="url(#shadow)"/><text x="92" y="269" class="nt" fill="#685f6d">检索资料与长期记忆</text><text x="92" y="289" class="ns">按需检索注入的外部知识</text>
  <rect x="70" y="306" width="470" height="52" rx="12" fill="#e7ebeb" stroke="#536363" filter="url(#shadow)"/><text x="92" y="329" class="nt" fill="#536363">历史对话与工具结果</text><text x="92" y="349" class="ns">此前各轮的动作与观察</text>
  <rect x="70" y="366" width="470" height="52" rx="12" fill="#e4ebe5" stroke="#5b695f" filter="url(#shadow)"/><text x="92" y="389" class="nt" fill="#5b695f">当前这一步的任务</text><text x="92" y="409" class="ns">本轮要模型处理的输入</text>
  <text x="70" y="446" class="group">易变 · 靠后 · 贴近当前决策</text>

  <path class="edge" d="M540 292 C 640 292, 640 292, 660 292"/>
  <rect x="600" y="246" width="120" height="92" rx="16" fill="#e7ebe3" stroke="#626b56" filter="url(#shadow)"/><text x="660" y="298" class="nt" text-anchor="middle" fill="#545c4a">模型</text>
</svg>
