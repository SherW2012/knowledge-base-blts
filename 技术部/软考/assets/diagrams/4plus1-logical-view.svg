<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="t d"><title id="t">订单系统逻辑视图</title><desc id="d">展示用户、订单、商品、库存和通知等逻辑职责及其关系。</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#40372f" flood-opacity=".1"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#92897f"/></marker><style>.T{font:700 39px 'Microsoft YaHei';fill:#22201d}.S{font:20px 'Microsoft YaHei';fill:#786f66}.H{font:700 25px 'Microsoft YaHei';fill:#5d554d}.P{font:19px 'Microsoft YaHei';fill:#6d645c}.L{fill:none;stroke:#92897f;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1400" height="760" rx="38" fill="#fbfaf7"/><text x="65" y="75" class="T">逻辑视图 · 功能职责与对象关系</text><text x="65" y="112" class="S">不讨论代码目录、运行进程和服务器，只表达系统在概念上由谁负责什么</text><g filter="url(#s)"><rect x="75" y="280" width="220" height="120" rx="60" fill="#eee9df" stroke="#b7a98e"/><rect x="390" y="220" width="280" height="220" rx="28" fill="#f0e8e4" stroke="#b89e94"/><rect x="790" y="170" width="260" height="145" rx="28" fill="#e7edec" stroke="#9cadaa"/><rect x="790" y="380" width="260" height="145" rx="28" fill="#ebe8ef" stroke="#a89fb0"/><rect x="1140" y="275" width="210" height="145" rx="28" fill="#eee9df" stroke="#b7a98e"/></g><text x="185" y="330" text-anchor="middle" class="H">用户</text><text x="185" y="367" text-anchor="middle" class="P">提交订单</text><text x="530" y="275" text-anchor="middle" class="H">订单管理</text><text x="435" y="320" class="P">• 创建和校验订单</text><text x="435" y="360" class="P">• 维护订单状态</text><text x="435" y="400" class="P">• 协调库存与通知</text><text x="920" y="220" text-anchor="middle" class="H">商品管理</text><text x="920" y="260" text-anchor="middle" class="P">提供商品与价格信息</text><text x="920" y="430" text-anchor="middle" class="H">库存管理</text><text x="920" y="470" text-anchor="middle" class="P">检查并预留库存</text><text x="1245" y="325" text-anchor="middle" 