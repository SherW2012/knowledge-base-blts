<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" role="img" aria-labelledby="title desc">
  <title id="title">MCP 架构</title><desc id="desc">Agent 内嵌客户端，通过 stdio 或 HTTP 传输连接 MCP 服务器，服务器对外暴露工具、资源与提示三类原语</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4f493f" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c7a74"/></marker>
    <style>
      .title{font:700 24px Inter,'Microsoft YaHei',sans-serif;fill:#292724}.subtitle{font:400 13px Inter,'Microsoft YaHei',sans-serif;fill:#7c766d}
      .nt{font:700 15px Inter,'Microsoft YaHei',sans-serif}.ns{font:400 12px Inter,'Microsoft YaHei',sans-serif;fill:#6f6a62}
      .prim{font:700 14px Inter,'Microsoft YaHei',sans-serif}.edge{fill:none;stroke:#7c7a74;stroke-width:1.7}.el{font:600 11px Inter,'Microsoft YaHei',sans-serif;fill:#716b63}
    </style>
  </defs>
  <rect width="820" height="420" rx="24" fill="#fbfaf7"/>
  <text x="48" y="50" class="title">MCP 架构</text><text x="48" y="76" class="subtitle">统一协议把 Agent 与外部工具/数据源解耦，实现一次即可被整个生态接入</text>

  <rect x="60" y="150" width="210" height="120" rx="18" fill="#e4ebe5" stroke="#5b695f" filter="url(#shadow)"/><text x="165" y="196" class="nt" text-anchor="middle" fill="#4c5a4c">Host / Client</text><text x="165" y="220" class="ns" text-anchor="middle">Agent 应用</text><text x="165" y="240" class="ns" text-anchor="middle">内嵌 MCP 客户端</text>

  <path class="edge" d="M270 210 L 355 210" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="312" y="196" class="el" text-anchor="middle">Transport</text><text x="312" y="232" class="el" text-anchor="middle">stdio / HTTP</text>

  <rect x="360" y="132" width="400" height="156" rx="18" fill="#e7ebeb" stroke="#536363" filter="url(#shadow)"/><text x="384" y="164" class="nt" fill="#4a5757">MCP Server</text><text x="384" y="184" class="ns">工具或数据源一侧</text>
  <rect x="384" y="204" width="112" height="64" rx="12" fill="#eee6e3" stroke="#6f5c54"/><text x="440" y="232" class="prim" text-anchor="middle" fill="#6f5c54">Tools</text><text x="440" y="252" class="ns" text-anchor="middle">可调用操作</text>
  <rect x="504" y="204" width="112" height="64" rx="12" fill="#eee9df" stroke="#6d6250"/><text x="560" y="232" class="prim" text-anchor="middle" fill="#6d6250">Resources</text><text x="560" y="252" class="ns" text-anchor="middle">可读数据</text>
  <rect x="624" y="204" width="112" height="64" rx="12" fill="#ece8ee" stroke="#685f6d"/><text x="680" y="232" class="prim" text-anchor="middle" fill="#685f6d">Prompts</text><text x="680" y="252" class="ns" text-anchor="middle">提示模板</text>
</svg>
