<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" role="img" aria-labelledby="t d"><title id="t">Flynn分类的四象限</title><desc id="d">按指令流和数据流分别为单个或多个，形成SISD SIMD MISD MIMD四类</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.axis{font:700 18px 'Microsoft YaHei',sans-serif;fill:#827b72;letter-spacing:.04em}.big{font:700 34px 'Microsoft YaHei',sans-serif}.th{font:700 21px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:18px 'Microsoft YaHei',sans-serif;fill:#665e57}</style></defs><rect width="1500" height="860" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">Flynn 分类 · 只看两件事</text><text x="65" y="110" class="sub">指令流有一条还是多条，数据流有一份还是多份；两个维度组合成四种体系结构</text><text x="585" y="172" text-anchor="middle" class="axis">单数据流 · Single Data</text><text x="1105" y="172" text-anchor="middle" class="axis">多数据流 · Multiple Data</text><text x="130" y="380" text-anchor="middle" class="axis" transform="rotate(-90 130 380)">单指令流 · Single Instruction</text><text x="130" y="650" text-anchor="middle" class="axis" transform="rotate(-90 130 650)">多指令流 · Multiple Instruction</text><g filter="url(#s)"><rect x="240" y="205" width="610" height="245" rx="28" fill="#e7edec" stroke="#9cadaa"/><rect x="900" y="205" width="500" height="245" rx="28" fill="#ebe8ef" stroke="#a89fb0"/><rect x="240" y="500" width="610" height="245" rx="28" fill="#eee9e2" stroke="#b9a38f"/><rect x="900" y="500" width="500" height="245" rx="28" fill="#eef0e8" stroke="#aeb79b"/></g><text x="545" y="270" text-anchor="middle" class="big" fill="#536363">SISD</text><text x="545" y="316" text-anchor="middle" class="th">单指令流 · 单数据流</text><text x="545" y="360" text-anchor="middle" class="tx">一个执行序列处理一份数据</text><text x="545" y="396" text-anchor="middle" class="tx">传统顺序执行模型最直观</text><text x="1150" y="270" text-anchor="middle" class="big" fill="#685f6d">SIMD</text><text x="1150" y="316" text-anchor="middle" class="th">单指令流 · 多数据流</text><text x="1150" y="360" text-anchor="middle" class="tx">同一种操作同时作用于多份数据</text><text x="1150" y="396" text-anchor="middle" class="tx">向量 / 图像 / 矩阵数据并行</text><text x="545" y="565" text-anchor="middle" class="big" fill="#6e624f">MISD</text><text x="545" y="611" text-anchor="middle" class="th">多指令流 · 单数据流</text><text x="545" y="655" text-anchor="middle" class="tx">多个不同处理过程围绕同一数据流</text><text x="545" y="691" text-anchor="middle" class="tx">通用计算机中较少作为典型形式</text><text x="1150" y="565" text-anchor="middle" class="big" fill="#596657">MIMD</text><text x="1150" y="611" text-anchor="middle" class="th">多指令流 · 多数据流</text><text x="1150" y="655" text-anchor="middle" class="tx">多个执行者各自运行不同任务</text><text x="1150" y="691" text-anchor="middle" class="tx">多核 / 多处理器最常见</text><rect x="330" y="782" width="840" height="50" rx="16" fill="#f4f1eb" stroke="#c5bcaf"/><text x="750" y="814" text-anchor="middle" class="tx">缩写直接拆：S=Single　M=Multiple　I=Instruction　D=Data</text></svg>