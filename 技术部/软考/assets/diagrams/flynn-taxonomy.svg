<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" font-size="30" font-family="sans-serif" fill="#0f172a">Flynn 分类：指令流 × 数据流</text>
  <text x="600" y="93" text-anchor="middle" font-size="20" font-family="sans-serif" fill="#475569">先问有几条 Instruction Stream，再问有几条 Data Stream</text>
  <text x="455" y="145" text-anchor="middle" font-size="23" font-family="sans-serif" fill="#334155">Single Data</text>
  <text x="855" y="145" text-anchor="middle" font-size="23" font-family="sans-serif" fill="#334155">Multiple Data</text>
  <text x="160" y="290" text-anchor="middle" font-size="23" font-family="sans-serif" fill="#334155" transform="rotate(-90 160 290)">Single Instruction</text>
  <text x="160" y="545" text-anchor="middle" font-size="23" font-family="sans-serif" fill="#334155" transform="rotate(-90 160 545)">Multiple Instruction</text>
  <rect x="255" y="180" width="390" height="220" rx="24" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/>
  <text x="450" y="235" text-anchor="middle" font-size="34" font-weight="700" font-family="sans-serif" fill="#0e7490">SISD</text>
  <text x="450" y="280" text-anchor="middle" font-size="20" font-family="sans-serif" fill="#334155">单指令流 · 单数据流</text>
  <text x="450" y="330" text-anchor="middle" font-size="19" font-family="sans-serif" fill="#475569">一个执行序列处理一份数据</text>
  <rect x="655" y="180" width="390" height="220" rx="24" fill="#eef2ff" stroke="#6366f1" stroke-width="3"/>
  <text x="850" y="235" text-anchor="middle" font-size="34" font-weight="700" font-family="sans-serif" fill="#4f46e5">SIMD</text>
  <text x="850" y="280" text-anchor="middle" font-size="20" font-family="sans-serif" fill="#334155">单指令流 · 多数据流</text>
  <text x="850" y="325" text-anchor="middle" font-size="19" font-family="sans-serif" fill="#475569">同一操作并行作用于大量数据</text>
  <text x="850" y="358" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#4f46e5">图像 / 向量 / 矩阵数据并行</text>
  <rect x="255" y="420" width="390" height="220" rx="24" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/>
  <text x="450" y="475" text-anchor="middle" font-size="34" font-weight="700" font-family="sans-serif" fill="#b45309">MISD</text>
  <text x="450" y="520" text-anchor="middle" font-size="20" font-family="sans-serif" fill="#334155">多指令流 · 单数据流</text>
  <text x="450" y="570" text-anchor="middle" font-size="19" font-family="sans-serif" fill="#475569">通用系统中较少作为典型形式</text>
  <rect x="655" y="420" width="390" height="220" rx="24" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
  <text x="850" y="475" text-anchor="middle" font-size="34" font-weight="700" font-family="sans-serif" fill="#15803d">MIMD</text>
  <text x="850" y="520" text-anchor="middle" font-size="20" font-family="sans-serif" fill="#334155">多指令流 · 多数据流</text>
  <text x="850" y="565" text-anchor="middle" font-size="19" font-family="sans-serif" fill="#475569">多核 / 多处理器独立执行不同任务</text>
</svg>
