<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520"><rect width="100%" height="100%" fill="#f8fafc"/><text x="600" y="45" text-anchor="middle" font-size="30" font-family="sans-serif">SJF：短任务放前面会降低总等待</text><text x="280" y="110" text-anchor="middle" font-size="23" font-family="sans-serif" fill="#991b1b">A(a) → B(b)，a &gt; b</text><rect x="80" y="150" width="330" height="85" fill="#fee2e2" stroke="#ef4444"/><text x="245" y="202" text-anchor="middle" font-size="22" font-family="sans-serif">A：执行 a</text><rect x="410" y="150" width="180" height="85" fill="#ffedd5" stroke="#f97316"/><text x="500" y="202" text-anchor="middle" font-size="22" font-family="sans-serif">B：执行 b</text><text x="335" y="275" text-anchor="middle" font-size="20" font-family="sans-serif">总等待 = 2T + a</text><text x="900" y="110" text-anchor="middle" font-size="23" font-family="sans-serif" fill="#166534">B(b) → A(a)</text><rect x="700" y="150" width="180" height="85" fill="#dcfce7" stroke="#22c55e"/><text x="790" y="202" text-anchor="middle" font-size="22" font-family="sans-serif">B：执行 b</text><rect x="880" y="150" width="260" height="85" fill="#e0f2fe" stroke="#0ea5e9"/><text x="1010" y="202" text-anchor="middle" font-size="22" font-family="sans-serif">A：执行 a</text><text x="920" y="275" text-anchor="middle" font-size="20" font-family="sans-serif">总等待 = 2T + b</text><rect x="170" y="345" width="860" height="100" rx="18" fill="#eef2ff" stroke="#6366f1"/><text x="600" y="390" text-anchor="middle" font-size="24" font-family="sans-serif" fill="#3730a3">因为 b &lt; a，所以 2T+b &lt; 2T+a</text><text x="600" y="425" text-anchor="middle" font-size="18" font-family="sans-serif">不断交换“长在前、短在后”的逆序，最终得到从短到长的SJF</text></svg>