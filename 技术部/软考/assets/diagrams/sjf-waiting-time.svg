<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="t d"><title id="t">SJF平均等待时间证明</title><desc id="d">比较长任务在前与短任务在前的两个相邻调度顺序，说明短任务前置会降低总等待时间</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 23px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:18px 'Microsoft YaHei',sans-serif;fill:#665e57}.em{font:700 22px 'Microsoft YaHei',sans-serif;fill:#6d6256}</style></defs><rect width="1500" height="760" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">SJF · 为什么平均等待时间最短</text><text x="65" y="110" class="sub">核心不是死记结论，而是比较一对相邻任务：只要“长在前、短在后”，交换后二者总等待就会下降</text><g filter="url(#s)"><rect x="90" y="200" width="610" height="330" rx="28" fill="#eee9e2" stroke="#b9a38f"/><rect x="800" y="200" width="610" height="330" rx="28" fill="#eef0e8" stroke="#aeb79b"/></g><text x="395" y="255" text-anchor="middle" class="th">顺序一：A(a) → B(b)，且 a &gt; b</text><rect x="155" y="315" width="290" height="72" rx="16" fill="#f4f1eb" stroke="#c5bcaf"/><rect x="445" y="315" width="180" height="72" rx="16" fill="#eee6e3" stroke="#b39b95"/><text x="300" y="360" text-anchor="middle" class="tx">A 执行 a</text><text x="535" y="360" text-anchor="middle" class="tx">B 执行 b</text><text x="395" y="435" text-anchor="middle" class="tx">A等待 T；B等待 T + a</text><text x="395" y="475" text-anchor="middle" class="em">总等待 = 2T + a</text><text x="1105" y="255" text-anchor="middle" class="th">顺序二：B(b) → A(a)</text><rect x="875" y="315" width="180" height="72" rx="16" fill="#e7edec" stroke="#9cadaa"/><rect x="1055" y="315" width="290" height="72" rx="16" fill="#f4f1eb" stroke="#c5bcaf"/><text x="965" y="360" text-anchor="middle" class="tx">B 执行 b</text><text x="1200" y="360" text-anchor="middle" class="tx">A 执行 a</text><text x="1105" y="435" text-anchor="middle" class="tx">B等待 T；A等待 T + b</text><text x="1105" y="475" text-anchor="middle" class="em">总等待 = 2T + b</text><rect x="245" y="600" width="1010" height="95" rx="22" fill="#ebe8ef" stroke="#a89fb0"/><text x="750" y="638" text-anchor="middle" class="th">因为 b &lt; a，所以 2T+b &lt; 2T+a</text><text x="750" y="670" text-anchor="middle" class="tx">不断消除“长任务排在短任务前”的逆序，最终得到从短到长排列，也就是SJF</text></svg>