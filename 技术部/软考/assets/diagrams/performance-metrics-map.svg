<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="t d"><title id="t">计算机性能指标之间的因果关系</title><desc id="d">从程序工作负载、指令条数、CPI和主频逐层得到CPU执行时间，并区分响应时间与吞吐率。</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 23px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:18px 'Microsoft YaHei',sans-serif;fill:#665e57}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1500" height="820" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">程序执行时间是多层因素共同作用的结果</text><text x="65" y="110" class="sub">主频只是其中一项，指令条数和每条指令平均需要的周期同样会改变最终性能</text><g filter="url(#s)"><rect x="70" y="205" width="245" height="160" rx="24" fill="#eef0e7" stroke="#aab397"/><rect x="390" y="205" width="245" height="160" rx="24" fill="#e8efed" stroke="#9bb3ad"/><rect x="710" y="205" width="245" height="160" rx="24" fill="#eee7e2" stroke="#baa495"/><rect x="1030" y="205" width="245" height="160" rx="24" fill="#e9e5ef" stroke="#aaa1b8"/><rect x="515" y="485" width="470" height="175" rx="28" fill="#f0e7e3" stroke="#c1a196"/></g><text x="192" y="255" text-anchor="middle" class="th">程序与算法</text><text x="192" y="296" text-anchor="middle" class="tx">需要完成多少工作</text><text x="192" y="326" text-anchor="middle" class="tx">编译器怎样翻译</text><text x="512" y="255" text-anchor="middle" class="th">指令条数</text><text x="512" y="296" text-anchor="middle" class="tx">真正执行多少条</text><text x="512" y="326" text-anchor="middle" class="tx">机器指令</text><text x="832" y="255" text-anchor="middle" class="th">平均 CPI</text><text x="832" y="296" text-anchor="middle" class="tx">每条指令平均</text><text x="832" y="326" text-anchor="middle" class="tx">需要多少周期</text><text x="1152" y="255" text-anchor="middle" class="th">主频</text><text x="1152" y="296" text-anchor="middle" class="tx">每秒有多少</text><text x="1152" y="326" text-anchor="middle" class="tx">时钟周期</text><path d="M315 285H380" class="ln"/><path d="M635 285H700" class="ln"/><path d="M955 285H1020" class="ln"/><path d="M512 375V470" class="ln"/><path d="M832 375V470" class="ln"/><path d="M1152 375C1152 430 1040 445 965 495" class="ln"/><text x="750" y="540" text-anchor="middle" class="th">CPU执行时间 = 指令条数 × CPI ÷ 主频</text><text x="750" y="585" text-anchor="middle" class="tx">单个任务进一步表现为响应时间</text><text x="750" y="620" text-anchor="middle" class="tx">大量并发任务还需要观察系统吞吐率</text></svg>