<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="840" viewBox="0 0 1500 840" role="img" aria-labelledby="t d"><title id="t">三种文件磁盘块分配方式</title><desc id="d">比较连续分配、链接分配和索引分配的数据块位置及寻址结构。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 22px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:17px 'Microsoft YaHei',sans-serif;fill:#665e57}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1500" height="840" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">同一个文件可以用不同方式落到磁盘块</text><text x="65" y="110" class="sub">差别在于数据块是否连续，以及文件系统怎样从逻辑块号找到物理块</text><rect x="65" y="180" width="1370" height="170" rx="28" fill="#eef0e7" stroke="#aab397"/><text x="115" y="225" class="th">连续分配</text><text x="115" y="265" class="tx">记录起始块和长度，数据块连续</text><g fill="#c8d2c0" stroke="#8fa082"><rect x="585" y="215" width="100" height="75" rx="12"/><rect x="700" y="215" width="100" height="75" rx="12"/><rect x="815" y="215" width="100" height="75" rx="12"/><rect x="930" y="215" width="100" height="75" rx="12"/></g><text x="635" y="260" text-anchor="middle" class="tx">100</text><text x="750" y="260" text-anchor="middle" class="tx">101</text><text x="865" y="260" text-anchor="middle" class="tx">102</text><text x="980" y="260" text-anchor="middle" class="tx">103</text><rect x="65" y="385" width="1370" height="170" rx="28" fill="#e8efed" stroke="#9bb3ad"/><text x="115" y="430" class="th">链接分配</text><text x="115" y="470" class="tx">块可离散，每块或FAT记录下一块</text><g fill="#c6d7d3" stroke="#8ca8a2"><rect x="545" y="420" width="100" height="75" rx="12"/><rect x="755" y="420" width="100" height="75" rx="12"/><rect x="965" y="420" width="100" height="75" rx="12"/><rect x="1175" y="420" width="100" height="75" rx="12"/></g><text x="595" y="465" text-anchor="middle" class="tx">17</text><text x="805" y="465" text-anchor="middle" class="tx">82</text><text x="1015" y="465" text-anchor="middle" class="tx">9</text><text x="1225" y="465" text-anchor="middle" class="tx">301</text><path d="M645 458H745" class="ln"/><path d="M855 458H955" class="ln"/><path d="M1065 458H1165" class="ln"/><rect x="65" y="590" width="1370" height="180" rx="28" fill="#eee7e2" stroke="#baa495"/><text x="115" y="635" class="th">索引分配</text><text x="115" y="675" class="tx">索引块集中保存数据块地址</text><rect x="515" y="620" width="180" height="110" rx="18" fill="#d9c9bd" stroke="#aa8f7e"/><text x="605" y="665" text-anchor="middle" class="th">索引块</text><text x="605" y="700" text-anchor="middle" class="tx">17 / 82 / 9 / 301</text><g fill="#e6ddd7" stroke="#b49c8d"><rect x="835" y="620" width="100" height="75" rx="12"/><rect x="970" y="665" width="100" height="75" rx="12"/><rect x="1105" y="610" width="100" height="75" rx="12"/><rect x="1240" y="670" width="100" height="75" rx="12"/></g><path d="M695 670C750 645 775 648 825 658" class="ln"/></svg>