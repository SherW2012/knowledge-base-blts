<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 660" role="img" aria-labelledby="title desc">
  <title id="title">自注意力：三个向量的由来与加权求和</title><desc id="desc">同一个 token 向量分别乘三个矩阵得到 Query、Key、Value；用 Query 与各位置的 Key 打分、softmax 成权重，再对各位置的 Value 加权求和</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4f493f" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c7a74"/></marker>
    <style>
      .title{font:700 23px Inter,'Microsoft YaHei',sans-serif;fill:#292724}.subtitle{font:400 13px Inter,'Microsoft YaHei',sans-serif;fill:#7c766d}
      .panel{font:700 14px Inter,'Microsoft YaHei',sans-serif;fill:#8b8479}
      .nt{font:700 15px Inter,'Microsoft YaHei',sans-serif}.ns{font:400 12.5px Inter,'Microsoft YaHei',sans-serif;fill:#6f6a62}
      .num{font:600 12.5px 'Cascadia Code',Consolas,monospace;fill:#514c45}.lbl{font:700 14px Inter,sans-serif}.wl{font:600 12px Inter,'Microsoft YaHei',sans-serif;fill:#716b63}
    </style>
  </defs>
  <rect width="940" height="660" rx="24" fill="#fbfaf7"/>
  <text x="48" y="46" class="title">自注意力：三个向量的由来与加权求和</text>
  <text x="48" y="72" class="subtitle">维度用 2 维示意，实际每个头常 64～128 维</text>

  <text x="56" y="118" class="panel">① 三个向量的由来：同一个 token 向量，分别乘三个学出来的矩阵</text>
  <rect x="56" y="150" width="150" height="62" rx="13" fill="#e4ebe5" stroke="#5b695f" filter="url(#shadow)"/><text x="131" y="178" class="nt" text-anchor="middle" fill="#4c5a4c">token 向量</text><text x="131" y="199" class="num" text-anchor="middle">[0.5, 0.9]</text>

  <path d="M206 172 L 322 158" fill="none" stroke="#7c7a74" stroke-width="1.6" marker-end="url(#arrow)"/><text x="250" y="150" class="wl">× W_Q</text>
  <path d="M206 181 L 322 214" fill="none" stroke="#7c7a74" stroke-width="1.6" marker-end="url(#arrow)"/><text x="250" y="204" class="wl">× W_K</text>
  <path d="M206 190 L 322 270" fill="none" stroke="#7c7a74" stroke-width="1.6" marker-end="url(#arrow)"/><text x="250" y="262" class="wl">× W_V</text>

  <rect x="326" y="140" width="128" height="40" rx="10" fill="#eee6e3" stroke="#6f5c54"/><text x="390" y="165" class="lbl" text-anchor="middle" fill="#6f5c54">Query</text>
  <rect x="326" y="196" width="128" height="40" rx="10" fill="#e7ebeb" stroke="#536363"/><text x="390" y="221" class="lbl" text-anchor="middle" fill="#536363">Key</text>
  <rect x="326" y="252" width="128" height="40" rx="10" fill="#eee9df" stroke="#6d6250"/><text x="390" y="277" class="lbl" text-anchor="middle" fill="#6d6250">Value</text>

  <text x="476" y="165" class="ns">当前位置“想找什么信息”</text>
  <text x="476" y="221" class="ns">每个位置“以什么特征被检索”</text>
  <text x="476" y="277" class="ns">被选中后“实际传出的内容”</text>

  <line x1="48" y1="322" x2="892" y2="322" stroke="#e2ded5"/>
  <text x="56" y="356" class="panel">② 当前位置的输出 = 对各位置 Value 的加权求和</text>

  <rect x="56" y="384" width="164" height="60" rx="13" fill="#eee6e3" stroke="#6f5c54" filter="url(#shadow)"/><text x="138" y="410" class="nt" text-anchor="middle" fill="#6f5c54">当前 Query</text><text x="138" y="431" class="num" text-anchor="middle">q = [1.0, 0.2]</text>

  <rect x="300" y="378" width="300" height="38" rx="9" fill="#f4f2ed" stroke="#cbc7ba"/><text x="316" y="402" class="ns">位置“猫”　K=[0.9, 0.1]　V=[2, 0]</text>
  <rect x="300" y="424" width="300" height="38" rx="9" fill="#f4f2ed" stroke="#cbc7ba"/><text x="316" y="448" class="ns">位置“坐”　K=[0.2, 0.8]　V=[0, 3]</text>
  <rect x="300" y="470" width="300" height="38" rx="9" fill="#f4f2ed" stroke="#cbc7ba"/><text x="316" y="494" class="ns">位置“垫”　K=[1.0, 0.3]　V=[1, 1]</text>

  <path d="M220 408 L 296 397" fill="none" stroke="#b39b95" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M220 414 L 296 443" fill="none" stroke="#b39b95" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M220 420 L 296 489" fill="none" stroke="#b39b95" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="642" y="366" class="wl">q·K 分数</text><text x="762" y="366" class="wl">softmax 权重</text>
  <text x="642" y="402" class="num">0.92</text><text x="778" y="402" class="num">0.37</text>
  <text x="642" y="448" class="num">0.36</text><text x="778" y="448" class="num">0.21</text>
  <text x="642" y="494" class="num">1.06</text><text x="778" y="494" class="num">0.42</text>

  <rect x="56" y="536" width="828" height="96" rx="16" fill="#e7ebe3" stroke="#9da58b" filter="url(#shadow)"/>
  <text x="80" y="568" class="nt" fill="#59604e">输出 = 0.37×[2,0] + 0.21×[0,3] + 0.42×[1,1] = [1.16, 1.05]</text>
  <text x="80" y="594" class="ns">Query 与某位置的 Key 越匹配（分数越高），该位置的 Value 在输出里占比越大。</text>
  <text x="80" y="616" class="ns">这里“垫”的匹配度最高（权重 0.42），所以输出最靠近它的 Value——这就是“加权求和”。</text>
</svg>
