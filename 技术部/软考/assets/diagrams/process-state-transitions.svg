<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">进程五状态模型及挂起扩展</title>
  <desc id="desc">展示新建、就绪、执行、阻塞和终止五个基本状态之间的转换，并在下方展示就绪挂起和阻塞挂起。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#40372f" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#91887d"/></marker>
    <style>
      .title{font:700 40px "Microsoft YaHei","PingFang SC",sans-serif;fill:#22201d}.sub{font:20px "Microsoft YaHei","PingFang SC",sans-serif;fill:#786f66}.h{font:700 25px "Microsoft YaHei","PingFang SC",sans-serif;fill:#5d554d}.t{font:19px "Microsoft YaHei","PingFang SC",sans-serif;fill:#6d645c}.tag{font:700 18px "Microsoft YaHei","PingFang SC",sans-serif;fill:#675e55}.line{fill:none;stroke:#91887d;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#a79e94;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1500" height="900" rx="38" fill="#fbfaf7"/>
  <text x="70" y="78" class="title">进程状态取决于运行条件、CPU和等待事件</text>
  <text x="70" y="116" class="sub">失去CPU但仍可运行时回到就绪；等待事件时进入阻塞；挂起表示暂不参加正常调度</text>

  <g filter="url(#shadow)">
    <rect x="70" y="245" width="210" height="120" rx="60" fill="#eee9df" stroke="#b7a98e" stroke-width="1.8"/>
    <rect x="390" y="205" width="260" height="160" rx="28" fill="#e7edec" stroke="#9cadaa" stroke-width="1.8"/>
    <rect x="770" y="205" width="260" height="160" rx="28" fill="#f0e8e4" stroke="#b89e94" stroke-width="1.8"/>
    <rect x="580" y="465" width="260" height="160" rx="28" fill="#ebe8ef" stroke="#a89fb0" stroke-width="1.8"/>
    <rect x="1190" y="245" width="240" height="120" rx="60" fill="#eee9df" stroke="#b7a98e" stroke-width="1.8"/>
  </g>
  <text x="175" y="295" text-anchor="middle" class="h">新建</text><text x="175" y="330" text-anchor="middle" class="t">初始化进程</text>
  <text x="520" y="260" text-anchor="middle" class="h">就绪</text><text x="520" y="300" text-anchor="middle" class="t">已经具备运行条件</text><text x="520" y="334" text-anchor="middle" class="tag">只等待CPU</text>
  <text x="900" y="260" text-anchor="middle" class="h">执行</text><text x="900" y="300" text-anchor="middle" class="t">正在CPU上运行</text><text x="900" y="334" text-anchor="middle" class="tag">占用处理机</text>
  <text x="710" y="520" text-anchor="middle" class="h">阻塞</text><text x="710" y="560" text-anchor="middle" class="t">等待I/O、锁或事件</text><text x="710" y="594" text-anchor="middle" class="tag">得到CPU也不能继续</text>
  <text x="1310" y="295" text-anchor="middle" class="h">终止</text><text x="1310" y="330" text-anchor="middle" class="t">执行结束并回收资源</text>

  <path d="M280 305 H390" class="line"/><text x="335" y="286" text-anchor="middle" class="tag">创建完成</text>
  <path d="M650 250 H770" class="line"/><text x="710" y="232" text-anchor="middle" class="tag">调度</text>
  <path d="M770 330 H650" class="line"/><text x="710" y="357" text-anchor="middle" class="tag">抢占 / 时间片到</text>
  <path d="M855 365 C835 420,790 446,760 465" class="line"/><text x="860" y="424" class="tag">等待事件</text>
  <path d="M650 465 C590 430,550 405,535 365" class="line"/><text x="505" y="430" class="tag">事件完成</text>
  <path d="M1030 285 H1190" class="line"/><text x="1110" y="266" text-anchor="middle" class="tag">退出 / 被终止</text>

  <text x="70" y="695" class="h">挂起扩展</text>
  <g filter="url(#shadow)">
    <rect x="350" y="720" width="330" height="115" rx="25" fill="#e1e8e6" stroke="#9cadaa" stroke-width="1.5"/>
    <rect x="820" y="720" width="330" height="115" rx="25" fill="#e7e3eb" stroke="#a89fb0" stroke-width="1.5"/>
  </g>
  <text x="515" y="765" text-anchor="middle" class="h">就绪挂起</text><text x="515" y="803" text-anchor="middle" class="t">能运行，但暂不参加调度</text>
  <text x="985" y="765" text-anchor="middle" class="h">阻塞挂起</text><text x="985" y="803" text-anchor="middle" class="t">等待事件，同时处于挂起</text>
  <path d="M470 365 C430 520,440 625,490 720" class="dash"/><text x="405" y="568" class="tag">挂起</text>
  <path d="M580 720 C620 625,600 520,555 365" class="dash"/><text x="590" y="655" class="tag">激活</text>
  <path d="M690 625 C740 670,845 690,900 720" class="dash"/><text x="742" y="684" class="tag">挂起</text>
  <path d="M1040 720 C920 660,825 630,780 625" class="dash"/><text x="920" y="668" class="tag">激活</text>
  <path d="M820 778 H680" class="dash"/><text x="750" y="807" text-anchor="middle" class="tag">等待事件完成</text>
</svg>

