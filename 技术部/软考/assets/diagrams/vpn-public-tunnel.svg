<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="t d"><title id="t">VPN访问公网的隧道原理</title><desc id="d">电脑通过VPN虚拟网卡生成内层业务包，再封装为到VPN服务器的外层公网包，VPN服务器解封装后访问最终网站</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 22px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:18px 'Microsoft YaHei',sans-serif;fill:#665e57}.em{font:700 17px 'Microsoft YaHei',sans-serif;fill:#6d6256}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1500" height="900" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">VPN 访问公网 · 原始业务包外面再套一个公网包</text><text x="65" y="110" class="sub">公网负责送“外层包”到VPN服务器；VPN服务器拆开后，才继续处理真正的目标网站</text><g filter="url(#s)"><rect x="60" y="225" width="300" height="235" rx="28" fill="#e7edec" stroke="#9cadaa"/><rect x="445" y="195" width="360" height="295" rx="30" fill="#eee9e2" stroke="#b9a38f"/><rect x="890" y="225" width="280" height="235" rx="28" fill="#ebe8ef" stroke="#a89fb0"/><rect x="1250" y="225" width="190" height="235" rx="28" fill="#eef0e8" stroke="#aeb79b"/></g><text x="210" y="280" text-anchor="middle" class="th">你的电脑</text><text x="210" y="323" text-anchor="middle" class="tx">本地：192.168.10.20</text><text x="210" y="358" text-anchor="middle" class="tx">VPN虚拟IP：10.8.0.2</text><text x="210" y="405" text-anchor="middle" class="em">真正目标：8.8.8.8</text><text x="625" y="252" text-anchor="middle" class="th">本地网络 + 公网</text><text x="625" y="300" text-anchor="middle" class="tx">外层源：1.1.1.1</text><text x="625" y="335" text-anchor="middle" class="tx">外层目标：3.3.3.3</text><text x="625" y="382" text-anchor="middle" class="em">里面加密装着：</text><text x="625" y="418" text-anchor="middle" class="tx">10.8.0.2 → 8.8.8.8</text><text x="1030" y="280" text-anchor="middle" class="th">VPN 服务器</text><text x="1030" y="323" text-anchor="middle" class="tx">公网IP：3.3.3.3</text><text x="1030" y="365" text-anchor="middle" class="em">解密 / 解封装</text><text x="1030" y="408" text-anchor="middle" class="tx">再向 8.8.8.8 转发</text><text x="1345" y="280" text-anchor="middle" class="th">目标网站</text><text x="1345" y="323" text-anchor="middle" class="tx">8.8.8.8</text><text x="1345" y="365" text-anchor="middle" class="em">看到VPN出口来源</text><path d="M360 342H435" class="ln"/><path d="M805 342H880" class="ln"/><path d="M1170 342H1240" class="ln"/><g filter="url(#s)"><rect x="150" y="585" width="1200" height="205" rx="30" fill="#fbfaf7" stroke="#b9a38f"/></g><text x="205" y="633" class="th">两层 IP</text><text x="205" y="680" class="em">内层业务包：</text><text x="390" y="680" class="tx">10.8.0.2 → 8.8.8.8　（真正想访问谁）</text><text x="205" y="725" class="em">外层隧道包：</text><text x="390" y="725" class="tx">1.1.1.1 → 3.3.3.3　（公网实际负责送到哪台VPN服务器）</text><text x="205" y="765" class="tx">VPN不是把原目标“改成3.3.3.3”，而是给原始包再加一层新的IP头。</text></svg>