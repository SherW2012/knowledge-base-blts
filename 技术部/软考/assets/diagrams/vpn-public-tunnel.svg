<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="t d"><title id="t">VPN访问公网的隧道封装</title><desc id="d">VPN客户端把内层业务分组加密并封装为以VPN服务器公网地址为目标的外层报文，VPN服务器解封装后再访问最终公网服务器</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 22px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:18px 'Microsoft YaHei',sans-serif;fill:#665e57}.em{font:700 17px 'Microsoft YaHei',sans-serif;fill:#6d6256}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1500" height="900" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">VPN 隧道 · 内层业务寻址与外层公网寻址同时存在</text><text x="65" y="110" class="sub">外层报文负责把加密流量送到VPN端点；解封装后恢复内层业务分组并继续路由</text><g filter="url(#s)"><rect x="60" y="225" width="300" height="235" rx="28" fill="#e7edec" stroke="#9cadaa"/><rect x="445" y="195" width="360" height="295" rx="30" fill="#eee9e2" stroke="#b9a38f"/><rect x="890" y="225" width="280" height="235" rx="28" fill="#ebe8ef" stroke="#a89fb0"/><rect x="1250" y="225" width="190" height="235" rx="28" fill="#eef0e8" stroke="#aeb79b"/></g><text x="210" y="280" text-anchor="middle" class="th">VPN 客户端</text><text x="210" y="323" text-anchor="middle" class="tx">本地：192.168.10.20</text><text x="210" y="358" text-anchor="middle" class="tx">虚拟IP：10.8.0.2</text><text x="210" y="405" text-anchor="middle" class="em">业务目标：192.0.2.80</text><text x="625" y="252" text-anchor="middle" class="th">本地网络 + Internet</text><text x="625" y="300" text-anchor="middle" class="tx">外层源：203.0.113.10</text><text x="625" y="335" text-anchor="middle" class="tx">外层目标：198.51.100.20</text><text x="625" y="382" text-anchor="middle" class="em">载荷：</text><text x="625" y="418" text-anchor="middle" class="tx">加密后的 10.8.0.2 → 192.0.2.80</text><text x="1030" y="280" text-anchor="middle" class="th">VPN 服务器</text><text x="1030" y="323" text-anchor="middle" class="tx">公网IP：198.51.100.20</text><text x="1030" y="365" text-anchor="middle" class="em">认证 / 解密 / 解封装</text><text x="1030" y="408" text-anchor="middle" class="tx">恢复业务目标 192.0.2.80</text><text x="1345" y="280" text-anchor="middle" class="th">公网服务器</text><text x="1345" y="323" text-anchor="middle" class="tx">192.0.2.80</text><text x="1345" y="365" text-anchor="middle" class="em">接收VPN出口流量</text><path d="M360 342H435" class="ln"/><path d="M805 342H880" class="ln"/><path d="M1170 342H1240" class="ln"/><g filter="url(#s)"><rect x="150" y="585" width="1200" height="205" rx="30" fill="#fbfaf7" stroke="#b9a38f"/></g><text x="205" y="633" class="th">两层寻址</text><text x="205" y="680" class="em">内层业务分组：</text><text x="390" y="680" class="tx">10.8.0.2 → 192.0.2.80　描述最终业务通信</text><text x="205" y="725" class="em">外层隧道报文：</text><text x="390" y="725" class="tx">203.0.113.10 → 198.51.100.20　描述公网中的VPN端点通信</text><text x="205" y="765" class="tx">隧道封装增加新的外层头部，不是把内层业务目标替换成VPN服务器。</text></svg>