<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="t d">
  <title id="t">B加树索引定位数据页</title><desc id="d">从根结点经过内部结点到叶结点，再定位数据页的过程</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 21px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:17px 'Microsoft YaHei',sans-serif;fill:#665e57}.key{font:700 18px Consolas,'Microsoft YaHei',sans-serif;fill:#504a44}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}.leaf{fill:none;stroke:#7f9d96;stroke-width:3;marker-end:url(#a)}</style></defs>
  <rect width="1500" height="850" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">B+树先缩小键值范围，再从叶结点定位数据</text><text x="65" y="110" class="sub">有序叶结点还支持连续范围扫描，不必为范围中的每个键重新从根查找</text>
  <g filter="url(#s)"><rect x="610" y="160" width="280" height="90" rx="22" fill="#eee9e2" stroke="#b9a38f"/><rect x="260" y="340" width="300" height="90" rx="22" fill="#e6efed" stroke="#94afa9"/><rect x="940" y="340" width="300" height="90" rx="22" fill="#e6efed" stroke="#94afa9"/><rect x="100" y="540" width="300" height="100" rx="22" fill="#eef0e8" stroke="#aeb79b"/><rect x="440" y="540" width="300" height="100" rx="22" fill="#eef0e8" stroke="#aeb79b"/><rect x="780" y="540" width="300" height="100" rx="22" fill="#eef0e8" stroke="#aeb79b"/><rect x="1120" y="540" width="300" height="100" rx="22" fill="#eef0e8" stroke="#aeb79b"/></g>
  <text x="750" y="195" text-anchor="middle" class="th">根结点</text><text x="750" y="228" text-anchor="middle" class="key">60</text>
  <text x="410" y="375" text-anchor="middle" class="th">内部结点</text><text x="410" y="408" text-anchor="middle" class="key">40</text>
  <text x="1090" y="375" text-anchor="middle" class="th">内部结点</text><text x="1090" y="408" text-anchor="middle" class="key">80</text>
  <text x="250" y="578" text-anchor="middle" class="th">叶结点</text><text x="250" y="615" text-anchor="middle" class="key">10 20 30</text>
  <text x="590" y="578" text-anchor="middle" class="th">叶结点</text><text x="590" y="615" text-anchor="middle" class="key">40 50</text>
  <text x="930" y="578" text-anchor="middle" class="th">叶结点</text><text x="930" y="615" text-anchor="middle" class="key">60 70</text>
  <text x="1270" y="578" text-anchor="middle" class="th">叶结点</text><text x="1270" y="615" text-anchor="middle" class="key">80 90</text>
  <path d="M690 250L460 330" class="ln"/><path d="M810 250L1040 330" class="ln"/><path d="M350 430L275 530" class="ln"/><path d="M470 430L565 530" class="ln"/><path d="M1030 430L955 530" class="ln"/><path d="M1150 430L1250 530" class="ln"/><path d="M400 590H430" class="leaf"/><path d="M740 590H770" class="leaf"/><path d="M1080 590H1110" class="leaf"/>
  <rect x="300" y="720" width="900" height="75" rx="20" fill="#f4f1eb" stroke="#c5bcaf"/><text x="750" y="752" text-anchor="middle" class="th">叶结点保存有序键和行定位信息</text><text x="750" y="780" text-anchor="middle" class="tx">命中索引后再访问目标数据页；覆盖索引查询有时可以直接从索引返回结果</text>
</svg>
