<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="t d">
  <title id="t">ABSD以体系结构为中心的六个活动</title><desc id="d">体系结构需求、设计、文档化、复审、实现和演化形成带反馈的开发闭环</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.num{font:700 18px 'Microsoft YaHei',sans-serif;fill:#9b6558}.th{font:700 22px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:17px 'Microsoft YaHei',sans-serif;fill:#665e57}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}.back{fill:none;stroke:#b09282;stroke-width:2.5;stroke-dasharray:9 8;marker-end:url(#a)}</style></defs>
  <rect width="1500" height="900" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">ABSD把设计、评审、实现和演化组织成闭环</text><text x="65" y="110" class="sub">六项活动有主要推进顺序，但评审、实现和环境变化都会触发反馈</text>
  <g filter="url(#s)"><rect x="85" y="190" width="360" height="185" rx="27" fill="#eef0e8" stroke="#aeb79b"/><rect x="570" y="190" width="360" height="185" rx="27" fill="#e6efed" stroke="#94afa9"/><rect x="1055" y="190" width="360" height="185" rx="27" fill="#eee9e2" stroke="#b9a38f"/><rect x="1055" y="520" width="360" height="185" rx="27" fill="#ebe7f0" stroke="#aaa0bf"/><rect x="570" y="520" width="360" height="185" rx="27" fill="#f1e7e3" stroke="#c1a095"/><rect x="85" y="520" width="360" height="185" rx="27" fill="#f0ece3" stroke="#b8aa8d"/></g>
  <text x="120" y="230" class="num">01</text><text x="265" y="245" text-anchor="middle" class="th">体系结构需求</text><text x="265" y="290" text-anchor="middle" class="tx">识别架构重要需求</text><text x="265" y="325" text-anchor="middle" class="tx">形成场景、约束和优先级</text>
  <text x="605" y="230" class="num">02</text><text x="750" y="245" text-anchor="middle" class="th">体系结构设计</text><text x="750" y="290" text-anchor="middle" class="tx">选择风格与战术</text><text x="750" y="325" text-anchor="middle" class="tx">确定构件、接口和连接</text>
  <text x="1090" y="230" class="num">03</text><text x="1235" y="245" text-anchor="middle" class="th">体系结构文档化</text><text x="1235" y="290" text-anchor="middle" class="tx">使用多个视图表达关注点</text><text x="1235" y="325" text-anchor="middle" class="tx">记录决策、约束与理由</text>
  <text x="1090" y="560" class="num">04</text><text x="1235" y="575" text-anchor="middle" class="th">体系结构复审</text><text x="1235" y="620" text-anchor="middle" class="tx">用场景检查风险和权衡</text><text x="1235" y="655" text-anchor="middle" class="tx">必要时返回需求或设计</text>
  <text x="605" y="560" class="num">05</text><text x="750" y="575" text-anchor="middle" class="th">体系结构实现</text><text x="750" y="620" text-anchor="middle" class="tx">按构件和接口约束开发</text><text x="750" y="655" text-anchor="middle" class="tx">持续检查架构一致性</text>
  <text x="120" y="560" class="num">06</text><text x="265" y="575" text-anchor="middle" class="th">体系结构演化</text><text x="265" y="620" text-anchor="middle" class="tx">分析变化影响并更新决策</text><text x="265" y="655" text-anchor="middle" class="tx">重新验证关键质量目标</text>
  <path d="M445 282H560" class="ln"/><path d="M930 282H1045" class="ln"/><path d="M1235 375V510" class="ln"/><path d="M1055 612H940" class="ln"/><path d="M570 612H455" class="ln"/><path d="M265 510V435C265 410 290 400 315 400H1185C1210 400 1235 410 1235 385" class="back"/>
  <path d="M265 705V785C265 820 300 835 335 835H1165C1200 835 1235 820 1235 715" class="back"/><text x="750" y="820" text-anchor="middle" class="sub">演化把新的业务、质量和技术变化重新带回需求、设计、文档和评审</text>
</svg>
