<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="t d"><title id="t">SEI架构质量与ISO产品质量的横向关系</title><desc id="d">ISO负责产品质量分类，SEI方法将重要属性转化为场景、战术和架构评价，两者共享部分质量词汇但层级不同。</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 26px 'Microsoft YaHei',sans-serif;fill:#48413b}.cap{font:700 18px 'Microsoft YaHei',sans-serif;fill:#514a44}.tx{font:17px 'Microsoft YaHei',sans-serif;fill:#665e57}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1500" height="850" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">同名质量词汇处在两种不同工作体系中</text><text x="65" y="110" class="sub">横向对照用于理解概念，不表示SEI必须复制ISO的特性树</text>
<g filter="url(#s)"><rect x="55" y="170" width="490" height="555" rx="31" fill="#eef0e7" stroke="#abb399"/><rect x="955" y="170" width="490" height="555" rx="31" fill="#e9e5ef" stroke="#aaa0b8"/><rect x="620" y="250" width="260" height="395" rx="28" fill="#f3f0e9" stroke="#b8afa3"/></g>
<text x="300" y="225" text-anchor="middle" class="th">ISO产品质量模型</text><text x="300" y="268" text-anchor="middle" class="cap">建立分类和统一术语</text><text x="105" y="325" class="tx">性能效率：一级特性</text><text x="105" y="365" class="tx">可用性：可靠性的子特性</text><text x="105" y="405" class="tx">可修改性：可维护性的子特性</text><text x="105" y="445" class="tx">可测试性：可维护性的子特性</text><text x="105" y="485" class="tx">信息安全性：一级特性</text><text x="105" y="525" class="tx">易用性或交互能力：一级特性</text><text x="300" y="615" text-anchor="middle" class="cap">回答：产品质量可以分成哪些方面</text><text x="300" y="660" text-anchor="middle" class="tx">用于需求完整性、测试范围和产品评价</text>
<text x="1200" y="225" text-anchor="middle" class="th">SEI架构质量方法</text><text x="1200" y="268" text-anchor="middle" class="cap">分析场景、决策、风险和权衡</text><text x="1005" y="325" class="tx">性能：延迟、吞吐和资源场景</text><text x="1005" y="365" class="tx">可用性：检测、恢复和持续服务场景</text><text x="1005" y="405" class="tx">可修改性：变化范围与工作量场景</text><text x="1005" y="445" class="tx">可测试性：控制、观察和定位场景</text><text x="1005" y="485" class="tx">安全性：攻击刺激和防护响应场景</text><text x="1005" y="525" class="tx">易用性：任务、错误和学习场景</text><text x="1200" y="615" text-anchor="middle" class="cap">回答：架构怎样实现并权衡重要质量</text><text x="1200" y="660" text-anchor="middle" class="tx">用于架构设计、技术风险和决策评价</text>
<text x="750" y="310" text-anchor="middle" class="th">共同词汇</text><text x="750" y="365" text-anchor="middle" class="tx">性能</text><text x="750" y="405" text-anchor="middle" class="tx">可用性</text><text x="750" y="445" text-anchor="middle" class="tx">安全性</text><text x="750" y="485" text-anchor="middle" class="tx">可修改性</text><text x="750" y="525" text-anchor="middle" class="tx">可测试性</text><text x="750" y="565" text-anchor="middle" class="tx">易用性</text><path d="M545 430H610" class="ln"/><path d="M880 430H945" class="ln"/><text x="750" y="785" text-anchor="middle" class="sub">ISO：分类产品质量　　SEI：把重要质量转化为可分析的架构问题</text></svg>
