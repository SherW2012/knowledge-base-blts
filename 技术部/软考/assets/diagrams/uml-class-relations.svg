<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="t d"><title id="t">UML类关系语义</title><desc id="d">比较泛化、实现、关联、聚合、组合和依赖的含义与典型方向。</desc><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 22px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:17px 'Microsoft YaHei',sans-serif;fill:#665e57}.line{stroke:#766f68;stroke-width:3;fill:none}.dash{stroke:#766f68;stroke-width:3;stroke-dasharray:9 7;fill:none}</style><rect width="1500" height="900" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">类关系真正要记的是结构语义和生命周期</text><text x="65" y="110" class="sub">箭头和菱形只是把这些语义固定成统一记号</text><g><rect x="80" y="190" width="420" height="190" rx="26" fill="#eef0e7" stroke="#aab397"/><rect x="540" y="190" width="420" height="190" rx="26" fill="#e8efed" stroke="#9bb3ad"/><rect x="1000" y="190" width="420" height="190" rx="26" fill="#eee7e2" stroke="#baa495"/><rect x="80" y="460" width="420" height="190" rx="26" fill="#e9e5ef" stroke="#aaa1b8"/><rect x="540" y="460" width="420" height="190" rx="26" fill="#f0e7e3" stroke="#c1a196"/><rect x="1000" y="460" width="420" height="190" rx="26" fill="#eef0e7" stroke="#aab397"/></g><text x="290" y="240" text-anchor="middle" class="th">泛化</text><text x="290" y="285" text-anchor="middle" class="tx">“是一种”继承关系</text><text x="290" y="325" text-anchor="middle" class="tx">Employee → Person</text><text x="750" y="240" text-anchor="middle" class="th">实现</text><text x="750" y="285" text-anchor="middle" class="tx">满足接口规定的契约</text><text x="750" y="325" text-anchor="middle" class="tx">实现类 → Interface</text><text x="1210" y="240" text-anchor="middle" class="th">关联</text><text x="1210" y="285" text-anchor="middle" class="tx">对象间稳定结构关系</text><text x="1210" y="325" text-anchor="middle" class="tx">Customer 1 —— * Order</text><text x="290" y="510" text-anchor="middle" class="th">聚合 ◇</text><text x="290" y="555" text-anchor="middle" class="tx">较弱整体—部分</text><text x="290" y="595" text-anchor="middle" class="tx">部分可独立存在</text><text x="750" y="510" text-anchor="middle" class="th">组合 ◆</text><text x="750" y="555" text-anchor="middle" class="tx">强整体—部分与生命周期所有权</text><text x="750" y="595" text-anchor="middle" class="tx">部分通常随整体存在</text><text x="1210" y="510" text-anchor="middle" class="th">依赖</text><text x="1210" y="555" text-anchor="middle" class="tx">临时使用另一个元素</text><text x="1210" y="595" text-anchor="middle" class="tx">参数、局部变量、调用</text><text x="750" y="780" text-anchor="middle" class="th">先判断语义，再匹配符号</text><text x="750" y="820" text-anchor="middle" class="tx">“菱形画哪边”的前提是先确定谁是整体，菱形永远位于整体一端</text></svg>