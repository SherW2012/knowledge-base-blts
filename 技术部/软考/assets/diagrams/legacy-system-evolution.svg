<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="880" viewBox="0 0 1500 880" role="img" aria-labelledby="t d"><title id="t">遗留系统业务价值与技术质量矩阵</title><desc id="d">根据业务价值和系统技术质量选择继续演化、再工程、合并下线或淘汰策略。</desc><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 22px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:17px 'Microsoft YaHei',sans-serif;fill:#665e57}.axis{stroke:#766f68;stroke-width:3}</style><rect width="1500" height="880" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">旧系统是否值得改造，要同时看价值和质量</text><text x="65" y="110" class="sub">“年代久”不是淘汰理由；关键是业务是否仍依赖它，以及技术结构还能否安全演化</text><line x1="280" y1="720" x2="1320" y2="720" class="axis"/><line x1="280" y1="720" x2="280" y2="190" class="axis"/><text x="800" y="790" text-anchor="middle" class="th">技术质量 → 高</text><text x="175" y="460" text-anchor="middle" class="th" transform="rotate(-90 175 460)">业务价值 → 高</text><rect x="305" y="210" width="480" height="230" rx="28" fill="#eee7e2" stroke="#baa495"/><text x="545" y="275" text-anchor="middle" class="th">高价值 + 低质量</text><text x="545" y="330" text-anchor="middle" class="tx">不能轻易停，又难维护</text><text x="545" y="370" text-anchor="middle" class="tx">再工程 / 渐进迁移 / 接口隔离</text><rect x="810" y="210" width="480" height="230" rx="28" fill="#eef0e7" stroke="#aab397"/><text x="1050" y="275" text-anchor="middle" class="th">高价值 + 高质量</text><text x="1050" y="330" text-anchor="middle" class="tx">业务重要且结构仍健康</text><text x="1050" y="370" text-anchor="middle" class="tx">继续运行并正常演化</text><rect x="305" y="465" width="480" height="230" rx="28" fill="#f0e7e3" stroke="#c1a196"/><text x="545" y="530" text-anchor="middle" class="th">低价值 + 低质量</text><text x="545" y="585" text-anchor="middle" class="tx">继续维护收益很低</text><text x="545" y="625" text-anchor="middle" class="tx">优先淘汰或替换</text><rect x="810" y="465" width="480" height="230" rx="28" fill="#e8efed" stroke="#9bb3ad"/><text x="1050" y="530" text-anchor="middle" class="th">低价值 + 高质量</text><text x="1050" y="585" text-anchor="middle" class="tx">技术尚可但业务意义下降</text><text x="1050" y="625" text-anchor="middle" class="tx">评估合并、归档或下线</text></svg>