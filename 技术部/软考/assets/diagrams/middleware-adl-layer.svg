<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="t d"><title id="t">构件中间件和ADL的层次</title><desc id="d">业务构件位于上层，中间件提供通信和事务等基础设施，操作系统网络位于底层，ADL从侧面描述构件连接和配置。</desc><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 23px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:18px 'Microsoft YaHei',sans-serif;fill:#665e57}</style><rect width="1500" height="850" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">构件、中间件和ADL处在同一架构的不同层次</text><text x="65" y="110" class="sub">构件承担业务，中间件隐藏通用分布式机制，ADL负责描述和约束整体配置</text><rect x="120" y="190" width="1010" height="170" rx="28" fill="#eef0e7" stroke="#aab397"/><text x="190" y="245" class="th">业务构件层</text><text x="190" y="300" class="tx">订单构件　库存构件　支付构件　报表构件</text><rect x="120" y="390" width="1010" height="190" rx="28" fill="#e8efed" stroke="#9bb3ad"/><text x="190" y="445" class="th">中间件层</text><text x="190" y="495" class="tx">RPC / 消息队列 / ORB / 事务监控 / 数据访问</text><text x="190" y="535" class="tx">处理通信、定位、序列化、消息、事务等共性机制</text><rect x="120" y="610" width="1010" height="130" rx="28" fill="#eee7e2" stroke="#baa495"/><text x="190" y="665" class="th">操作系统、网络与基础资源</text><text x="190" y="705" class="tx">进程、线程、TCP/IP、文件、设备等底层能力</text><rect x="1190" y="190" width="220" height="550" rx="28" fill="#e9e5ef" stroke="#aaa1b8"/><text x="1300" y="260" text-anchor="middle" class="th">ADL</text><text x="1300" y="325" text-anchor="middle" class="tx">构件</text><text x="1300" y="365" text-anchor="middle" class="tx">连接件</text><text x="1300" y="405" text-anchor="middle" class="tx">接口/端口</text><text x="1300" y="445" text-anchor="middle" class="tx">配置</text><text x="1300" y="485" text-anchor="middle" class="tx">约束</text><text x="1300" y="545" text-anchor="middle" class="tx">从侧面描述</text><text x="1300" y="585" text-anchor="middle" class="tx">整个架构结构</text></svg>