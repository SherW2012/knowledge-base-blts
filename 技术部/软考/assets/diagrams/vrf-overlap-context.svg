<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="t d"><title id="t">VRF与重叠私网</title><desc id="d">同一台路由器维护两套独立路由表，依靠入口接口、VLAN或其他上下文先确定VRF，再解释相同的目标私网地址</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 22px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:18px 'Microsoft YaHei',sans-serif;fill:#665e57}.em{font:700 17px 'Microsoft YaHei',sans-serif;fill:#6d6256}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1500" height="820" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">VRF · 先确定“属于哪套路由世界”，再解释目标 IP</text><text x="65" y="110" class="sub">目标 192.168.20.30 本身无法区分两个重叠私网；必须再带一个路由上下文</text><g filter="url(#s)"><rect x="80" y="205" width="330" height="225" rx="28" fill="#e7edec" stroke="#9cadaa"/><rect x="585" y="175" width="330" height="285" rx="30" fill="#eee9e2" stroke="#b9a38f"/><rect x="1090" y="205" width="330" height="225" rx="28" fill="#eef0e8" stroke="#aeb79b"/></g><text x="245" y="258" text-anchor="middle" class="th">入口上下文 A</text><text x="245" y="305" text-anchor="middle" class="tx">eth1 / VLAN 100</text><text x="245" y="345" text-anchor="middle" class="em">→ VRF-A</text><text x="245" y="387" text-anchor="middle" class="tx">目标：192.168.20.30</text><text x="750" y="228" text-anchor="middle" class="th">同一台路由器</text><rect x="635" y="285" width="230" height="70" rx="18" fill="#fbfaf7" stroke="#b9a38f"/><rect x="635" y="375" width="230" height="70" rx="18" fill="#fbfaf7" stroke="#b9a38f"/><text x="750" y="329" text-anchor="middle" class="em">VRF-A 路由表</text><text x="750" y="419" text-anchor="middle" class="em">VRF-B 路由表</text><text x="1255" y="258" text-anchor="middle" class="th">入口上下文 B</text><text x="1255" y="305" text-anchor="middle" class="tx">eth2 / VLAN 200</text><text x="1255" y="345" text-anchor="middle" class="em">→ VRF-B</text><text x="1255" y="387" text-anchor="middle" class="tx">目标：192.168.20.30</text><path d="M410 320H575" class="ln"/><path d="M1090 390H925" style="fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)"/><g filter="url(#s)"><rect x="185" y="570" width="1130" height="145" rx="28" fill="#ebe8ef" stroke="#a89fb0"/></g><text x="750" y="617" text-anchor="middle" class="th">关键规则</text><text x="750" y="660" text-anchor="middle" class="tx">不是“看到 192.168.20.30 后再猜 VRF”，而是接口/VLAN/网络命名空间/隧道等先决定 VRF</text><text x="750" y="697" text-anchor="middle" class="em">VRF + 目标IP 才能唯一决定该查哪套路由表</text></svg>