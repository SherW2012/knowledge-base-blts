<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="t d"><title id="t">VRF与重叠地址空间</title><desc id="d">同一台三层设备维护多套路由与转发表，先根据接口、VLAN或其他上下文确定VRF，再在对应路由表中解释相同的目标私网地址</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 22px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:18px 'Microsoft YaHei',sans-serif;fill:#665e57}.em{font:700 17px 'Microsoft YaHei',sans-serif;fill:#6d6256}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1500" height="820" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">VRF · 路由上下文先于目标地址查找</text><text x="65" y="110" class="sub">相同私网前缀可以存在于不同VRF；接口、VLAN、隧道等上下文决定使用哪套路由与转发表</text><g filter="url(#s)"><rect x="80" y="205" width="330" height="225" rx="28" fill="#e7edec" stroke="#9cadaa"/><rect x="585" y="175" width="330" height="285" rx="30" fill="#eee9e2" stroke="#b9a38f"/><rect x="1090" y="205" width="330" height="225" rx="28" fill="#eef0e8" stroke="#aeb79b"/></g><text x="245" y="258" text-anchor="middle" class="th">上下文 A</text><text x="245" y="305" text-anchor="middle" class="tx">eth1 / VLAN 100</text><text x="245" y="345" text-anchor="middle" class="em">关联 VRF-A</text><text x="245" y="387" text-anchor="middle" class="tx">目标：192.168.20.30</text><text x="750" y="228" text-anchor="middle" class="th">同一台三层设备</text><rect x="635" y="285" width="230" height="70" rx="18" fill="#fbfaf7" stroke="#b9a38f"/><rect x="635" y="375" width="230" height="70" rx="18" fill="#fbfaf7" stroke="#b9a38f"/><text x="750" y="329" text-anchor="middle" class="em">VRF-A 路由表</text><text x="750" y="419" text-anchor="middle" class="em">VRF-B 路由表</text><text x="1255" y="258" text-anchor="middle" class="th">上下文 B</text><text x="1255" y="305" text-anchor="middle" class="tx">eth2 / VLAN 200</text><text x="1255" y="345" text-anchor="middle" class="em">关联 VRF-B</text><text x="1255" y="387" text-anchor="middle" class="tx">目标：192.168.20.30</text><path d="M410 320H575" class="ln"/><path d="M1090 390H925" style="fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)"/><g filter="url(#s)"><rect x="185" y="570" width="1130" height="145" rx="28" fill="#ebe8ef" stroke="#a89fb0"/></g><text x="750" y="617" text-anchor="middle" class="th">查找顺序</text><text x="750" y="660" text-anchor="middle" class="tx">接口 / VLAN / 隧道 / 网络命名空间等 → 确定 VRF → 查询该 VRF 的路由表 → 解释目标 IP</text><text x="750" y="697" text-anchor="middle" class="em">目标IP相同时，不同路由上下文仍可得到不同的转发结果</text></svg>