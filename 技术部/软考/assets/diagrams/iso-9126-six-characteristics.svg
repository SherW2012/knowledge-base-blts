<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="t d"><title id="t">ISO IEC 9126-1六项产品质量特性</title><desc id="d">功能性、可靠性、易用性、效率、可维护性和可移植性。</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 24px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:17px 'Microsoft YaHei',sans-serif;fill:#665e57}</style></defs><rect width="1500" height="820" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">ISO/IEC 9126-1:2001：六项产品质量特性</text><text x="65" y="110" class="sub">旧标准已经撤销，但六项分类及其子特性仍是教材和考试中的常见口径</text>
<g filter="url(#s)"><rect x="65" y="180" width="420" height="235" rx="28" fill="#eef0e7" stroke="#abb399"/><rect x="540" y="180" width="420" height="235" rx="28" fill="#e6efed" stroke="#94afa9"/><rect x="1015" y="180" width="420" height="235" rx="28" fill="#ece5df" stroke="#b49d8c"/><rect x="65" y="465" width="420" height="235" rx="28" fill="#e9e5ef" stroke="#aaa0b8"/><rect x="540" y="465" width="420" height="235" rx="28" fill="#f1e7e3" stroke="#c1a095"/><rect x="1015" y="465" width="420" height="235" rx="28" fill="#eeeade" stroke="#b7aa83"/></g>
<text x="275" y="230" text-anchor="middle" class="th">功能性</text><text x="275" y="276" text-anchor="middle" class="tx">适合性 · 准确性</text><text x="275" y="310" text-anchor="middle" class="tx">互操作性 · 安全保密性</text><text x="275" y="362" text-anchor="middle" class="tx">需要的功能是否齐全且正确</text>
<text x="750" y="230" text-anchor="middle" class="th">可靠性</text><text x="750" y="276" text-anchor="middle" class="tx">成熟性 · 容错性 · 易恢复性</text><text x="750" y="328" text-anchor="middle" class="tx">是否少故障、能带故障工作并恢复</text>
<text x="1225" y="230" text-anchor="middle" class="th">易用性</text><text x="1225" y="276" text-anchor="middle" class="tx">易理解性 · 易学性</text><text x="1225" y="310" text-anchor="middle" class="tx">易操作性 · 吸引性</text><text x="1225" y="362" text-anchor="middle" class="tx">用户是否容易认识、学习和操作</text>
<text x="275" y="515" text-anchor="middle" class="th">效率</text><text x="275" y="561" text-anchor="middle" class="tx">时间特性 · 资源利用性</text><text x="275" y="613" text-anchor="middle" class="tx">时间和资源代价是否合理</text>
<text x="750" y="515" text-anchor="middle" class="th">可维护性</text><text x="750" y="561" text-anchor="middle" class="tx">易分析性 · 易改变性</text><text x="750" y="595" text-anchor="middle" class="tx">稳定性 · 易测试性</text><text x="750" y="647" text-anchor="middle" class="tx">是否容易定位、修改并验证</text>
<text x="1225" y="515" text-anchor="middle" class="th">可移植性</text><text x="1225" y="561" text-anchor="middle" class="tx">适应性 · 易安装性</text><text x="1225" y="595" text-anchor="middle" class="tx">共存性 · 易替换性</text><text x="1225" y="647" text-anchor="middle" class="tx">是否容易迁移、安装和替换</text></svg>
