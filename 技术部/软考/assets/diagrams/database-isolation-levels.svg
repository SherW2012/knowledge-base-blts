<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="t d"><title id="t">数据库隔离级别与并发异常</title><desc id="d">展示脏读、不可重复读、幻读与四个SQL标准隔离级别的关系</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 20px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:17px 'Microsoft YaHei',sans-serif;fill:#665e57}.ok{font:700 18px 'Microsoft YaHei',sans-serif;fill:#56776b}.bad{font:700 18px 'Microsoft YaHei',sans-serif;fill:#9b6558}</style></defs><rect width="1500" height="850" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">隔离级别规定并发异常允许暴露到什么程度</text><text x="65" y="110" class="sub">隔离越强，结果越接近串行执行；等待、冲突或版本维护成本通常也越高</text>
<g filter="url(#s)"><rect x="60" y="190" width="1380" height="465" rx="28" fill="#fffefa" stroke="#b8afa3"/></g><rect x="60" y="190" width="1380" height="90" rx="28" fill="#eee9e2"/><rect x="60" y="255" width="1380" height="25" fill="#eee9e2"/><path d="M60 280H1440M60 375H1440M60 470H1440M60 565H1440M400 190V655M720 190V655M1035 190V655" stroke="#b8afa3" stroke-width="2"/>
<text x="230" y="245" text-anchor="middle" class="th">隔离级别</text><text x="560" y="245" text-anchor="middle" class="th">脏读</text><text x="877" y="245" text-anchor="middle" class="th">不可重复读</text><text x="1237" y="245" text-anchor="middle" class="th">幻读</text><text x="230" y="340" text-anchor="middle" class="th">Read Uncommitted</text><text x="560" y="340" text-anchor="middle" class="bad">可能</text><text x="877" y="340" text-anchor="middle" class="bad">可能</text><text x="1237" y="340" text-anchor="middle" class="bad">可能</text><text x="230" y="435" text-anchor="middle" class="th">Read Committed</text><text x="560" y="435" text-anchor="middle" class="ok">防止</text><text x="877" y="435" text-anchor="middle" class="bad">可能</text><text x="1237" y="435" text-anchor="middle" class="bad">可能</text><text x="230" y="530" text-anchor="middle" class="th">Repeatable Read</text><text x="560" y="530" text-anchor="middle" class="ok">防止</text><text x="877" y="530" text-anchor="middle" class="ok">防止</text><text x="1237" y="530" text-anchor="middle" class="bad">标准允许</text><text x="230" y="625" text-anchor="middle" class="th">Serializable</text><text x="560" y="625" text-anchor="middle" class="ok">防止</text><text x="877" y="625" text-anchor="middle" class="ok">防止</text><text x="1237" y="625" text-anchor="middle" class="ok">防止</text>
<rect x="180" y="710" width="1140" height="80" rx="22" fill="#f4f1eb" stroke="#c5bcaf"/><text x="750" y="745" text-anchor="middle" class="th">标准表述是允许范围，不是所有DBMS的实际表现上限</text><text x="750" y="775" text-anchor="middle" class="tx">具体产品使用锁或MVCC后，某一级别可能额外避免部分异常</text></svg>
