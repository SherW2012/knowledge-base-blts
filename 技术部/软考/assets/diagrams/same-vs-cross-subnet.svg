<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800" role="img" aria-labelledby="t d"><title id="t">同网段与跨网段通信</title><desc id="d">对比同网段直接ARP目标主机和跨网段先找默认网关再ARP网关MAC</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 23px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:18px 'Microsoft YaHei',sans-serif;fill:#665e57}.em{font:700 17px 'Microsoft YaHei',sans-serif;fill:#6d6256}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1500" height="800" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">同网段 vs 跨网段 · ARP 到底解析谁</text><text x="65" y="110" class="sub">先由本机路由表判断下一跳，再由本机ARP表解决当前链路MAC</text><g filter="url(#s)"><rect x="80" y="190" width="640" height="500" rx="30" fill="#e7edec" stroke="#9cadaa"/><rect x="780" y="190" width="640" height="500" rx="30" fill="#eee9e2" stroke="#b9a38f"/></g><text x="400" y="245" text-anchor="middle" class="th">同网段</text><text x="1100" y="245" text-anchor="middle" class="th">跨网段</text><rect x="135" y="310" width="210" height="105" rx="22" fill="#fbfaf7" stroke="#9cadaa"/><rect x="455" y="310" width="210" height="105" rx="22" fill="#fbfaf7" stroke="#9cadaa"/><text x="240" y="350" text-anchor="middle" class="em">Host A</text><text x="240" y="382" text-anchor="middle" class="tx">192.168.10.20/24</text><text x="560" y="350" text-anchor="middle" class="em">Host B</text><text x="560" y="382" text-anchor="middle" class="tx">192.168.10.30/24</text><path d="M345 363H445" class="ln"/><text x="400" y="458" text-anchor="middle" class="em">路由表：目标是直连网段</text><text x="400" y="498" text-anchor="middle" class="tx">ARP：192.168.10.30 → Host B MAC</text><rect x="835" y="300" width="200" height="105" rx="22" fill="#fbfaf7" stroke="#b9a38f"/><rect x="1085" y="300" width="200" height="105" rx="22" fill="#fbfaf7" stroke="#b9a38f"/><text x="935" y="340" text-anchor="middle" class="em">Host A</text><text x="935" y="372" text-anchor="middle" class="tx">192.168.10.20/24</text><text x="1185" y="340" text-anchor="middle" class="em">默认网关</text><text x="1185" y="372" text-anchor="middle" class="tx">192.168.10.1</text><path d="M1035 352H1075" class="ln"/><text x="1100" y="458" text-anchor="middle" class="em">目标 192.168.20.30 不在直连网段</text><text x="1100" y="498" text-anchor="middle" class="tx">路由表：下一跳 = 192.168.10.1</text><text x="1100" y="536" text-anchor="middle" class="tx">ARP：192.168.10.1 → 网关 MAC</text><text x="400" y="625" text-anchor="middle" class="em">直接交给最终主机</text><text x="1100" y="625" text-anchor="middle" class="em">先交给下一跳路由器</text></svg>