<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="t d"><title id="t">ERP CRM SCM在企业业务链中的位置</title><desc id="d">CRM连接客户侧，ERP协调企业内部资源，SCM连接供应商与物流侧。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 23px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:18px 'Microsoft YaHei',sans-serif;fill:#665e57}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1500" height="820" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">三个系统覆盖的是同一条业务链的不同边界</text><text x="65" y="110" class="sub">CRM面向客户关系，ERP协调企业内部资源，SCM延伸到供应链上下游</text><rect x="70" y="260" width="245" height="250" rx="28" fill="#e8efed" stroke="#9bb3ad"/><rect x="405" y="220" width="690" height="330" rx="30" fill="#eef0e7" stroke="#aab397"/><rect x="1185" y="260" width="245" height="250" rx="28" fill="#eee7e2" stroke="#baa495"/><text x="192" y="320" text-anchor="middle" class="th">客户 / 市场</text><text x="192" y="370" text-anchor="middle" class="tx">线索、销售机会</text><text x="192" y="405" text-anchor="middle" class="tx">合同、服务记录</text><text x="192" y="465" text-anchor="middle" class="th">CRM</text><text x="750" y="275" text-anchor="middle" class="th">企业内部 ERP</text><g fill="#d7ddd0" stroke="#9da994"><rect x="480" y="330" width="160" height="80" rx="16"/><rect x="670" y="330" width="160" height="80" rx="16"/><rect x="860" y="330" width="160" height="80" rx="16"/><rect x="575" y="445" width="160" height="80" rx="16"/><rect x="765" y="445" width="160" height="80" rx="16"/></g><text x="560" y="378" text-anchor="middle" class="tx">销售订单</text><text x="750" y="378" text-anchor="middle" class="tx">库存</text><text x="940" y="378" text-anchor="middle" class="tx">生产</text><text x="655" y="493" text-anchor="middle" class="tx">采购</text><text x="845" y="493" text-anchor="middle" class="tx">财务</text><text x="1307" y="320" text-anchor="middle" class="th">供应链</text><text x="1307" y="370" text-anchor="middle" class="tx">供应商、物流</text><text x="1307" y="405" text-anchor="middle" class="tx">预测、补货、配送</text><text x="1307" y="465" text-anchor="middle" class="th">SCM</text><path d="M315 385H395" class="ln"/><path d="M1095 385H1175" class="ln"/><text x="750" y="660" text-anchor="middle" class="tx">一笔客户订单可以从CRM进入ERP执行，再触发SCM中的供给与物流协同</text></svg>