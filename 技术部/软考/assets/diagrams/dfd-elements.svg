<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">DFD的四种基本元素</title><desc id="desc">DFD只描述数据从哪里来、经过什么处理、存到哪里以及流向何处</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#4f493f" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c7a74"/></marker>
    <style>
      .title{font:700 25px Inter,'Microsoft YaHei',sans-serif;fill:#292724}.subtitle{font:400 13px Inter,'Microsoft YaHei',sans-serif;fill:#7c766d}
      .group{font:700 12px Inter,'Microsoft YaHei',sans-serif;fill:#8b8479;letter-spacing:.08em}.node-title{font:700 15px Inter,'Microsoft YaHei',sans-serif}.node-sub{font:400 12px Inter,'Microsoft YaHei',sans-serif;fill:#6f6a62}
      .edge{fill:none;stroke:#7c7a74;stroke-width:1.55;marker-end:url(#arrow)}.edge-label{font:600 11px Inter,'Microsoft YaHei',sans-serif;fill:#716b63}
      .note-title{font:700 12px Inter,'Microsoft YaHei',sans-serif;fill:#667166}.note{font:500 13px Inter,'Microsoft YaHei',sans-serif;fill:#514c45}
    </style>
  </defs>
  <rect width="960" height="560" rx="24" fill="#fbfaf7"/>
  <text x="48" y="50" class="title">DFD的四种基本元素</text><text x="48" y="76" class="subtitle">DFD只描述数据从哪里来、经过什么处理、存到哪里以及流向何处</text>
  
  <rect x="54" y="155" width="176" height="90" rx="14" fill="#eee6e8" stroke="#b29aa0"/><text x="142" y="192" class="node-title" text-anchor="middle" fill="#705b61">外部实体</text><text x="142" y="217" class="node-sub" text-anchor="middle">系统边界外的数据源/宿</text>
  <circle cx="400" cy="200" r="68" fill="#e7ebeb" stroke="#9aa7a6"/><text x="400" y="193" class="node-title" text-anchor="middle" fill="#536363">处理</text><text x="400" y="218" class="node-sub" text-anchor="middle">转换数据</text>
  <path d="M560 160 H810 M560 240 H810 M560 160 V240" fill="none" stroke="#9da58b" stroke-width="2"/><text x="685" y="193" class="node-title" text-anchor="middle" fill="#626b56">数据存储</text><text x="685" y="218" class="node-sub" text-anchor="middle">可被读写的数据集合</text>
  <path class="edge" d="M230 183 L330 183"/><text x="280" y="170" class="edge-label" text-anchor="middle">数据流</text><path class="edge" d="M468 217 L560 217"/>
  <rect x="84" y="340" width="792" height="114" rx="18" fill="#f4f2ed" stroke="#ddd7cd"/><text x="108" y="373" class="group">连接规则</text><text x="108" y="405" class="note">外部实体 ↔ 处理　　处理 ↔ 数据存储　　处理 ↔ 处理</text><text x="108" y="432" class="node-sub">数据流不能直接连接两个外部实体，也不能绕过处理直接连接外部实体与数据存储。</text>

  </svg>