<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="t d"><title id="t">UML类图示例</title><desc id="d">用订单领域示例说明类、属性、操作、泛化、实现、关联、聚合、组合和依赖。</desc><defs><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#fbfaf7" stroke="#6f675f"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7e756d"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 22px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:17px 'Microsoft YaHei',sans-serif;fill:#5f5851}.ln{stroke:#756d65;stroke-width:2.5;fill:none}.dash{stroke:#756d65;stroke-width:2.5;fill:none;stroke-dasharray:10 8}</style></defs><rect width="1500" height="820" rx="34" fill="#fbfaf7"/><text x="65" y="70" class="h">类图：看“类型、职责与静态关系”</text><text x="65" y="108" class="sub">类图不是对象运行过程，而是系统静态类型结构的蓝图</text><g><rect x="100" y="215" width="300" height="210" rx="12" fill="#eef0e7" stroke="#9ea78d"/><line x1="100" y1="270" x2="400" y2="270" class="ln"/><line x1="100" y1="345" x2="400" y2="345" class="ln"/><text x="250" y="250" text-anchor="middle" class="th">Order</text><text x="125" y="305" class="tx">- orderId: String</text><text x="125" y="333" class="tx">- status: OrderStatus</text><text x="125" y="382" class="tx">+ submit()</text><text x="125" y="410" class="tx">+ cancel()</text></g><g><rect x="600" y="215" width="300" height="180" rx="12" fill="#e8efed" stroke="#9bb3ad"/><line x1="600" y1="270" x2="900" y2="270" class="ln"/><line x1="600" y1="330" x2="900" y2="330" class="ln"/><text x="750" y="250" text-anchor="middle" class="th">OrderItem</text><text x="625" y="305" class="tx">- quantity: int</text><text x="625" y="365" class="tx">+ subtotal()</text></g><line x1="400" y1="305" x2="600" y2="305" class="ln"/><polygon points="400,305 418,294 436,305 418,316" fill="#6f675f"/><text x="430" y="287" class="tx">组合</text><text x="470" y="337" class="tx">1</text><text x="555" y="337" class="tx">1..*</text><g><rect x="1050" y="195" width="300" height="140" rx="12" fill="#f0e7e3" stroke="#c1a196"/><text x="1200" y="235" text-anchor="middle" class="tx">«interface»</text><text x="1200" y="270" text-anchor="middle" class="th">PaymentGateway</text><text x="1200" y="305" text-anchor="middle" class="tx">+ pay()</text></g><g><rect x="1050" y="470" width="300" height="155" rx="12" fill="#eeeade" stroke="#b7aa83"/><text x="1200" y="515" text-anchor="middle" class="th">StripeAdapter</text><line x1="1050" y1="540" x2="1350" y2="540" class="ln"/><text x="1080" y="580" class="tx">+ pay()</text></g><path d="M1200 470V345" class="dash" marker-end="url(#tri)"/><text x="1220" y="418" class="tx">实现</text><g><rect x="520" y="540" width="300" height="150" rx="12" fill="#e9e5ef" stroke="#aaa1b8"/><text x="670" y="585" text-anchor="middle" class="th">OrderService</text><line x1="520" y1="610" x2="820" y2="610" class="ln"/><text x="545" y="650" class="tx">+ createOrder()</text></g><path d="M820 605C930 605 980 555 1050 550" class="dash" marker-end="url(#arr)"/><text x="925" y="585" class="tx">依赖</text><g><rect x="105" y="555" width="270" height="120" rx="12" fill="#f4f1eb" stroke="#bab1a6"/><text x="240" y="600" text-anchor="middle" class="th">DigitalOrder</text><text x="240" y="638" text-anchor="middle" class="tx">Order 的特殊类型</text></g><path d="M240 555V440H250V425" class="ln" marker-end="url(#tri)"/><text x="265" y="505" class="tx">泛化</text><text x="65" y="760" class="tx">判断关系时先问语义：是一种？整体—部分？长期结构关联？只是在局部使用？不要只背箭头。</text></svg>