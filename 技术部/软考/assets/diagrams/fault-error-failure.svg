<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="t d"><title id="t">故障错误失效因果链</title><desc id="d">软件缺陷在特定条件下被激活形成内部错误状态，错误传播到系统边界后形成外部失效。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 24px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:18px 'Microsoft YaHei',sans-serif;fill:#665e57}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1500" height="760" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">可靠性问题从内部缺陷开始，到外部服务偏离结束</text><text x="65" y="110" class="sub">缺陷存在不代表立刻失效，中间还要经历触发、错误状态和传播</text><rect x="95" y="240" width="310" height="250" rx="30" fill="#eef0e7" stroke="#aab397"/><rect x="595" y="240" width="310" height="250" rx="30" fill="#eee7e2" stroke="#baa495"/><rect x="1095" y="240" width="310" height="250" rx="30" fill="#f0e7e3" stroke="#c1a196"/><text x="250" y="305" text-anchor="middle" class="th">故障 Fault</text><text x="250" y="355" text-anchor="middle" class="tx">代码、设计、配置中的</text><text x="250" y="390" text-anchor="middle" class="tx">潜在缺陷</text><text x="750" y="305" text-anchor="middle" class="th">错误 Error</text><text x="750" y="355" text-anchor="middle" class="tx">缺陷被触发后形成的</text><text x="750" y="390" text-anchor="middle" class="tx">内部错误状态</text><text x="1250" y="305" text-anchor="middle" class="th">失效 Failure</text><text x="1250" y="355" text-anchor="middle" class="tx">错误传播到系统边界</text><text x="1250" y="390" text-anchor="middle" class="tx">服务偏离规格</text><path d="M405 365H585" class="ln"/><path d="M905 365H1085" class="ln"/><text x="495" y="330" text-anchor="middle" class="tx">特定输入/环境触发</text><text x="995" y="330" text-anchor="middle" class="tx">错误状态继续传播</text><text x="750" y="610" text-anchor="middle" class="tx">容错机制可以在“错误 → 失效”之间检测、隔离或恢复，使内部错误不必然变成外部失效</text></svg>