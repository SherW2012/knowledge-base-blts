<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="t d"><title id="t">企业应用集成的四个层次</title><desc id="d">从数据集成、应用接口集成、业务过程集成到表示层集成，说明各自连接对象。</desc><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 23px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:18px 'Microsoft YaHei',sans-serif;fill:#665e57}</style><rect width="1500" height="850" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">系统“连起来”可以发生在不同层次</text><text x="65" y="110" class="sub">越向上越接近完整业务协同，但并不意味着底层数据和接口问题自动消失</text><rect x="150" y="180" width="1200" height="125" rx="25" fill="#f0e7e3" stroke="#c1a196"/><text x="215" y="230" class="th">表示 / 门户集成</text><text x="215" y="270" class="tx">把多个系统的信息放到统一入口中，解决用户访问和展示的一致性</text><rect x="150" y="330" width="1200" height="125" rx="25" fill="#e9e5ef" stroke="#aaa1b8"/><text x="215" y="380" class="th">业务过程集成</text><text x="215" y="420" class="tx">把订单、库存、发货、开票等跨系统活动编排成端到端流程</text><rect x="150" y="480" width="1200" height="125" rx="25" fill="#e8efed" stroke="#9bb3ad"/><text x="215" y="530" class="th">应用接口集成</text><text x="215" y="570" class="tx">通过API、消息、远程调用使用对方能力，避免直接依赖内部表结构</text><rect x="150" y="630" width="1200" height="125" rx="25" fill="#eef0e7" stroke="#aab397"/><text x="215" y="680" class="th">数据集成</text><text x="215" y="720" class="tx">统一编码、主数据和数据同步，让多个应用对同一业务事实形成一致理解</text></svg>