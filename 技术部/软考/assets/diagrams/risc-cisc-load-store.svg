<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="t d"><title id="t">RISC的Load Store执行路径</title><desc id="d">内存通过Load和Store与寄存器交换数据，算术逻辑运算主要在寄存器与ALU之间完成</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><marker id="ab" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0L0 5L10 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 23px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:18px 'Microsoft YaHei',sans-serif;fill:#665e57}.em{font:700 18px 'Microsoft YaHei',sans-serif;fill:#6d6256}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}.bi{fill:none;stroke:#8c847a;stroke-width:3;marker-start:url(#ab);marker-end:url(#a)}</style></defs><rect width="1500" height="760" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">RISC · 指令为什么强调 Load / Store</text><text x="65" y="110" class="sub">把“访问内存”和“执行运算”分开，寄存器成为CPU内部的数据工作台</text><g filter="url(#s)"><rect x="90" y="220" width="310" height="260" rx="28" fill="#eee9e2" stroke="#b9a38f"/><rect x="565" y="180" width="350" height="340" rx="28" fill="#e7edec" stroke="#9cadaa"/><rect x="1090" y="220" width="310" height="260" rx="28" fill="#ebe8ef" stroke="#a89fb0"/></g><text x="245" y="275" text-anchor="middle" class="th">主存 / Cache</text><text x="245" y="325" text-anchor="middle" class="tx">A、B、C 等程序数据</text><text x="245" y="365" text-anchor="middle" class="tx">不能直接当作ALU工作寄存器</text><text x="740" y="235" text-anchor="middle" class="th">寄存器文件</text><rect x="635" y="285" width="210" height="54" rx="14" fill="#f4f1eb" stroke="#c5bcaf"/><rect x="635" y="355" width="210" height="54" rx="14" fill="#f4f1eb" stroke="#c5bcaf"/><rect x="635" y="425" width="210" height="54" rx="14" fill="#f4f1eb" stroke="#c5bcaf"/><text x="740" y="320" text-anchor="middle" class="tx">R1 = A</text><text x="740" y="390" text-anchor="middle" class="tx">R2 = B</text><text x="740" y="460" text-anchor="middle" class="tx">R3 = 结果</text><text x="1245" y="275" text-anchor="middle" class="th">ALU</text><text x="1245" y="330" text-anchor="middle" class="tx">ADD · AND · CMP</text><text x="1245" y="375" text-anchor="middle" class="tx">主要处理寄存器操作数</text><path d="M400 300H555" class="ln"/><text x="478" y="282" text-anchor="middle" class="em">LOAD</text><path d="M565 430H410" class="ln"/><text x="488" y="458" text-anchor="middle" class="em">STORE</text><path d="M915 350H1080" class="bi"/><text x="995" y="330" text-anchor="middle" class="em">运算</text><rect x="245" y="590" width="1010" height="86" rx="22" fill="#f3efe8" stroke="#cabfaf"/><text x="750" y="624" text-anchor="middle" class="th">Load / Store 是RISC的高频识别特征</text><text x="750" y="655" text-anchor="middle" class="tx">指令更规整、寄存器操作更集中，有利于译码和流水线；不等于现代RISC内部只能采用一种实现</text></svg>