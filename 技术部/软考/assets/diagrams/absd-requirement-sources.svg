<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="t d">
  <title id="t">ABSD体系结构需求的三类目标来源</title><desc id="d">系统质量目标、系统商业目标和开发组织商业目标共同形成架构驱动因素，功能需求定义系统能力边界</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c847a"/></marker><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 23px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:17px 'Microsoft YaHei',sans-serif;fill:#665e57}.em{font:700 18px 'Microsoft YaHei',sans-serif;fill:#8d6558}.ln{fill:none;stroke:#8c847a;stroke-width:3;marker-end:url(#a)}</style></defs>
  <rect width="1500" height="850" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">三类目标决定架构为什么这样设计</text><text x="65" y="110" class="sub">目标先转化为可判断的驱动因素，再影响风格、战术、构件和部署决策</text>
  <g filter="url(#s)"><rect x="65" y="185" width="390" height="235" rx="28" fill="#eef0e8" stroke="#aeb79b"/><rect x="555" y="185" width="390" height="235" rx="28" fill="#e6efed" stroke="#94afa9"/><rect x="1045" y="185" width="390" height="235" rx="28" fill="#eee9e2" stroke="#b9a38f"/></g>
  <text x="260" y="235" text-anchor="middle" class="th">系统的质量目标</text><text x="260" y="280" text-anchor="middle" class="tx">性能 · 可用性 · 安全性</text><text x="260" y="318" text-anchor="middle" class="tx">可修改性 · 可测试性</text><text x="260" y="370" text-anchor="middle" class="em">系统要做到什么水平</text>
  <text x="750" y="235" text-anchor="middle" class="th">系统的商业目标</text><text x="750" y="280" text-anchor="middle" class="tx">业务价值 · 上线时间 · 预算</text><text x="750" y="318" text-anchor="middle" class="tx">法规 · 市场与持续经营</text><text x="750" y="370" text-anchor="middle" class="em">为什么建设这个系统</text>
  <text x="1240" y="235" text-anchor="middle" class="th">开发组织的商业目标</text><text x="1240" y="280" text-anchor="middle" class="tx">平台复用 · 技术能力 · 成本</text><text x="1240" y="318" text-anchor="middle" class="tx">长期维护 · 供应商依赖</text><text x="1240" y="370" text-anchor="middle" class="em">开发方怎样持续交付</text>
  <path d="M260 420C260 500 560 500 650 555" class="ln"/><path d="M750 420V545" class="ln"/><path d="M1240 420C1240 500 940 500 850 555" class="ln"/>
  <g filter="url(#s)"><rect x="535" y="555" width="430" height="135" rx="28" fill="#ebe7f0" stroke="#aaa0bf"/></g><text x="750" y="605" text-anchor="middle" class="th">架构驱动因素</text><text x="750" y="645" text-anchor="middle" class="tx">经过具体化、优先级排序并具有全局影响</text>
  <rect x="245" y="750" width="1010" height="65" rx="20" fill="#f4f1eb" stroke="#c5bcaf"/><text x="750" y="790" text-anchor="middle" class="tx">功能需求定义系统必须提供的能力，并与三类目标共同参与架构需求提炼</text><path d="M750 740V700" class="ln"/>
</svg>
