<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="t d"><title id="t">四类常见非关系数据库</title><desc id="d">键值、文档、列族和图数据库的数据组织、访问方式与典型场景</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#665e55" flood-opacity=".12"/></filter><style>.h{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746c64}.th{font:700 25px 'Microsoft YaHei',sans-serif;fill:#48413b}.tx{font:17px 'Microsoft YaHei',sans-serif;fill:#665e57}.code{font:16px Consolas,'Microsoft YaHei',sans-serif;fill:#504a44}.node{fill:#fffefa;stroke:#998f83;stroke-width:2}</style></defs><rect width="1500" height="850" rx="34" fill="#fbfaf7"/><text x="65" y="72" class="h">NoSQL不是一种模型，而是多种数据组织方式</text><text x="65" y="110" class="sub">先看主要数据结构和访问路径，再讨论事务、查询与扩展能力</text>
<g filter="url(#s)"><rect x="60" y="170" width="330" height="545" rx="28" fill="#eef0e8" stroke="#aeb79b"/><rect x="410" y="170" width="330" height="545" rx="28" fill="#e6efed" stroke="#94afa9"/><rect x="760" y="170" width="330" height="545" rx="28" fill="#eee9e2" stroke="#b9a38f"/><rect x="1110" y="170" width="330" height="545" rx="28" fill="#ebe7f0" stroke="#aaa0bf"/></g><text x="225" y="220" text-anchor="middle" class="th">键值</text><text x="575" y="220" text-anchor="middle" class="th">文档</text><text x="925" y="220" text-anchor="middle" class="th">列族</text><text x="1275" y="220" text-anchor="middle" class="th">图</text>
<rect x="105" y="280" width="240" height="85" rx="15" class="node"/><text x="225" y="315" text-anchor="middle" class="code">session:8f31</text><text x="225" y="345" text-anchor="middle" class="code">→ { userId: 17 }</text><text x="225" y="420" text-anchor="middle" class="tx">主要按唯一键定位值</text><text x="225" y="470" text-anchor="middle" class="tx">缓存 · 会话 · 计数器</text>
<rect x="465" y="270" width="220" height="145" rx="15" class="node"/><text x="490" y="305" class="code">{</text><text x="510" y="335" class="code">"id": 17,</text><text x="510" y="365" class="code">"tags": [...]</text><text x="490" y="395" class="code">}</text><text x="575" y="460" text-anchor="middle" class="tx">嵌套字段组成聚合文档</text><text x="575" y="510" text-anchor="middle" class="tx">内容 · 配置 · 商品目录</text>
<rect x="805" y="275" width="240" height="145" rx="15" class="node"/><path d="M805 325H1045M805 372H1045M885 275V420" stroke="#998f83"/><text x="845" y="310" text-anchor="middle" class="code">row key</text><text x="965" y="310" text-anchor="middle" class="code">column family</text><text x="925" y="465" text-anchor="middle" class="tx">按行键组织稀疏列</text><text x="925" y="515" text-anchor="middle" class="tx">海量分布式明细数据</text>
<circle cx="1200" cy="310" r="35" class="node"/><circle cx="1350" cy="310" r="35" class="node"/><circle cx="1275" cy="415" r="35" class="node"/><path d="M1235 310H1315M1220 340L1255 385M1330 340L1295 385" stroke="#998f83" stroke-width="3"/><text x="1275" y="490" text-anchor="middle" class="tx">结点、边和属性直接表达关系</text><text x="1275" y="540" text-anchor="middle" class="tx">权限 · 依赖 · 知识图谱</text>
<text x="750" y="790" text-anchor="middle" class="sub">同一个系统可以组合多种数据库，但必须承担同步、一致性和运维复杂度</text></svg>
