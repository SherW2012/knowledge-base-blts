<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">SQL注入的分层防护体系</title>
  <desc id="desc">从请求入口、应用构造、权限控制、数据库到监测响应的多层防护结构。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#625b54" flood-opacity=".13"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8f877e"/></marker>
    <style>.title{font:700 38px 'Microsoft YaHei',sans-serif;fill:#282522}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#746d65}.head{font:700 22px 'Microsoft YaHei',sans-serif;fill:#48423d}.text{font:17px 'Microsoft YaHei',sans-serif;fill:#665f58}.line{stroke:#8f877e;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1500" height="760" rx="34" fill="#fbfaf7"/>
  <text x="65" y="72" class="title">SQL注入需要分层防护</text>
  <text x="65" y="110" class="sub">参数化查询负责守住结构与数据的边界，其他措施限制入口、权限、影响范围并帮助发现异常</text>

  <g filter="url(#shadow)">
    <rect x="55" y="195" width="235" height="250" rx="26" fill="#eef0e8" stroke="#aeb59a"/>
    <rect x="345" y="195" width="235" height="250" rx="26" fill="#e6efed" stroke="#94b0aa"/>
    <rect x="635" y="175" width="235" height="290" rx="26" fill="#e8e1da" stroke="#b59b89" stroke-width="2"/>
    <rect x="925" y="195" width="235" height="250" rx="26" fill="#ebe7ef" stroke="#aaa0b8"/>
    <rect x="1215" y="195" width="235" height="250" rx="26" fill="#f1e8e4" stroke="#c3a397"/>
  </g>
  <text x="172" y="245" text-anchor="middle" class="head">入口约束</text>
  <text x="172" y="292" text-anchor="middle" class="text">类型、长度、格式</text><text x="172" y="326" text-anchor="middle" class="text">拒绝无效业务输入</text><text x="172" y="378" text-anchor="middle" class="text">不能替代参数化</text>
  <text x="462" y="245" text-anchor="middle" class="head">动态结构白名单</text>
  <text x="462" y="292" text-anchor="middle" class="text">表名、列名、排序字段</text><text x="462" y="326" text-anchor="middle" class="text">映射到固定SQL片段</text><text x="462" y="378" text-anchor="middle" class="text">拒绝任意文本替换</text>
  <text x="752" y="230" text-anchor="middle" class="head">参数化查询</text>
  <text x="752" y="280" text-anchor="middle" class="text">固定SQL结构</text><text x="752" y="314" text-anchor="middle" class="text">单独绑定参数值</text><text x="752" y="365" text-anchor="middle" class="head">核心边界</text><text x="752" y="402" text-anchor="middle" class="text">阻止数据成为SQL语法</text>
  <text x="1042" y="245" text-anchor="middle" class="head">最小权限</text>
  <text x="1042" y="292" text-anchor="middle" class="text">限制数据库账号能力</text><text x="1042" y="326" text-anchor="middle" class="text">隔离不同业务权限</text><text x="1042" y="378" text-anchor="middle" class="text">缩小漏洞影响范围</text>
  <text x="1332" y="245" text-anchor="middle" class="head">监测与响应</text>
  <text x="1332" y="292" text-anchor="middle" class="text">错误控制、安全日志</text><text x="1332" y="326" text-anchor="middle" class="text">异常查询和行为告警</text><text x="1332" y="378" text-anchor="middle" class="text">WAF作为辅助措施</text>
  <path d="M290 320H335" class="line"/><path d="M580 320H625" class="line"/><path d="M870 320H915" class="line"/><path d="M1160 320H1205" class="line"/>

  <rect x="155" y="555" width="1190" height="120" rx="28" fill="#f4f1eb" stroke="#b9b0a5"/>
  <text x="750" y="603" text-anchor="middle" class="head">任何单一措施都不是完整防线</text>
  <text x="750" y="643" text-anchor="middle" class="text">参数化解决SQL结构被改变的问题；身份认证、授权和数据范围控制仍负责阻止合法语句造成越权访问</text>
</svg>
